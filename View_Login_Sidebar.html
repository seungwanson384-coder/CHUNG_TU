<!-- ========================================================================
     1. LOGIN SCREEN
     ======================================================================== -->
<section id="loginScreen" class="login-screen login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo-circle brand-logo-circle-login">
        <img
          id="loginBrandLogo"
          class="brand-logo-img"
          src="https://drive.google.com/thumbnail?id=1Hjf2eCislKARBB8twtPHunvKviVJS6vq&sz=w300"
          alt="Logo"
        />
      </div>
      <div>
        <h1 class="login-title">Hệ thống xuất chứng từ XNK tự động</h1>
      </div>
    </div>

    <div id="loginError" class="login-error hidden"></div>

    <form id="loginForm" class="login-form" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="loginMaSV">Tên đăng nhập</label>
        <input
          id="loginMaSV"
          type="text"
          class="form-control"
          placeholder="admin"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="loginMatKhau">Mật khẩu</label>
        <input
          id="loginMatKhau"
          type="password"
          class="form-control"
          placeholder="AD001"
          autocomplete="current-password"
          required
        />
      </div>

      <button id="btnLogin" type="submit" class="btn btn-primary btn-block">
        Đăng nhập hệ thống
      </button>
    </form>
  </div>
</section>

<!-- ========================================================================
     2. AUTHENTICATED APP SHELL (STICKY HEADER + LEFT SIDEBAR)
     ======================================================================== -->
<div id="appShell" class="app-shell app-layout hidden">
  <header class="app-header top-header">
    <div class="header-left">
      <button type="button" class="mobile-menu-btn" onclick="toggleMobileSidebar()" title="Menu">
        &#9776;
      </button>
      <div class="brand-logo-circle">
        <img
          id="headerBrandLogo"
          class="brand-logo-img"
          src="https://drive.google.com/thumbnail?id=1Hjf2eCislKARBB8twtPHunvKviVJS6vq&sz=w300"
          alt="Logo"
        />
      </div>
      <div class="header-title-wrap">
        <h1 class="header-title">Hệ thống xuất chứng từ XNK tự động</h1>
      </div>
    </div>

    <div class="header-actions">
      <div id="userBadge" class="user-badge">
        <span class="user-avatar-dot"></span>
        <span id="userBadgeText">Sinh viên</span>
      </div>
      <button type="button" class="btn btn-danger-outline" onclick="openClearConfirmModal()">
        Xóa dữ liệu
      </button>
      <button type="button" class="btn btn-primary" onclick="handleSaveDraft()">
        Lưu nháp
      </button>
      <button type="button" class="btn btn-primary" onclick="openBatchExportModal()">
        Xuất hàng loạt
      </button>
      <button type="button" class="btn btn-secondary" onclick="handleLogout()">
        Đăng xuất
      </button>
    </div>
  </header>
