<!-- ========================================================================
     1. LOGIN SCREEN
     ======================================================================== -->
<section id="loginScreen" class="login-screen login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo-circle brand-logo-circle-login">
        <img
          id="loginBrandLogo"
          class="brand-logo-img"
          src="https://drive.google.com/thumbnail?id=1Hjf2eCislKARBB8twtPHunvKviVJS6vq&sz=w300"
          alt="Logo"
        />
      </div>
      <div>
        <h1 class="login-title">Hệ thống xuất chứng từ XNK tự động</h1>
      </div>
    </div>

    <div id="loginError" class="login-error hidden"></div>

    <form id="loginForm" class="login-form" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="loginMaSV">Tên đăng nhập</label>
        <input
          id="loginMaSV"
          type="text"
          class="form-control"
          placeholder="admin"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="loginMatKhau">Mật khẩu</label>
        <input
          id="loginMatKhau"
          type="password"
          class="form-control"
          placeholder="AD001"
          autocomplete="current-password"
          required
        />
      </div>

      <button id="btnLogin" type="submit" class="btn btn-primary btn-block">
        Đăng nhập hệ thống
      </button>
    </form>
  </div>
</section>
