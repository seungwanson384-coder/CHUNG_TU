<!-- ========================================================================
     1. LOGIN SCREEN
     ======================================================================== -->
<section id="loginScreen" class="login-screen login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">XNK</div>
      <div>
        <h1 class="login-title">Hệ thống Chứng từ XNK</h1>
      </div>
    </div>

    <div id="loginError" class="login-error hidden"></div>

    <form id="loginForm" class="login-form" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="loginMaSV">Tên đăng nhập</label>
        <input
          id="loginMaSV"
          type="text"
          class="form-control"
          placeholder="Rohwan"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="loginMatKhau">Mật khẩu</label>
        <input
          id="loginMatKhau"
          type="password"
          class="form-control"
          placeholder="NV003"
          autocomplete="current-password"
          required
        />
      </div>

      <button id="btnLogin" type="submit" class="btn btn-primary btn-block">
        Đăng nhập hệ thống
      </button>
    </form>
  </div>
</section>

<!-- ========================================================================
     2. AUTHENTICATED APP SHELL (STICKY HEADER + LEFT SIDEBAR)
     ======================================================================== -->
