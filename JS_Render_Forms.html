function getComboboxOptionsForSource(source) {
  const key = String(source || '').trim();
  if (!key || typeof APP_STATE === 'undefined' || !APP_STATE.dropdowns) return [];

  const dm = APP_STATE.dropdowns.danhMucChung || {};
  const cuocTau = Array.isArray(APP_STATE.dropdowns.cuocTau) ? APP_STATE.dropdowns.cuocTau : [];

  if (key === 'QUOC_GIA') {
    const base = Array.isArray(dm.QUOC_GIA) ? dm.QUOC_GIA : [];
    const fromRoutes = cuocTau.map(function (r) { return String(r.Quoc_Gia || '').trim(); }).filter(Boolean);
    return Array.from(new Set(base.concat(fromRoutes)));
  }

  if (key === 'FREIGHT') {
    const base = Array.isArray(dm.FREIGHT) && dm.FREIGHT.length > 0 ? dm.FREIGHT : ['PREPAID', 'COLLECT'];
    return base;
  }

  if (key === 'XNK_XK' || key === 'XNK_NK') {
    const dir = key === 'XNK_XK' ? 'Xuất' : 'Nhập';
    const rows = typeof getFilteredLoaiHinhXnk === 'function' ? getFilteredLoaiHinhXnk(dir) : [];
    return rows.map(function (r) {
      const code = String(r.Ma_loai_hinh || r.ma || r.code || '').trim();
      const name = String(r.Ten_loai_hinh || r.ten || r.name || '').trim();
      return code && name ? (code + ' - ' + name) : (code || name);
    }).filter(Boolean);
  }

  if (key === 'TOTAL_CONTAINERS_TEXT') {
    const cur = APP_STATE.shared && APP_STATE.shared.TOTAL_CONTAINERS_TEXT ? String(APP_STATE.shared.TOTAL_CONTAINERS_TEXT).trim() : '';
    return cur ? [cur] : [];
  }

  if (Array.isArray(dm[key])) {
    return dm[key];
  }

  return [];
}

function initCustomComboboxSystem() {
  const scheduleSources = { POL: true, POD: true, CAR_NAME: true, VESSEL: true, VOYAGE: true };
  document.querySelectorAll('input[data-combo]').forEach(function (inp) {
    const source = inp.getAttribute('data-combo');
    if (!source) return;

    const dlId = scheduleSources[source] ? ('dl_' + source) : ('dl_combo_' + source);
    inp.setAttribute('list', dlId);

    if (scheduleSources[source] && document.getElementById(dlId)) {
      return;
    }

    let dl = document.getElementById(dlId);
    if (!dl) {
      dl = document.createElement('datalist');
      dl.id = dlId;
      document.body.appendChild(dl);
    }

    const opts = getComboboxOptionsForSource(source);
    dl.innerHTML = opts.map(function (v) {
      return '<option value="' + escapeHtml(v) + '"></option>';
    }).join('');
  });
}

function renderAllFormViews() {
  const container = document.getElementById('workspacePanels');
  if (!container) return;

  let html = '';
  Object.keys(DOC_FORM_CONFIGS).forEach(function (docKey) {
    html += buildPanelHtml(docKey, DOC_FORM_CONFIGS[docKey]);
  });
  container.innerHTML = html;

  initCustomComboboxSystem();
  syncAllStateValuesToDOM();
  validateContainerInputsInDOM();
  renderBatchExportChecklist();

  if (APP_STATE.user && APP_STATE.user.role === 'ADMIN') {
    loadAdminAccountsTables();
  }

  Object.keys(APP_STATE.exportResults).forEach(function (docKey) {
    renderSingleExportResultBox(docKey);
  });

  if (!workspaceListenersAttached) {
    container.addEventListener('input', onWorkspaceInputOrChange);
    container.addEventListener('change', onWorkspaceInputOrChange);
    workspaceListenersAttached = true;
  }
}

function onWorkspaceInputOrChange(event) {
  const target = event.target;
  if (!target) return;

  if (target.hasAttribute('data-sync')) {
    handleWorkspaceFieldChange(target);
  } else if (target.hasAttribute('data-table-type')) {
    handleTableCellChange(target);
  }
}

  const isActive = APP_STATE.activeTab === docKey ? ' active' : '';
  let html = '<section class="doc-panel' + isActive + '" data-tab-panel="' + docKey + '">';

    html += '<div class="card form-card section-box"><div class="card-header"><h3 class="card-title">2. Nạp hàng loạt từ file Excel / CSV hoặc Google Sheets (Có ánh xạ cột &amp; Xem trước)</h3></div><div class="card-body" style="display:flex; flex-direction:column; gap:16px;">';
    html += '<div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">';
    html += '<div class="form-group" style="flex:1; min-width:260px;"><label class="form-label">Chọn file Excel / CSV cục bộ</label><input type="file" id="adminExcelFileInput" class="form-control" accept=".xlsx, .xls, .csv" onchange="handleExcelFileSelected(event)" /></div>';
    html += '</div>';
    html += '<div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">';
    html += '<div class="form-group" style="flex:1; min-width:280px;"><label class="form-label">Link hoặc ID Google Sheets bên ngoài</label><input type="text" id="adminSheetUrlInput" class="form-control" placeholder="https://docs.google.com/spreadsheets/d/..." /></div>';

    html += '<div style="font-weight:700; color:#0B261C;">Ánh xạ cột dữ liệu &amp; Xem trước trước khi nạp:</div>';
    html += '<div class="form-grid form-grid-3">';
    html += '<div class="form-group"><label class="form-label">Cột Mã sinh viên (Mật khẩu) *</label><select id="mapColMaSV" class="form-control" onchange="updateMappingPreview()"></select></div>';
    html += '<div class="form-group"><label class="form-label">Cột Tên sinh viên (Tên đăng nhập) *</label><select id="mapColTenSV" class="form-control" onchange="updateMappingPreview()"></select></div>';
    html += '<div class="form-group"><label class="form-label">Ghép thêm cột Tên (nếu file tách Họ &amp; Tên)</label><select id="mapColTenSub" class="form-control" onchange="updateMappingPreview()"><option value="">-- Không ghép --</option></select></div>';
    html += '<div class="form-group"><label class="form-label">Cột Vai trò (Tùy chọn)</label><select id="mapColVaiTro" class="form-control" onchange="updateMappingPreview()"><option value="">-- Mặc định tất cả là Sinh viên (SV) --</option></select></div>';
    html += '</div>';
    html += '<div class="table-scroll" style="max-height:220px;"><table class="data-table"><thead><tr><th style="width:46px;">STT</th><th>Mã SV</th><th>Tên SV</th><th>Vai trò</th><th>Trạng thái hợp lệ</th></tr></thead><tbody id="mappingPreviewTbody"></tbody></table></div>';
    html += '<div style="display:flex; justify-content:flex-end;"><button type="button" class="btn btn-success" onclick="confirmBulkImport()">Xác nhận nạp vào hệ thống</button></div>';
    html += '</div>';

    html += '</div></div>';

    // Section 3A: Admin Accounts Table
    html += '<div class="card form-card table-card dynamic-table-wrapper"><div class="card-header table-card-header"><div><h3 class="card-title">3A. Danh sách Quản trị viên (ADMIN)</h3></div><button type="button" class="btn btn-table-add btn-sm" onclick="loadAdminAccountsTables()">Làm mới</button></div>';
    html += '<div class="card-body table-card-body" style="padding:12px;"><div class="table-scroll"><table class="data-table"><thead><tr>';
    html += '<th style="width:46px; text-align:center;">STT</th>';
    html += '<th style="min-width:130px;">Mã Admin</th>';
    html += '<th style="min-width:180px;">Tên Admin</th>';
    html += '<th style="min-width:110px;">Vai trò</th>';
    html += '<th style="width:70px; text-align:center;">Thao tác</th>';
    html += '</tr></thead><tbody id="adminAdminsTableBody"><tr><td colspan="5" class="empty-table-note">Đang tải danh sách Quản trị viên...</td></tr></tbody></table></div></div></div>';

    // Section 3B: Student Accounts Table with Bulk Delete
    html += '<div class="card form-card table-card dynamic-table-wrapper"><div class="card-header table-card-header"><div><h3 class="card-title">3B. Danh sách Sinh viên (SV)</h3></div>';
    html += '<div style="display:flex; gap:8px; align-items:center;">';
    html += '<button type="button" class="btn btn-sm btn-danger-outline" onclick="handleDeleteSelectedStudents()">Xóa mục đã chọn</button>';
    html += '<button type="button" class="btn btn-sm btn-danger-outline" onclick="handleDeleteAllStudents()">Xóa tất cả Sinh viên</button>';
    html += '</div></div>';
    html += '<div class="card-body table-card-body" style="padding:12px;"><div class="table-scroll"><table class="data-table"><thead><tr>';
    html += '<th style="width:40px; text-align:center;"><input type="checkbox" id="selectAllStudentsCheckbox" onclick="toggleSelectAllStudents(this)" /></th>';
    html += '<th style="width:46px; text-align:center;">STT</th>';
    html += '<th style="min-width:130px;">Mã SV</th>';
    html += '<th style="min-width:180px;">Tên SV</th>';
    html += '<th style="min-width:110px;">Vai trò</th>';
    html += '<th style="width:70px; text-align:center;">Thao tác</th>';
    html += '</tr></thead><tbody id="adminStudentsTableBody"><tr><td colspan="6" class="empty-table-note">Đang tải danh sách Sinh viên...</td></tr></tbody></table></div></div></div>';

    html += '</section>';
    return html;
  }

  html += '<div class="doc-panel-header">';
  html += '<div>';
  html += '<h2 class="doc-panel-title">' + escapeHtml(cfg.title) + '</h2>';
  html += '</div>';
  if (!cfg.isMaster) {
    html += '<div class="doc-panel-actions">';
    html += '<button type="button" class="btn btn-secondary" onclick="handlePreviewDocument(\'' + docKey + '\')">Review Document</button>';
    html += '<button type="button" class="btn btn-primary" onclick="handleExportSingle(\'' + docKey + '\')">Export This Document</button>';
    html += '</div>';
  }
  html += '</div>';

  if (!cfg.isMaster) {
    const ship = String(APP_STATE.shared.SHIP_NAME || '').trim() || 'Chưa nhập Người xuất khẩu';
    const cne = String(APP_STATE.shared.CNE_NAME || '').trim() || 'Chưa nhập Người nhập khẩu';
    html += '<div class="context-banner">';
    html += '<div class="context-banner-parties"><strong>' + escapeHtml(ship) + '</strong> &#10132; <strong>' + escapeHtml(cne) + '</strong></div>';
    html += '<button type="button" class="context-banner-link" onclick="switchTab(\'MASTER_PARTIES\')">Sửa Thông tin chung</button>';
    html += '</div>';
  }

  if (!cfg.isMaster) {
    html += '<div id="exportResult_' + docKey + '" class="export-result-box hidden" style="margin-top:0; margin-bottom:18px;"></div>';
  }

  (cfg.sections || []).forEach(function (sec) {
    const gridClass = sec.gridCols === 4 ? 'form-grid form-grid-4' : 'form-grid form-grid-3';
    html += '<div class="card form-card section-box">';
    html += '<div class="card-header"><h3 class="card-title">' + escapeHtml(sec.title) + '</h3></div>';
    html += '<div class="card-body"><div class="' + gridClass + '">';
    sec.fields.forEach(function (field) {
      html += buildFieldHtml(docKey, field);
    });
    html += '</div></div></div>';
  });

  (cfg.tables || []).forEach(function (tbl) {
    const logicalType = tbl.type === 'tax' ? 'items' : tbl.type;
    html += '<div class="card form-card table-card dynamic-table-wrapper">';
    html += '<div class="card-header table-card-header">';
    html += '<div><h3 class="card-title">' + escapeHtml(tbl.title) + '</h3></div>';
    if (logicalType === 'items') {
      html += '<button type="button" class="btn btn-table-add btn-sm btn-add-row" onclick="addItemRow()">+ Thêm sản phẩm</button>';
    } else {
      html += '<button type="button" class="btn btn-table-add btn-sm btn-add-row" onclick="addContainerRow()">+ Thêm Container</button>';
    }
    html += '</div>';
    html += '<div class="card-body table-card-body" style="padding:12px;">';
    html += '<div class="table-scroll" data-synced-table="' + tbl.type + '" data-table-cols="' + tbl.cols.join(',') + '">';
    html += buildTableHtml(tbl.type, tbl.cols);
    html += '</div></div></div>';
  });

  if (cfg.totals && cfg.totals.length > 0) {
    html += '<div class="card form-card section-box summary-card">';
    html += '<div class="card-header"><h3 class="card-title">Tổng hợp &amp; Quy đổi bằng chữ</h3></div>';
    html += '<div class="card-body"><div class="form-grid form-grid-3">';
    cfg.totals.forEach(function (field) {
      html += buildFieldHtml(docKey, field);
    });
    html += '</div></div></div>';
  }

  html += '</section>';
  return html;
}

function buildFieldHtml(docKey, field) {
  const spanClass = field.span === 'full'
    ? ' span-full'
    : (field.span === 4 ? ' span-4' : (field.span === 3 ? ' span-3' : (field.span === 2 ? ' span-2' : '')));
  const id = 'field_' + docKey + '_' + field.key;
  const roAttr = field.readonly ? ' readonly' : '';

  if (field.type === 'checkbox') {
    let html = '<div class="form-group' + spanClass + '">';
    if (!field.noSpacer) {
      html += '<span class="form-label">&nbsp;</span>';
    }
    html += '<label class="checkbox-field-wrap" for="' + id + '">';
    html += '<input id="' + id + '" type="checkbox" data-sync="' + escapeHtml(field.key) + '" />';
    html += '<span class="checkbox-field-text">' + escapeHtml(field.label) + '</span>';
    html += '</label></div>';
    return html;
  }

  let html = '<div class="form-group' + spanClass + '">';
  html += '<label class="form-label" for="' + id + '">' + escapeHtml(field.label) + '</label>';

  if (field.type === 'combobox' || field.type === 'select') {
    html += '<input id="' + id + '" type="text" class="form-control form-combobox" data-sync="' + escapeHtml(field.key) + '" data-combo="' + escapeHtml(field.source || '') + '" placeholder="Chọn hoặc nhập..." autocomplete="off"' + roAttr + ' />';
  } else if (field.type === 'textarea') {
    html += '<textarea id="' + id + '" class="form-control" data-sync="' + escapeHtml(field.key) + '"' + roAttr + '></textarea>';
  } else {
    const inputType = field.type === 'date' ? 'date' : 'text';
    html += '<input id="' + id + '" type="' + inputType + '" class="form-control" data-sync="' + escapeHtml(field.key) + '"' + roAttr + ' />';
  }

  html += '</div>';
  return html;
}

function buildTableHtml(tableMode, cols) {
  const isContainer = tableMode === 'containers';
  const rows = isContainer ? APP_STATE.containers : APP_STATE.items;
  const colMetaMap = isContainer ? CONT_COLUMNS : (tableMode === 'tax' ? TAX_COLUMNS : ITEM_COLUMNS);
  const logicalType = isContainer ? 'containers' : 'items';

  if (!rows || rows.length === 0) {
    return '<div class="empty-table-note">Chưa có dòng dữ liệu. Bấm nút thêm dòng ở góc trên bên phải nếu cần.</div>';
  }

  let html = '<table class="data-table"><thead><tr>';
  html += '<th style="width:46px; text-align:center;">STT</th>';
  cols.forEach(function (colKey) {
    const meta = colMetaMap[colKey] || { label: colKey, width: '100px' };
    html += '<th style="min-width:' + meta.width + '; text-align:center;">' + escapeHtml(meta.label) + '</th>';
  });
  html += '<th style="width:44px; text-align:center;">Xóa</th>';
  html += '</tr></thead><tbody>';

  rows.forEach(function (rowObj, idx) {
    html += '<tr>';
    html += '<td class="table-row-num">' + (idx + 1) + '</td>';

    cols.forEach(function (colKey) {
      const meta = colMetaMap[colKey] || { label: colKey };
      const val = rowObj[colKey] == null ? '' : String(rowObj[colKey]);
      const roAttr = meta.readonly ? ' readonly' : '';
      const numClass = meta.num ? ' num' : ((colKey === 'PROD' || colKey === 'DES') ? ' wide' : '');

      html += '<td>';
      if (meta.dropdown) {
        html += '<input type="text" class="table-input" value="' + escapeHtml(val) + '" data-table-type="' + logicalType + '" data-row-idx="' + idx + '" data-col-key="' + colKey + '" data-combo="' + escapeHtml(meta.dropdown) + '" placeholder="Chọn hoặc nhập..." autocomplete="off"' + roAttr + ' />';
      } else {
        html += '<input type="text" class="table-input' + numClass + '" value="' + escapeHtml(val) + '" data-table-type="' + logicalType + '" data-row-idx="' + idx + '" data-col-key="' + colKey + '"' + roAttr + ' />';
      }
      html += '</td>';
    });

    const delHandler = isContainer ? 'deleteContainerRow(' + idx + ')' : 'deleteItemRow(' + idx + ')';
    html += '<td style="text-align:center;"><button type="button" class="btn-del-row" title="Xóa dòng" onclick="' + delHandler + '">&times;</button></td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  return html;
}

function rerenderAllSyncedTables(logicalType) {
  const selector = logicalType === 'containers'
    ? '[data-synced-table="containers"]'
    : '[data-synced-table="items"], [data-synced-table="tax"]';

  document.querySelectorAll(selector).forEach(function (wrapper) {
    const tableMode = wrapper.getAttribute('data-synced-table');
    const cols = (wrapper.getAttribute('data-table-cols') || '').split(',').filter(Boolean);
    wrapper.innerHTML = buildTableHtml(tableMode, cols);
  });

  if (typeof initCustomComboboxSystem === 'function') {
    initCustomComboboxSystem();
  }
}

function syncAllStateValuesToDOM() {
  document.querySelectorAll('[data-sync]').forEach(function (el) {
    const key = el.getAttribute('data-sync');
    const val = APP_STATE.shared[key] == null ? '' : String(APP_STATE.shared[key]);
    if (el.type === 'checkbox') {
      el.checked = (val === '☑' || val === 'true' || val === 'X' || val === '1');
    } else {
      el.value = val;
    }
  });
}

function renderSingleExportResultBox(docKey) {
  const box = document.getElementById('exportResult_' + docKey);
  const item = APP_STATE.exportResults[docKey];
  if (!box || !item) return;

  box.innerHTML =
    '<div class="export-result-title">Chứng từ đã được xuất thành công lên Google Drive</div>' +
    '<div class="export-result-list">' +
      '<div class="export-result-item">' +
        '<span class="export-result-name">' + escapeHtml(item.docName) + '</span>' +
        '<div class="export-result-links">' +
          '<a class="btn btn-secondary btn-sm" href="' + escapeHtml(item.docUrl) + '" target="_blank" rel="noopener noreferrer">Mở Google Doc</a>' +
          '<a class="btn btn-success btn-sm" href="' + escapeHtml(item.pdfUrl) + '" target="_blank" rel="noopener noreferrer">Tải PDF</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  box.classList.remove('hidden');
}

function renderBatchExportChecklist() {
  const container = document.getElementById('batchExportChecklist');
  if (!container) return;

  let html = '';
  DOC_GROUPS.forEach(function (group) {
    html += '<div class="batch-group-block">';
    html += '<div class="batch-group-header">' + escapeHtml(group.title) + '</div>';
    html += '<div class="batch-grid">';
    group.docs.forEach(function (doc) {
      html += '<label class="batch-check-item">';
      html += '<input type="checkbox" value="' + escapeHtml(doc.key) + '" checked />';
      html += '<span>' + escapeHtml(doc.label) + '</span>';
      html += '</label>';
    });
    html += '</div></div>';
  });

  container.innerHTML = html;
}
</script>
