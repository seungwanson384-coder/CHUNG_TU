<style>
  :root {
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --primary-light: #EEF2FF;
    --primary-border: #C7D2FE;
    --violet-accent: #6D28D9;
    --bg-app: #F8FAFC;
    --bg-surface: #FFFFFF;
    --bg-muted: #F1F5F9;
    --border-color: #E2E8F0;
    --border-strong: #CBD5E1;
    --text-main: #0F172A;
    --text-secondary: #475569;
    --text-muted: #64748B;
    --success: #059669;
    --success-bg: #ECFDF5;
    --success-border: #A7F3D0;
    --warning: #D97706;
    --warning-bg: #FFFBEB;
    --warning-border: #FDE68A;
    --danger: #DC2626;
    --danger-bg: #FEF2F2;
    --danger-border: #FECACA;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.14);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --sidebar-width: 288px;
    --header-height: 64px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-app);
    color: var(--text-main);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .hidden {
    display: none !important;
  }

  /* =========================================================================
     LOGIN SCREEN
     ========================================================================= */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, #EEF2FF 0%, #F8FAFC 55%, #F5F3FF 100%);
  }

  .login-card {
    width: 100%;
    max-width: 430px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 36px 32px;
  }

  .login-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .login-logo {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--violet-accent) 100%);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .login-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
  }

  .login-subtitle {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .login-form .form-group {
    margin-bottom: 16px;
  }

  .login-error {
    margin-bottom: 16px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    font-size: 13px;
    font-weight: 500;
  }

  /* =========================================================================
     APP SHELL & STICKY TOP HEADER
     ========================================================================= */
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 40;
    height: var(--header-height);
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .header-logo {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--violet-accent) 100%);
    color: #FFFFFF;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .header-title-wrap {
    min-width: 0;
  }

  .header-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-subtitle {
    margin: 0;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: var(--primary-light);
    border: 1px solid var(--primary-border);
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
  }

  .user-avatar-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
  }

  .mobile-menu-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--bg-surface);
    color: var(--text-main);
    cursor: pointer;
    font-size: 18px;
  }

  /* =========================================================================
     BODY LAYOUT (SIDEBAR + MAIN WORKSPACE)
     ========================================================================= */
  .app-body {
    display: flex;
    flex: 1;
    min-height: calc(100vh - var(--header-height));
  }

  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-color);
    height: calc(100vh - var(--header-height));
    position: sticky;
    top: var(--header-height);
    overflow-y: auto;
    padding: 16px 12px 32px;
  }

  .sidebar-group {
    margin-bottom: 18px;
  }

  .sidebar-group-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 0 10px 6px;
    border-bottom: 1px solid var(--bg-muted);
    margin-bottom: 6px;
  }

  .sidebar-nav-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-nav-btn {
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .sidebar-nav-btn:hover {
    background: var(--bg-muted);
    color: var(--text-main);
  }

  .sidebar-nav-btn.active {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary-border);
    font-weight: 600;
  }

  .sidebar-nav-code {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-muted);
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .sidebar-nav-btn.active .sidebar-nav-code {
    background: #FFFFFF;
    color: var(--primary);
  }

  .main-workspace {
    flex: 1;
    min-width: 0;
    padding: 24px;
    max-width: 1320px;
  }

  /* =========================================================================
     BUTTONS
     ========================================================================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    white-space: nowrap;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--primary);
    color: #FFFFFF;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  .btn-secondary {
    background: var(--bg-surface);
    color: var(--text-main);
    border-color: var(--border-strong);
  }

  .btn-secondary:hover:not(:disabled) {
    background: var(--bg-muted);
  }

  .btn-danger-outline {
    background: var(--bg-surface);
    color: var(--danger);
    border-color: var(--danger-border);
  }

  .btn-danger-outline:hover:not(:disabled) {
    background: var(--danger-bg);
  }

  .btn-success {
    background: var(--success);
    color: #FFFFFF;
  }

  .btn-success:hover:not(:disabled) {
    background: #047857;
  }

  .btn-sm {
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
  }

  .btn-block {
    width: 100%;
    height: 40px;
  }

  /* =========================================================================
     CARDS, CONTEXT BANNER & FORM GRIDS
     ========================================================================= */
  .doc-panel {
    display: none;
  }

  .doc-panel.active {
    display: block;
  }

  .doc-panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }

  .doc-panel-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
  }

  .doc-panel-meta {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .context-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    background: var(--primary-light);
    border: 1px solid var(--primary-border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--text-main);
  }

  .context-banner strong {
    color: var(--primary);
  }

  .context-banner-link {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    background: #FFFFFF;
    border: 1px solid var(--primary-border);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }

  .context-banner-link:hover {
    background: var(--primary);
    color: #FFFFFF;
  }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    margin-bottom: 18px;
    overflow: hidden;
  }

  .card-header {
    padding: 13px 18px;
    background: #FAFBFF;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .card-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
  }

  .card-subtitle {
    font-size: 12px;
    color: var(--text-muted);
  }

  .card-body {
    padding: 18px;
  }

  .form-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px 16px;
  }

  .span-2 {
    grid-column: span 2;
  }

  .span-3 {
    grid-column: span 3;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .tag-hint {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--bg-muted);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .form-control {
    width: 100%;
    height: 38px;
    padding: 7px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg-surface);
    color: var(--text-main);
    font-family: inherit;
    font-size: 13px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  textarea.form-control {
    height: auto;
    min-height: 74px;
    resize: vertical;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
  }

  .form-control[readonly] {
    background: var(--bg-muted);
    color: var(--text-main);
    font-weight: 600;
  }

  /* =========================================================================
     DYNAMIC TABLES & VALIDATION BADGES
     ========================================================================= */
  .table-scroll {
    width: 100%;
    overflow-x: auto;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 760px;
  }

  .data-table th {
    background: var(--bg-muted);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
  }

  .data-table td {
    padding: 7px 6px;
    border-bottom: 1px solid var(--border-color);
    vertical-align: top;
  }

  .data-table tr:last-child td {
    border-bottom: none;
  }

  .table-row-num {
    width: 36px;
    text-align: center;
    font-weight: 600;
    color: var(--text-muted);
    padding-top: 14px !important;
  }

  .table-input {
    width: 100%;
    min-width: 84px;
    height: 34px;
    padding: 5px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    font-size: 13px;
    font-family: inherit;
    background: #FFFFFF;
    color: var(--text-main);
  }

  .table-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.14);
  }

  .table-input[readonly] {
    background: var(--bg-muted);
    font-weight: 600;
  }

  .table-input.wide {
    min-width: 170px;
  }

  .table-input.num {
    text-align: right;
    min-width: 82px;
  }

  .btn-del-row {
    width: 30px;
    height: 34px;
    border: 1px solid var(--danger-border);
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 5px;
    cursor: pointer;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-del-row:hover {
    background: var(--danger);
    color: #FFFFFF;
  }

  .iso-invalid {
    border-color: var(--danger) !important;
    background-color: var(--danger-bg) !important;
  }

  .badge-warning-iso {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    color: var(--warning);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
  }

  .empty-table-note {
    padding: 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    background: var(--bg-app);
    border-radius: var(--radius-sm);
  }

  /* =========================================================================
     EXPORT RESULT CARDS
     ========================================================================= */
  .export-result-box {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    background: var(--success-bg);
    border: 1px solid var(--success-border);
  }

  .export-result-title {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--success);
  }

  .export-result-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .export-result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 12px;
    background: #FFFFFF;
    border: 1px solid var(--success-border);
    border-radius: var(--radius-sm);
  }

  .export-result-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text-main);
  }

  .export-result-links {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* =========================================================================
     MODALS (BATCH EXPORT & CONFIRM)
     ========================================================================= */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(15, 23, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-dialog {
    width: 100%;
    max-width: 780px;
    max-height: 90vh;
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-dialog.modal-sm {
    max-width: 440px;
  }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    background: var(--bg-surface);
    cursor: pointer;
    font-size: 16px;
    color: var(--text-secondary);
  }

  .modal-body {
    padding: 18px 20px;
    overflow-y: auto;
  }

  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    background: var(--bg-app);
  }

  .batch-group-block {
    margin-bottom: 14px;
  }

  .batch-group-header {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .batch-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .batch-check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    background: var(--bg-surface);
  }

  .batch-check-item:hover {
    border-color: var(--primary-border);
    background: var(--primary-light);
  }

  /* =========================================================================
     TOASTS & LOADING OVERLAY
     ========================================================================= */
  .toast-container {
    position: fixed;
    top: 76px;
    right: 20px;
    z-index: 80;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 360px;
  }

  .toast {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    background: var(--text-main);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    border-left: 4px solid var(--primary);
  }

  .toast-success {
    background: #065F46;
    border-left-color: #34D399;
  }

  .toast-error {
    background: #991B1B;
    border-left-color: #FCA5A5;
  }

  .toast-warning {
    background: #92400E;
    border-left-color: #FCD34D;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .loading-card {
    background: var(--bg-surface);
    padding: 24px 30px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-width: 240px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--primary-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  .loading-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    text-align: center;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* =========================================================================
     RESPONSIVE BREAKPOINTS
     ========================================================================= */
  @media (max-width: 1024px) {
    .form-grid-3 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .span-3 {
      grid-column: span 2;
    }
  }

  @media (max-width: 820px) {
    .mobile-menu-btn {
      display: inline-flex;
    }

    .sidebar {
      position: fixed;
      left: -300px;
      top: var(--header-height);
      z-index: 50;
      transition: left 0.2s ease;
      box-shadow: var(--shadow-lg);
    }

    .sidebar.open {
      left: 0;
    }

    .main-workspace {
      padding: 16px;
    }

    .header-subtitle {
      display: none;
    }

    .batch-grid {
      grid-template-columns: 1fr;
    }
  }
