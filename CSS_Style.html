<style>
  :root {
    --primary: #144535;
    --primary-hover: #0E3327;
    --primary-light: #B8E2CC;
    --primary-soft: #DCEFE5;
    --primary-border: #7EB89A;
    --forest-accent: #1B4D3E;
    --bg-app: #B8E4CE;
    --bg-surface: #FFFFFF;
    --bg-muted: #ECF7F1;
    --border-color: #7EB89A;
    --border-strong: #68A385;
    --text-main: #0B261C;
    --text-secondary: #1E293B;
    --text-muted: #334155;
    --success: #059669;
    --success-bg: #ECFDF5;
    --success-border: #A7F3D0;
    --warning: #D97706;
    --warning-bg: #FFFBEB;
    --warning-border: #FDE68A;
    --danger: #DC2626;
    --danger-bg: #FEF2F2;
    --danger-border: #FECACA;
    --shadow-sm: 0 2px 6px rgba(13, 43, 32, 0.1);
    --shadow-md: 0 6px 16px rgba(13, 43, 32, 0.14);
    --shadow-lg: 0 8px 24px rgba(13, 43, 32, 0.16);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --sidebar-width: 288px;
    --header-height: 64px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body,
  .login-wrapper,
  .login-screen,
  .app-layout,
  .app-shell,
  .main-content,
  .main-workspace,
  #main-workspace,
  #mainWorkspace {
    background: linear-gradient(135deg, #6EB592 0%, #96D1B4 50%, #B8E4CE 100%) !important;
    background-attachment: fixed;
    min-height: 100vh;
  }

  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-main);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .hidden {
    display: none !important;
  }

  /* =========================================================================
     LOGIN SCREEN
     ========================================================================= */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    width: 100%;
    max-width: 430px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 36px 32px;
  }

  .login-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .brand-logo-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #FFFFFF !important;
    padding: 4px;
    object-fit: contain;
    border: 2px solid #1B4D3E;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    flex-shrink: 0;
    display: block;
  }

  .brand-logo-circle.brand-logo-header {
    width: 38px;
    height: 38px;
  }

  .login-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: #0B261C !important;
  }

  .login-subtitle {
    display: none;
  }

  .login-form .form-group {
    margin-bottom: 16px;
  }

  .login-error {
    margin-bottom: 16px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    font-size: 13px;
    font-weight: 500;
  }

  /* =========================================================================
     APP SHELL & STICKY TOP HEADER
     ========================================================================= */
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header,
  .top-header,
  .navbar,
  .app-header {
    background: #AEE0C6 !important;
    border-bottom: 1px solid #7EB89A !important;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 40;
    height: var(--header-height);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .header-title-wrap {
    min-width: 0;
  }

  .header-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: #0B261C !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-subtitle {
    display: none;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: #FFFFFF;
    border: 1px solid #7EB89A;
    color: #0B261C !important;
    font-size: 13px;
    font-weight: 600;
  }

  .user-avatar-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
  }

  .mobile-menu-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--bg-surface);
    color: var(--text-main);
    cursor: pointer;
    font-size: 18px;
  }

  /* =========================================================================
     BODY LAYOUT (SIDEBAR + MAIN WORKSPACE)
     ========================================================================= */
  .app-body {
    display: flex;
    flex: 1;
    min-height: calc(100vh - var(--header-height));
  }

  aside,
  .sidebar {
    background: #B8E2CC !important;
    border-right: 1px solid #7EB89A !important;
  }

  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    height: calc(100vh - var(--header-height));
    position: sticky;
    top: var(--header-height);
    overflow-y: auto;
    padding: 16px 12px 32px;
  }

  .sidebar-group {
    margin-bottom: 18px;
  }

  .sidebar-group-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #0B261C !important;
    padding: 0 10px 6px;
    border-bottom: 1px solid #7EB89A;
    margin-bottom: 6px;
  }

  .sidebar-nav-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-nav-btn {
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    border-left: 3px solid transparent;
    background: transparent;
    color: #0B261C !important;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .sidebar-nav-btn:hover {
    background: #A0D4B9;
    color: #0B261C !important;
  }

  .sidebar-nav-btn.active {
    background: #144535 !important;
    color: #FFFFFF !important;
    border-color: #144535 !important;
    border-left: 4px solid #0B261C !important;
    font-weight: 600;
  }

  .main-workspace {
    flex: 1;
    min-width: 0;
    padding: 24px;
    max-width: 1320px;
  }

  /* =========================================================================
     BUTTONS
     ========================================================================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    white-space: nowrap;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--primary);
    color: #FFFFFF;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  .btn-secondary {
    background: var(--bg-surface);
    color: var(--text-main);
    border-color: var(--border-strong);
  }

  .btn-secondary:hover:not(:disabled) {
    background: var(--bg-muted);
  }

  .btn-danger-outline {
    background: var(--bg-surface);
    color: var(--danger);
    border-color: var(--danger-border);
  }

  .btn-danger-outline:hover:not(:disabled) {
    background: var(--danger-bg);
  }

  .btn-success {
    background: var(--success);
    color: #FFFFFF;
  }

  .btn-success:hover:not(:disabled) {
    background: #047857;
  }

  .btn-sm {
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
  }

  .btn-block {
    width: 100%;
    height: 40px;
  }

  /* =========================================================================
     CARDS, CONTEXT BANNER & FORM GRIDS
     ========================================================================= */
  .doc-panel {
    display: none;
  }

  .doc-panel.active {
    display: block;
  }

  .doc-panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }

  .doc-panel-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: #0B261C !important;
  }

  .doc-panel-meta {
    margin: 3px 0 0;
    font-size: 13px;
    font-weight: 600;
    color: #0B261C !important;
  }

  .doc-panel-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .context-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    background: var(--primary-soft);
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--text-main);
  }

  .context-banner strong {
    color: var(--primary);
  }

  .context-banner-link {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    background: #FFFFFF;
    border: 1px solid var(--primary-border);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }

  .context-banner-link:hover {
    background: var(--primary);
    color: #FFFFFF;
  }

  .card,
  .form-card,
  .section-box,
  .table-card,
  .dynamic-table-wrapper,
  .modal-content,
  .login-card,
  .modal-dialog {
    background: #FFFFFF !important;
    border: 2px solid #1B4D3E !important;
    box-shadow: 0 8px 24px rgba(13, 43, 32, 0.16) !important;
  }

  .card,
  .form-card,
  .section-box {
    border-radius: 10px !important;
    margin-bottom: 18px;
    overflow: hidden;
  }

  .card-header {
    padding: 13px 18px;
    background: #EDF7F2;
    border-bottom: 1px solid #7EB89A;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .card-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: #0B261C !important;
  }

  .card-subtitle {
    font-size: 12px;
    color: #1E293B;
  }

  .card-body {
    padding: 18px;
  }

  .form-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px 16px;
  }

  .span-2 {
    grid-column: span 2;
  }

  .span-3 {
    grid-column: span 3;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: #1E293B !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .form-control {
    width: 100%;
    height: 38px;
    padding: 7px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg-surface);
    color: var(--text-main);
    font-family: inherit;
    font-size: 13px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  textarea.form-control {
    height: auto;
    min-height: 74px;
    resize: vertical;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(27, 77, 62, 0.16);
  }

  .form-control[readonly] {
    background: var(--bg-muted);
    color: var(--text-main);
    font-weight: 600;
  }

  .checkbox-field-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 38px;
    padding: 7px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: #F7FCF9;
    cursor: pointer;
    user-select: none;
  }

  .checkbox-field-wrap:hover {
    background: #ECF7F1;
    border-color: #1B4D3E;
  }

  .checkbox-field-wrap input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: #1B4D3E;
    cursor: pointer;
    margin: 0;
  }

  .checkbox-field-text {
    font-size: 13px;
    font-weight: 600;
    color: #0B261C;
  }

  /* =========================================================================
     CUSTOM JADE-GREEN TRANSLUCENT COMBOBOX DROPDOWN POPUP
     ========================================================================= */
  .custom-combo-dropdown {
    position: fixed;
    z-index: 9999;
    background: rgba(92, 168, 134, 0.80) !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid #1B4D3E !important;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(11, 38, 28, 0.22);
    max-height: 240px;
    overflow-y: auto;
    padding: 4px;
  }

  .custom-combo-option {
    color: #082419 !important;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    line-height: 1.35;
    transition: background-color 0.12s ease, color 0.12s ease;
  }

  .custom-combo-option:hover,
  .custom-combo-option.active {
    background: rgba(27, 77, 62, 0.88) !important;
    color: #FFFFFF !important;
  }

  /* =========================================================================
     DYNAMIC TABLES & VALIDATION BADGES (HIGH-CONTRAST FOREST GREEN)
     ========================================================================= */
  .card:has(table),
  .form-card:has(table),
  .section-box:has(table),
  .table-card,
  .dynamic-table-wrapper {
    border: 2px solid #1B4D3E !important;
    border-radius: 10px !important;
    overflow: hidden;
    background: #FFFFFF !important;
    box-shadow: 0 8px 24px rgba(13, 43, 32, 0.16) !important;
  }

  .card:has(table) > .card-header,
  .form-card:has(table) > .card-header,
  .section-box:has(table) > .card-header,
  .table-card > .card-header,
  .dynamic-table-wrapper > .card-header,
  .table-card-header {
    background: #1B4D3E !important;
    color: #FFFFFF !important;
    font-weight: 700 !important;
    border-bottom: 1px solid #143D30 !important;
  }

  .card:has(table) > .card-header .card-title,
  .form-card:has(table) > .card-header .card-title,
  .section-box:has(table) > .card-header .card-title,
  .table-card > .card-header .card-title,
  .dynamic-table-wrapper > .card-header .card-title,
  .table-card-header .card-title {
    color: #FFFFFF !important;
    font-weight: 700 !important;
  }

  .btn-table-add {
    background: #FFFFFF !important;
    color: #1B4D3E !important;
    border: 1.5px solid #A7F3D0 !important;
    font-weight: 700 !important;
  }

  .btn-table-add:hover:not(:disabled) {
    background: #D1FAE5 !important;
    color: #0B261C !important;
  }

  .table-scroll {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #5C9E7E;
    border-radius: 6px;
    background: #FFFFFF;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 760px;
    background: #FFFFFF;
  }

  .data-table thead,
  .card:has(table) thead,
  .form-card:has(table) thead,
  .section-box:has(table) thead,
  .table-card thead,
  .dynamic-table-wrapper thead {
    background: #1B4D3E !important;
    color: #FFFFFF !important;
    font-weight: 700 !important;
  }

  .data-table th,
  .card:has(table) th,
  .form-card:has(table) th,
  .section-box:has(table) th,
  .table-card th,
  .dynamic-table-wrapper th {
    background: #1B4D3E !important;
    color: #FFFFFF !important;
    font-size: 11px;
    font-weight: 700 !important;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: left;
    padding: 10px 8px;
    border: 1px solid #5C9E7E !important;
    white-space: nowrap;
  }

  .data-table td,
  .card:has(table) td,
  .form-card:has(table) td,
  .section-box:has(table) td,
  .table-card td,
  .dynamic-table-wrapper td {
    padding: 7px 6px;
    border: 1px solid #5C9E7E !important;
    vertical-align: top;
    background: #FFFFFF;
  }

  .table-row-num {
    width: 36px;
    text-align: center;
    font-weight: 700;
    color: #0B261C !important;
    padding-top: 14px !important;
  }

  table input,
  table select,
  .card:has(table) input,
  .card:has(table) select,
  .form-card:has(table) input,
  .form-card:has(table) select,
  .section-box:has(table) input,
  .section-box:has(table) select,
  .table-card input,
  .table-card select,
  .dynamic-table-wrapper input,
  .dynamic-table-wrapper select,
  .data-table input,
  .data-table select,
  .table-input {
    width: 100%;
    min-width: 84px;
    height: 34px;
    padding: 5px 8px;
    border: 1.5px solid #4A8B6C !important;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    background: #F7FCF9 !important;
    color: #0B261C !important;
  }

  table input:focus,
  table select:focus,
  .card:has(table) input:focus,
  .card:has(table) select:focus,
  .form-card:has(table) input:focus,
  .form-card:has(table) select:focus,
  .section-box:has(table) input:focus,
  .section-box:has(table) select:focus,
  .table-card input:focus,
  .table-card select:focus,
  .dynamic-table-wrapper input:focus,
  .dynamic-table-wrapper select:focus,
  .data-table input:focus,
  .data-table select:focus,
  .table-input:focus {
    outline: none;
    border-color: #1B4D3E !important;
    box-shadow: 0 0 0 2px rgba(27, 77, 62, 0.22);
    background: #FFFFFF !important;
  }

  table input[readonly],
  .data-table input[readonly],
  .table-input[readonly] {
    background: #E9F5EE !important;
    color: #0B261C !important;
    font-weight: 700;
  }

  .table-input.wide {
    min-width: 170px;
  }

  .table-input.num {
    text-align: right;
    min-width: 82px;
  }

  .btn-del-row {
    width: 30px;
    height: 34px;
    border: 1px solid var(--danger-border);
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 5px;
    cursor: pointer;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-del-row:hover {
    background: var(--danger);
    color: #FFFFFF;
  }

  .iso-invalid {
    border-color: var(--danger) !important;
    background-color: var(--danger-bg) !important;
  }

  .badge-warning-iso {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    color: var(--warning);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
  }

  .empty-table-note {
    padding: 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    background: var(--bg-app);
    border-radius: var(--radius-sm);
  }

  /* =========================================================================
     EXPORT RESULT CARDS
     ========================================================================= */
  .export-result-box {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    background: var(--success-bg);
    border: 1px solid var(--success-border);
  }

  .export-result-title {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--success);
  }

  .export-result-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .export-result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 12px;
    background: #FFFFFF;
    border: 1px solid var(--success-border);
    border-radius: var(--radius-sm);
  }

  .export-result-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text-main);
  }

  .export-result-links {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* =========================================================================
     MODALS (BATCH EXPORT & CONFIRM)
     ========================================================================= */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(15, 23, 42, 0.55);
