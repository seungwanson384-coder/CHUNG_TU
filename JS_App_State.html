function showLoading(message) {
  const overlay = document.getElementById('loadingOverlay');
  const textEl = document.getElementById('loadingMessage');
  if (textEl) textEl.textContent = message || 'Loading...';
  if (overlay) overlay.classList.remove('hidden');
}

function hideLoading() {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.classList.add('hidden');
}

function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'info');
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(function () {
    if (toast.parentNode) {
      toast.parentNode.removeChild(toast);
    }
  }, 4200);
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function toggleMobileSidebar() {

function switchTab(tabKey) {
  APP_STATE.activeTab = tabKey;

  document.querySelectorAll('.sidebar-nav-btn[data-nav]').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-nav') === tabKey);
  });

  document.querySelectorAll('.doc-panel[data-tab-panel]').forEach(function (panel) {
    panel.classList.toggle('active', panel.getAttribute('data-tab-panel') === tabKey);
  });

  const sidebar = document.getElementById('appSidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
  }
}

function handleLoginSubmit(event) {
  event.preventDefault();

  const username = document.getElementById('loginMaSV').value.trim();
  const password = document.getElementById('loginMatKhau').value.trim();
  const errorBox = document.getElementById('loginError');

  errorBox.classList.add('hidden');
  errorBox.textContent = '';

  if (!username || !password) {
    errorBox.textContent = 'Vui lòng nhập đầy đủ Tên đăng nhập và Mật khẩu.';
    errorBox.classList.remove('hidden');
    return;
  }

  showLoading('Loading...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        hideLoading();
        errorBox.textContent = (res && res.message) || 'Đăng nhập thất bại.';
        errorBox.classList.remove('hidden');
        return;
      }

      APP_STATE.user = res.user;
      APP_STATE.exportResults = {};
      restoreDraftState(res.draftJson != null ? res.draftJson : res.draft);

      const badgeText = document.getElementById('userBadgeText');
      if (badgeText) {
        const displayName = String(res.user.tenSV || '').trim();
        const displayId = String(res.user.maSV || '').trim();
        badgeText.textContent = displayName && displayId
          ? displayName + ' (' + displayId + ')'
          : (displayName || displayId || 'Sinh viên');
      }

      loadInitialDropdowns();
    })
    .withFailureHandler(function (err) {
      hideLoading();
      errorBox.textContent = 'Lỗi kết nối máy chủ: ' + (err && err.message ? err.message : err);
      errorBox.classList.remove('hidden');
    })
    .loginUser(username, password);
}

function getTodayYYMMDD_() {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return yy + mm + dd;
}

function restoreDraftState(draftJson) {
  APP_STATE.shared = {};
  APP_STATE.items = [createEmptyItem()];
  APP_STATE.containers = [createEmptyContainer()];

  if (draftJson && typeof draftJson === 'string' && draftJson.trim() !== '') {
    try {
      const parsed = JSON.parse(draftJson);
      if (parsed && typeof parsed === 'object') {
        if (parsed.shared && typeof parsed.shared === 'object') {
          Object.keys(parsed.shared).forEach(function (k) {
            APP_STATE.shared[k] = parsed.shared[k] == null ? '' : String(parsed.shared[k]);
          });
        }
        if (Array.isArray(parsed.items)) {
          APP_STATE.items = parsed.items.length > 0
            ? parsed.items.map(function (row) { return Object.assign(createEmptyItem(), row); })
            : [];
        }
        if (Array.isArray(parsed.containers)) {
          APP_STATE.containers = parsed.containers.length > 0
            ? parsed.containers.map(function (row) { return Object.assign(createEmptyContainer(), row); })
            : [];
        }
      }
    } catch (e) {
      showToast('Dữ liệu nháp cũ không đúng định dạng, đã khởi tạo biểu mẫu mới.', 'warning');
    }
  }

  initDefaultDocumentNumbers(false);
}

/* ==========================================================================
   DOCUMENT PREVIEW MODAL (Review Document via PDF.js Canvas)
   ========================================================================== */

let currentPreviewBlobUrl = null;
let pdfJsLoadPromise_ = null;

function revokePreviewBlobUrl_() {
  if (currentPreviewBlobUrl) {
    try {
      URL.revokeObjectURL(currentPreviewBlobUrl);
    } catch (e) {}
    currentPreviewBlobUrl = null;
  }
}

function base64ToUint8Array_(base64Str) {
  const binary = atob(base64Str);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

function base64ToBlobUrl_(base64Str, mimeType) {
  const bytes = base64ToUint8Array_(base64Str);
  const blob = new Blob([bytes], { type: mimeType || 'application/pdf' });
  return URL.createObjectURL(blob);
}

function loadScriptOnce_(url) {
  return new Promise(function (resolve, reject) {
    const existing = document.querySelector('script[data-pdfjs-src="' + url + '"]');
    if (existing) {
      resolve();
      return;
    }
    const script = document.createElement('script');
    script.src = url;
    script.async = true;
    script.setAttribute('data-pdfjs-src', url);
    script.onload = function () { resolve(); };
    script.onerror = function () { reject(new Error('Failed to load ' + url)); };
    document.head.appendChild(script);
  });
}

function ensurePdfJsLoaded_() {
  if (window.pdfjsLib && typeof window.pdfjsLib.getDocument === 'function') {
    return Promise.resolve(window.pdfjsLib);
  }
  if (pdfJsLoadPromise_) {
    return pdfJsLoadPromise_;
  }

  const cdnPairs = [
    {
      worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
      lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'
    },
    {
      worker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
      lib: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'
    }
  ];

  function tryPair(idx) {
    if (idx >= cdnPairs.length) {
      return Promise.reject(new Error('Không thể tải thư viện hiển thị PDF (PDF.js).'));
    }
    const pair = cdnPairs[idx];
    return loadScriptOnce_(pair.worker)
      .catch(function () { return null; })
      .then(function () { return loadScriptOnce_(pair.lib); })
      .then(function () {
        if (window.pdfjsLib && typeof window.pdfjsLib.getDocument === 'function') {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = pair.worker;
          return window.pdfjsLib;
        }
        return tryPair(idx + 1);
      })
      .catch(function () {
        return tryPair(idx + 1);
      });
  }

  pdfJsLoadPromise_ = tryPair(0).catch(function (err) {
    pdfJsLoadPromise_ = null;
    throw err;
  });
  return pdfJsLoadPromise_;
}

async function renderPdfBase64ToCanvases_(base64Str, containerEl) {
  const pdfjsLib = await ensurePdfJsLoaded_();
  const pdfBytes = base64ToUint8Array_(base64Str);
  const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
  const pdfDoc = await loadingTask.promise;

  containerEl.innerHTML = '';

  const parentWidth = containerEl.parentNode && containerEl.parentNode.clientWidth ? containerEl.parentNode.clientWidth : 900;
  const availableWidth = Math.max(360, parentWidth - 64);
  const outputScale = Math.min(window.devicePixelRatio || 1, 2);
  const fragment = document.createDocumentFragment();

  for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
    const page = await pdfDoc.getPage(pageNum);
    const baseViewport = page.getViewport({ scale: 1 });
    const cssScale = Math.min(1.65, Math.max(0.85, availableWidth / baseViewport.width));
    const viewport = page.getViewport({ scale: cssScale });

    const card = document.createElement('div');
    card.className = 'preview-page-card';

    const label = document.createElement('div');
    label.className = 'preview-page-label';
    label.textContent = 'Trang ' + pageNum + ' / ' + pdfDoc.numPages;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = Math.floor(viewport.width) + 'px';
    canvas.style.height = Math.floor(viewport.height) + 'px';

    card.appendChild(label);
    card.appendChild(canvas);
    fragment.appendChild(card);

    const renderContext = {
      canvasContext: ctx,
      transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
      viewport: viewport
    };
    await page.render(renderContext).promise;
  }

  containerEl.appendChild(fragment);
  containerEl.classList.remove('hidden');
  return pdfDoc.numPages;
}

function handlePreviewDocument(docKey) {
  if (!APP_STATE.user || !APP_STATE.user.maSV) {
    showToast('Vui lòng đăng nhập để xem trước chứng từ.', 'error');
    return;
  }

  APP_STATE.previewDocKey = docKey;

  const modal = document.getElementById('docPreviewModal');
  const titleEl = document.getElementById('docPreviewModalTitle');
  const subtitleEl = document.getElementById('docPreviewModalSubtitle');
  const loadingEl = document.getElementById('docPreviewLoading');
  const errorWrap = document.getElementById('docPreviewError');
  const errorText = document.getElementById('docPreviewErrorText');
  const canvasWrap = document.getElementById('docPreviewCanvasWrap');
  const frame = document.getElementById('docPreviewFrame');
  const exportBtn = document.getElementById('btnPreviewExportOfficial');
  const downloadBtn = document.getElementById('btnPreviewDownloadPdf');

  const cfg = (typeof DOC_FORM_CONFIGS !== 'undefined' && DOC_FORM_CONFIGS[docKey]) ? DOC_FORM_CONFIGS[docKey] : null;
  if (titleEl) {
    titleEl.textContent = 'Review Document: ' + (cfg ? cfg.title : docKey);
  }
  if (subtitleEl) {
    subtitleEl.textContent = '';
  }

  revokePreviewBlobUrl_();
  if (canvasWrap) {
    canvasWrap.innerHTML = '';
    canvasWrap.classList.add('hidden');
  }
  if (frame) {
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';
    frame.classList.add('hidden');
  }
  if (downloadBtn) {
    downloadBtn.classList.add('hidden');
    downloadBtn.href = '#';
  }
  if (errorWrap) errorWrap.classList.add('hidden');
  if (errorText) errorText.textContent = '';
  if (loadingEl) {
    const loadingTextEl = loadingEl.querySelector('.loading-text');
    if (loadingTextEl) loadingTextEl.textContent = 'Loading...';
    loadingEl.classList.remove('hidden');
  }
  if (exportBtn) exportBtn.disabled = true;
  if (modal) modal.classList.remove('hidden');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        if (loadingEl) loadingEl.classList.add('hidden');
        if (errorText) errorText.textContent = (res && res.message) || 'Không thể tạo bản xem trước chứng từ.';
        if (errorWrap) errorWrap.classList.remove('hidden');
        return;
      }

      if (exportBtn) exportBtn.disabled = false;

      if (res.pdfBase64) {
        currentPreviewBlobUrl = base64ToBlobUrl_(res.pdfBase64, res.mimeType || 'application/pdf');
        if (downloadBtn) {
          downloadBtn.href = currentPreviewBlobUrl;
          downloadBtn.download = docKey + '_PREVIEW.pdf';
          downloadBtn.classList.remove('hidden');
        }

        if (canvasWrap) {
          renderPdfBase64ToCanvases_(res.pdfBase64, canvasWrap)
            .then(function (numPages) {
              if (loadingEl) loadingEl.classList.add('hidden');
              if (subtitleEl && numPages) {
                subtitleEl.textContent =
                  'Bản xem trước trực tiếp giữ nguyên định dạng từ Google Docs mẫu • ' + numPages + ' trang';
              }
            })
            .catch(function (renderErr) {
              if (loadingEl) loadingEl.classList.add('hidden');
              if (canvasWrap) canvasWrap.classList.add('hidden');
              if (errorText) {
                errorText.textContent =
                  'Không thể hiển thị trực tiếp PDF trên trình duyệt (' +
                  (renderErr && renderErr.message ? renderErr.message : renderErr) +
                  '). Bạn vẫn có thể bấm "Tải PDF xem trước" ở góc dưới bên trái.';
              }
              if (errorWrap) errorWrap.classList.remove('hidden');
            });
        } else {
          if (loadingEl) loadingEl.classList.add('hidden');
        }
      } else if (res.htmlPreview) {
        if (loadingEl) loadingEl.classList.add('hidden');
        if (frame) {
          frame.srcdoc = res.htmlPreview;
          frame.classList.remove('hidden');
        }
      } else if (res.previewUrl) {
        if (loadingEl) loadingEl.classList.add('hidden');
        if (frame) {
          frame.src = res.previewUrl;
          frame.classList.remove('hidden');
        }
      } else {
        if (loadingEl) loadingEl.classList.add('hidden');
        if (errorText) errorText.textContent = 'Máy chủ không trả về dữ liệu xem trước.';
        if (errorWrap) errorWrap.classList.remove('hidden');
      }

      if (res.warning) {
        showToast(res.warning, 'warning');
      }
    })
    .withFailureHandler(function (err) {
      if (loadingEl) loadingEl.classList.add('hidden');
      if (errorText) errorText.textContent = 'Lỗi xem trước chứng từ: ' + (err && err.message ? err.message : err);
      if (errorWrap) errorWrap.classList.remove('hidden');
    })
    .previewDocument(APP_STATE.user.maSV, docKey, buildExportPayload());
}

  if (downloadBtn) {
    downloadBtn.classList.add('hidden');
    downloadBtn.href = '#';
  }
  revokePreviewBlobUrl_();
  APP_STATE.previewDocKey = null;
}

function handleExportFromPreview() {
  const targetDocKey = APP_STATE.previewDocKey;
  closeDocPreviewModal();
  if (targetDocKey) {
    handleExportSingle(targetDocKey);
  }
}

function buildExportPayload() {
  recalculateAllTotals(false);
  return {
    shared: APP_STATE.shared,
    items: APP_STATE.items,
    containers: APP_STATE.containers
  };
}

function handleExportSingle(docKey) {
  if (!APP_STATE.user || !APP_STATE.user.maSV) {
    showToast('Vui lòng đăng nhập để xuất chứng từ.', 'error');
    return;
  }

  const invalidConts = getInvalidIsoContainers();
  if (invalidConts.length > 0) {
    showToast('Cảnh báo: Có số Container chưa đúng chuẩn ISO 6346 (' + invalidConts.join(', ') + '). Vẫn tiếp tục xuất.', 'warning');
  }

  showLoading('Loading...');

  google.script.run
    .withSuccessHandler(function (res) {
      hideLoading();
      if (!res || !res.success || !res.results || res.results.length === 0) {
        showToast((res && res.message) || 'Xuất chứng từ thất bại.', 'error');
        return;
      }

      res.results.forEach(function (item) {
        APP_STATE.exportResults[item.docKey] = item;
      });

      showToast('Xuất chứng từ thành công!', 'success');
    })
    .withFailureHandler(function (err) {
      hideLoading();
      showToast('Lỗi xuất chứng từ: ' + (err && err.message ? err.message : err), 'error');
    })
    .generateDocuments(APP_STATE.user.maSV, [docKey], buildExportPayload());
}

function openBatchExportModal() {

  if (resultsBox) resultsBox.classList.add('hidden');

}

function closeBatchExportModal() {

}

    .withSuccessHandler(function (res) {

      }

/* ==========================================================================
   TWO-WAY SYNC & CASCADING DROPDOWNS
   ========================================================================== */

function handleWorkspaceFieldChange(target) {
  const key = target.getAttribute('data-sync');
  if (!key) return;

  // Preserve leading zeros by storing raw string value verbatim (or checkbox symbol)
  const value = target.type === 'checkbox' ? (target.checked ? '☑' : '') : target.value;
  APP_STATE.shared[key] = value;

  // Mirror across all other views without disturbing active focus
  syncSharedFieldToDOM(key, value, target);

  // Cascading & Combobox Logic
  if (key === 'POL') {
    handlePolChanged(value);
  } else if (key === 'POD') {
    handlePodChanged(value);
  } else if (key === 'DEC_TYPE') {
    const dir = APP_STATE.activeTab === 'To_khai_NK' ? 'Nhập khẩu' : 'Xuất khẩu';
    handleXnkTypeChanged(dir, value, dir === 'Nhập khẩu' ? 'IMP_TYPE_NAME' : 'EXP_TYPE_NAME');
  } else if (key === 'CO_FORM_NAME') {
    handleCoFormChanged(value);
  } else if (key === 'VESSEL' || key === 'VOYAGE') {
    updateVesVoyDerived();
  } else if (key === 'SHIP_NAME' || key === 'CNE_NAME') {
    updateAllContextBanners();
  }

  // Import Customs Declaration shared tax fields
  if (key === 'IM_VAL' || key === 'IM_RATE') {
    const imVal = parseNum(APP_STATE.shared.IM_VAL);
    const imRate = parseNum(APP_STATE.shared.IM_RATE);
    const imAmt = (APP_STATE.shared.IM_VAL !== '' && APP_STATE.shared.IM_RATE !== '') ? formatNum((imVal * imRate) / 100, 2) : '';
    setSharedFieldAndSync('IM_AMT', imAmt);
  } else if (key === 'SCT_VAL' || key === 'SCT_RATE') {
    const sctVal = parseNum(APP_STATE.shared.SCT_VAL);
    const sctRate = parseNum(APP_STATE.shared.SCT_RATE);
    const sctAmt = (APP_STATE.shared.SCT_VAL !== '' && APP_STATE.shared.SCT_RATE !== '') ? formatNum((sctVal * sctRate) / 100, 2) : '';
    setSharedFieldAndSync('SCT_AMT', sctAmt);
  } else if (key === 'EPT_VAL' || key === 'EPT_RATE') {
    const eptVal = parseNum(APP_STATE.shared.EPT_VAL);
    const eptRate = parseNum(APP_STATE.shared.EPT_RATE);
    const eptAmt = (APP_STATE.shared.EPT_VAL !== '' && APP_STATE.shared.EPT_RATE !== '') ? formatNum((eptVal * eptRate) / 100, 2) : '';
    setSharedFieldAndSync('EPT_AMT', eptAmt);
  } else if (key === 'VAT_VAL' || key === 'VAT_RATE') {
    const vatVal = parseNum(APP_STATE.shared.VAT_VAL);
    const vatRate = parseNum(APP_STATE.shared.VAT_RATE);
    const vatAmt = (APP_STATE.shared.VAT_VAL !== '' && APP_STATE.shared.VAT_RATE !== '') ? formatNum((vatVal * vatRate) / 100, 2) : '';
    setSharedFieldAndSync('VAT_AMT', vatAmt);
  }

  if (
    key === 'VAT_GST' ||
    key === 'CURR' ||
    key === 'IM_VAL' || key === 'IM_RATE' || key === 'IM_AMT' ||
    key === 'SCT_VAL' || key === 'SCT_RATE' || key === 'SCT_AMT' ||
    key === 'EPT_VAL' || key === 'EPT_RATE' || key === 'EPT_AMT' ||
    key === 'VAT_VAL' || key === 'VAT_RATE' || key === 'VAT_AMT'
  ) {
    recalculateAllTotals(true);
  }
}

function syncSharedFieldToDOM(key, value, sourceElement) {
  document.querySelectorAll('[data-sync="' + key + '"]').forEach(function (el) {
    if (el === sourceElement) return;
    if (el.type === 'checkbox') {
      el.checked = (value === '☑' || value === 'true' || value === 'X' || value === '1');
      return;
    }
    if (el.tagName === 'SELECT') {
      ensureSelectHasOption(el, value);
    }
    el.value = value;
  });
}

function setSharedFieldAndSync(key, value) {
  const strVal = value == null ? '' : String(value);
  APP_STATE.shared[key] = strVal;
  syncSharedFieldToDOM(key, strVal, null);
}

function ensureSelectHasOption(selectEl, value) {
  if (!value) return;
  const exists = Array.prototype.some.call(selectEl.options, function (opt) {
    return opt.value === value;
  });
  if (!exists) {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = value;
    selectEl.appendChild(opt);
  }
}

function handlePolChanged(polValue) {
  const cuocTau = APP_STATE.dropdowns.cuocTau || [];
  const filteredPods = [];
  const seen = {};

  cuocTau.forEach(function (row) {
    if (!polValue || row.POL === polValue) {
      if (row.POD && !seen[row.POD]) {
        seen[row.POD] = true;
        filteredPods.push(row.POD);
      }
    }
  });

  // Fallback to all PODs if custom POL was typed that isn't in Cuoc_Tau
  if (filteredPods.length === 0 && cuocTau.length > 0) {
    cuocTau.forEach(function (row) {
      if (row.POD && !seen[row.POD]) {
        seen[row.POD] = true;
        filteredPods.push(row.POD);
      }
    });
  }

  const podDatalist = document.getElementById('dl_POD');
  if (podDatalist) {
    podDatalist.innerHTML = filteredPods
      .map(function (pod) {
        return '<option value="' + escapeHtml(pod) + '"></option>';
      })
      .join('');
  }

  const currentPod = APP_STATE.shared.POD || '';
  if (currentPod && seen[currentPod]) {
    handlePodChanged(currentPod);
  }
}

function handlePodChanged(podValue) {
  if (!podValue) return;
  const cuocTau = APP_STATE.dropdowns.cuocTau || [];
  const currentPol = APP_STATE.shared.POL || '';

  let match = cuocTau.find(function (row) {
    return (!currentPol || row.POL === currentPol) && row.POD === podValue;
  });

  if (!match) {
    match = cuocTau.find(function (row) {
      return row.POD === podValue;
    });
  }

  if (match) {
    if (match.Quoc_Gia) {
      setSharedFieldAndSync('DEST_CTRY', match.Quoc_Gia);
      setSharedFieldAndSync('EXP_CTRY', match.Quoc_Gia);
    }
    if (match.Ten_hang_tau) setSharedFieldAndSync('CAR_NAME', match.Ten_hang_tau);
    if (match.Ten_tau) setSharedFieldAndSync('VESSEL', match.Ten_tau);
    if (match.So_chuyen) setSharedFieldAndSync('VOYAGE', match.So_chuyen);
    updateVesVoyDerived();
  }
}

function updateVesVoyDerived() {
  const vessel = String(APP_STATE.shared.VESSEL || '').trim();
  const voyage = String(APP_STATE.shared.VOYAGE || '').trim();
  const vesVoy = vessel && voyage ? (vessel + ' / ' + voyage) : (vessel || voyage || '');
  setSharedFieldAndSync('VES_VOY', vesVoy);
}

function handleXnkTypeChanged(directionLabel, selectedVal, targetNameKey) {
  const list = getFilteredLoaiHinhXnk(directionLabel);
  const raw = String(selectedVal || '').trim();
  const codePart = raw.split(' - ')[0].trim();
  const found = list.find(function (r) {
    return r.Ma_loai_hinh === raw || r.Ma_loai_hinh === codePart;
  });
  setSharedFieldAndSync(targetNameKey, found ? found.Ten_loai_hinh : '');
}

function handleCoFormChanged(coFormVal) {
  const norm = String(coFormVal || '').trim().toUpperCase();
  if (!norm) return;

  const dmAgreements = (APP_STATE.dropdowns && APP_STATE.dropdowns.danhMucChung && APP_STATE.dropdowns.danhMucChung.TRADE_AGREEMENT) || [];
  const formMap = [
    { match: 'FORM D', candidates: ['ATIGA', 'ASEAN'] },
    { match: 'FORM E', candidates: ['ACFTA', 'ASEAN-CHINA'] },
    { match: 'FORM AK', candidates: ['AKFTA', 'ASEAN-KOREA'] },
    { match: 'FORM AJ', candidates: ['AJCEP', 'VJEPA'] },
    { match: 'FORM VJ', candidates: ['VJEPA'] },
    { match: 'FORM VK', candidates: ['VKFTA'] },
    { match: 'FORM VC', candidates: ['VCFTA'] },
    { match: 'FORM EUR.1', candidates: ['EVFTA', 'EU-VIETNAM'] },
    { match: 'EUR.1', candidates: ['EVFTA'] },
    { match: 'CPTPP', candidates: ['CPTPP'] },
    { match: 'RCEP', candidates: ['RCEP'] },
    { match: 'AANZ', candidates: ['AANZFTA'] },
    { match: 'FORM AI', candidates: ['AIFTA'] },
    { match: 'FORM A', candidates: ['GSP'] },
    { match: 'FORM B', candidates: ['MFN', 'NON-PREFERENTIAL'] }
  ];

  let matchedAgreement = '';
  for (let i = 0; i < formMap.length; i++) {
    if (norm.indexOf(formMap[i].match) !== -1) {
      for (let c = 0; c < formMap[i].candidates.length; c++) {
        const cand = formMap[i].candidates[c];
        const inSheet = dmAgreements.find(function (a) {
          return String(a).toUpperCase().indexOf(cand) !== -1;
        });
        if (inSheet) {
          matchedAgreement = inSheet;
          break;
        }
      }
      if (!matchedAgreement) {
        matchedAgreement = formMap[i].candidates[0];
      }
      break;
    }
  }

  if (matchedAgreement) {
    setSharedFieldAndSync('TRADE_AGREEMENT', matchedAgreement);
  }
}

function getFilteredLoaiHinhXnk(direction) {
  const all = APP_STATE.dropdowns.loaiHinhXNK || [];
  const normDir = direction.toLowerCase();
  const isExport = normDir.indexOf('xuất') !== -1 || normDir.indexOf('xuat') !== -1;

  return all.filter(function (row) {
    const p = String(row.Phan_loai || '').toLowerCase();
    if (isExport) {
      return p.indexOf('xuất') !== -1 || p.indexOf('xuat') !== -1 || p === 'xk';
    }
    return p.indexOf('nhập') !== -1 || p.indexOf('nhap') !== -1 || p === 'nk';
  });
}

function updateAllContextBanners() {
  const ship = String(APP_STATE.shared.SHIP_NAME || '').trim() || 'Chưa nhập Shipper';
  const cne = String(APP_STATE.shared.CNE_NAME || '').trim() || 'Chưa nhập Consignee';

  document.querySelectorAll('.context-banner-parties').forEach(function (el) {
    el.innerHTML = '<strong>' + escapeHtml(ship) + '</strong> &#10132; <strong>' + escapeHtml(cne) + '</strong>';
  });
}

function handleTableCellChange(target) {
  const tableType = target.getAttribute('data-table-type');
  const rowIdx = parseInt(target.getAttribute('data-row-idx'), 10);
  const colKey = target.getAttribute('data-col-key');
  if (!tableType || isNaN(rowIdx) || !colKey) return;

  const targetArray = tableType === 'containers' ? APP_STATE.containers : APP_STATE.items;
  if (!targetArray[rowIdx]) return;

  // Store raw string to preserve leading zeros (HS code, LOT_NO, SEAL, CONT, etc.)
  let rawVal = target.value;
  if (colKey === 'CONT') {
    rawVal = rawVal.toUpperCase();
    if (target.value !== rawVal) {
      target.value = rawVal;
    }
  }

  targetArray[rowIdx][colKey] = rawVal;

  // Auto-calculate row-level amounts for items[]
  if (tableType === 'items') {
    const item = targetArray[rowIdx];
    if (colKey === 'QTY' || colKey === 'PRICE') {
      const qty = parseNum(item.QTY);
      const price = parseNum(item.PRICE);
      item.AMT = (item.QTY !== '' || item.PRICE !== '') ? formatNum(qty * price, 2) : '';
      syncTableCellToDOM('items', rowIdx, 'AMT', item.AMT, null);
    }

    if (colKey === 'EX_VAL' || colKey === 'EX_TAX_RATE') {
      const exVal = parseNum(item.EX_VAL);
      const exRate = parseNum(item.EX_TAX_RATE);
      item.EX_AMT = (item.EX_VAL !== '' && item.EX_TAX_RATE !== '') ? formatNum((exVal * exRate) / 100, 2) : '';
      syncTableCellToDOM('items', rowIdx, 'EX_AMT', item.EX_AMT, null);
    }

    if (colKey === 'IM_VAL' || colKey === 'IM_RATE') {
      const imVal = parseNum(item.IM_VAL);
      const imRate = parseNum(item.IM_RATE);
      item.IM_AMT = (item.IM_VAL !== '' && item.IM_RATE !== '') ? formatNum((imVal * imRate) / 100, 2) : '';
      syncTableCellToDOM('items', rowIdx, 'IM_AMT', item.IM_AMT, null);
    }

    if (colKey === 'SCT_VAL' || colKey === 'SCT_RATE') {
      const sctVal = parseNum(item.SCT_VAL);
      const sctRate = parseNum(item.SCT_RATE);
      item.SCT_AMT = (item.SCT_VAL !== '' && item.SCT_RATE !== '') ? formatNum((sctVal * sctRate) / 100, 2) : '';
      syncTableCellToDOM('items', rowIdx, 'SCT_AMT', item.SCT_AMT, null);
    }

    if (colKey === 'EPT_VAL' || colKey === 'EPT_RATE') {
      const eptVal = parseNum(item.EPT_VAL);
      const eptRate = parseNum(item.EPT_RATE);
      item.EPT_AMT = (item.EPT_VAL !== '' && item.EPT_RATE !== '') ? formatNum((eptVal * eptRate) / 100, 2) : '';
      syncTableCellToDOM('items', rowIdx, 'EPT_AMT', item.EPT_AMT, null);
    }

    if (colKey === 'VAT_VAL' || colKey === 'VAT_RATE') {
      const vatVal = parseNum(item.VAT_VAL);
      const vatRate = parseNum(item.VAT_RATE);
      item.VAT_AMT = (item.VAT_VAL !== '' && item.VAT_RATE !== '') ? formatNum((vatVal * vatRate) / 100, 2) : '';
      syncTableCellToDOM('items', rowIdx, 'VAT_AMT', item.VAT_AMT, null);
    }

    if (colKey === 'FEE_VAL' || colKey === 'FEE_RATE') {
      const feeVal = parseNum(item.FEE_VAL);
      const feeRate = parseNum(item.FEE_RATE);
      item.FEE_AMT = (item.FEE_VAL !== '' && item.FEE_RATE !== '') ? formatNum((feeVal * feeRate) / 100, 2) : '';
      syncTableCellToDOM('items', rowIdx, 'FEE_AMT', item.FEE_AMT, null);
    }
  }

  // Mirror edited cell across all other tabs' tables without losing focus
  syncTableCellToDOM(tableType, rowIdx, colKey, rawVal, target);

  // ISO 6346 live validation on CONT inputs
  if (tableType === 'containers' && colKey === 'CONT') {
    validateContainerInputsInDOM();
  }

  recalculateAllTotals(true, tableType === 'containers');
}

function syncTableCellToDOM(tableType, rowIdx, colKey, value, sourceElement) {
  const selector =
    '[data-table-type="' + tableType + '"][data-row-idx="' + rowIdx + '"][data-col-key="' + colKey + '"]';

  document.querySelectorAll(selector).forEach(function (el) {
    if (el === sourceElement) return;
    if (el.tagName === 'SELECT') {
      ensureSelectHasOption(el, value);
    }
    el.value = value;
  });
}

function deleteItemRow(rowIdx) {

/* ==========================================================================
   ISO 6346 CONTAINER VALIDATION (^[A-Z]{4}\d{7}$)
   ========================================================================== */

function isValidIsoContainer(contNo) {
  const trimmed = String(contNo || '').trim().toUpperCase();
  if (!trimmed) return true; // empty is allowed (e.g. LCL)
  return ISO_6346_REGEX.test(trimmed);
}

function getInvalidIsoContainers() {
  const invalid = [];
  (APP_STATE.containers || []).forEach(function (c) {
    const val = String(c.CONT || '').trim().toUpperCase();
    if (val && !ISO_6346_REGEX.test(val)) {
      invalid.push(val);
    }
  });
  return invalid;
}

function validateContainerInputsInDOM() {
  document.querySelectorAll('[data-table-type="containers"][data-col-key="CONT"]').forEach(function (input) {
    const val = String(input.value || '').trim().toUpperCase();
    const valid = isValidIsoContainer(val);
    input.classList.toggle('iso-invalid', !valid);

    const cell = input.parentNode;
    if (!cell) return;
    let badge = cell.querySelector('.badge-warning-iso');
    if (!valid) {
      if (!badge) {
        badge = document.createElement('div');
        badge.className = 'badge-warning-iso';
        badge.textContent = 'Số Container chưa đúng chuẩn (4 chữ + 7 số)';
        cell.appendChild(badge);
      }
    } else if (badge) {
      badge.parentNode.removeChild(badge);
    }
  });
}

/* ==========================================================================
   REAL-TIME AUTO-CALCULATIONS & CURRENCY WORDS
   ========================================================================== */

function parseNum(val) {
  if (val == null || val === '') return 0;
  const cleaned = String(val).replace(/,/g, '').trim();
  const num = Number(cleaned);
  return isNaN(num) ? 0 : num;
}

function formatNum(num, maxDecimals) {
  if (num == null || isNaN(num)) return '';
  const factor = Math.pow(10, maxDecimals || 2);
  const rounded = Math.round((num + Number.EPSILON) * factor) / factor;
  if (rounded === 0) return '0';
  return String(rounded);
}

function recalculateTotals(syncDom, updateContainerCount) {
  recalculateAllTotals(syncDom !== false, updateContainerCount);
}

function recalculateAllTotals(syncDom, updateContainerCount) {
  const items = APP_STATE.items || [];
  const containers = APP_STATE.containers || [];

  let totQty = 0;
  let totAmt = 0;
  let totItemPack = 0;
  let totNw = 0;
  let totItemGw = 0;
  let totItemCbm = 0;
  let totExTax = 0;
  let totFee = 0;
  let totTax = 0;
  let firstUnit = '';

  items.forEach(function (it) {
    if (!firstUnit && it.UNIT) firstUnit = String(it.UNIT).trim();
    totQty += parseNum(it.QTY);
    totAmt += parseNum(it.AMT);
    totItemPack += parseNum(it.PACK);
    totNw += parseNum(it.NW);
    totItemGw += parseNum(it.GW);
    totItemCbm += parseNum(it.CBM);
    const exAmt = parseNum(it.EX_AMT);
    const feeAmt = parseNum(it.FEE_AMT);
    totExTax += exAmt;
    totFee += feeAmt;
    totTax += exAmt + feeAmt + parseNum(it.IM_AMT) + parseNum(it.SCT_AMT) + parseNum(it.EPT_AMT) + parseNum(it.VAT_AMT);
  });

  const rowTaxTotal = totExTax + totFee + items.reduce(function (acc, it) {
    return acc + parseNum(it.IM_AMT) + parseNum(it.SCT_AMT) + parseNum(it.EPT_AMT) + parseNum(it.VAT_AMT);
  }, 0);
  const sharedNkTax =
    parseNum(APP_STATE.shared.IM_AMT) +
    parseNum(APP_STATE.shared.SCT_AMT) +
    parseNum(APP_STATE.shared.EPT_AMT) +
    parseNum(APP_STATE.shared.VAT_AMT);
  totTax = rowTaxTotal + sharedNkTax;

  let totContPack = 0;
  let totContGw = 0;
  let totContCbm = 0;
  let totVgm = 0;

  containers.forEach(function (c) {
    totContPack += parseNum(c.PACK);
    const gw = parseNum(c.GW);
    const vgm = parseNum(c.VGM_WEI);
    totContGw += gw;
    totContCbm += parseNum(c.CBM);
    totVgm += vgm > 0 ? vgm : gw;
  });

  const totPack = totItemPack > 0 ? totItemPack : totContPack;
  const totGw = totItemGw > 0 ? totItemGw : totContGw;
  const totCbm = totItemCbm > 0 ? totItemCbm : totContCbm;

  const vatRate = parseNum(APP_STATE.shared.VAT_GST);
  const vatAmt = vatRate > 0 ? (totAmt * vatRate) / 100 : 0;
  const grandTotal = totAmt + vatAmt;

  const curr = String(APP_STATE.shared.CURR || 'USD').trim().toUpperCase();
  const amtForWords = vatRate > 0 ? grandTotal : totAmt;

  const updates = {
    TOT_QTY: totQty > 0 ? formatNum(totQty, 3) : (items.length ? '0' : ''),
    TOT_AMT: totAmt > 0 ? formatNum(totAmt, 2) : (items.length ? '0' : ''),
    VAT_TOTAL: vatRate > 0 ? formatNum(vatAmt, 2) : '',
    GRAND_TOTAL: grandTotal > 0 ? formatNum(grandTotal, 2) : (items.length ? '0' : ''),
    TOT_PACK: totPack > 0 ? formatNum(totPack, 2) : '',
    TOT_NW: totNw > 0 ? formatNum(totNw, 3) : '',
    TOT_GW: totGw > 0 ? formatNum(totGw, 3) : '',
    TOT_CBM: totCbm > 0 ? formatNum(totCbm, 3) : '',
    TOT_VGM: totVgm > 0 ? formatNum(totVgm, 3) : '',
    TOT_EX_TAX: totExTax > 0 ? formatNum(totExTax, 2) : '',
    TOT_FEE: totFee > 0 ? formatNum(totFee, 2) : '',
    TOT_TAX: totTax > 0 ? formatNum(totTax, 2) : '',
    TOT_AMT_WORDS: amtForWords > 0
      ? (curr === 'VND'
        ? numberToVietnameseWords(amtForWords, 'VND')
        : numberToEnglishWords(amtForWords, curr))
      : '',
    TOT_TAX_WORDS: totTax > 0 ? numberToVietnameseWords(totTax, 'VND') : ''
  };

  if (updateContainerCount || !APP_STATE.shared.TOTAL_CONTAINERS_TEXT) {
    updates.TOTAL_CONTAINERS_TEXT = containers.length > 0 ? String(containers.length) : '';
  }

  if (!APP_STATE.shared.TOT_UNIT && firstUnit) {
    updates.TOT_UNIT = firstUnit;
  }

  // Auto-generate CONTAINER_SEAL_DETAILS preview in shared
  const contDetails = containers
    .map(function (c) {
      return [c.CONT, c.CTYPE, c.SEAL]
        .map(function (v) { return String(v || '').trim(); })
        .filter(Boolean)
        .join(' / ');
    })
    .filter(Boolean)
    .join('\n');
  updates.CONTAINER_SEAL_DETAILS = contDetails;

  Object.keys(updates).forEach(function (k) {
    if (syncDom) {
      setSharedFieldAndSync(k, updates[k]);
    } else {
      APP_STATE.shared[k] = updates[k];
    }
  });
}

/* ==========================================================================
   ENGLISH & VIETNAMESE CURRENCY IN WORDS
   ========================================================================== */

function numberToEnglishWords(amount, currencyCode) {
  const num = Number(amount);
  if (isNaN(num) || num <= 0) return '';

  const rounded = Math.round(num * 100) / 100;
  const intPart = Math.floor(rounded);
  const decPart = Math.round((rounded - intPart) * 100);

  const ones = [
    '', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE',
    'TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN',
    'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'
  ];
  const tens = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];
  const scales = ['', 'THOUSAND', 'MILLION', 'BILLION', 'TRILLION'];

  function threeDigitsToEn(n) {
    let words = [];
    const h = Math.floor(n / 100);
    const rem = n % 100;
    if (h > 0) words.push(ones[h] + ' HUNDRED');
    if (rem > 0) {
      if (rem < 20) {
        words.push(ones[rem]);
      } else {
        const t = Math.floor(rem / 10);
        const o = rem % 10;
        words.push(o > 0 ? tens[t] + '-' + ones[o] : tens[t]);
      }
    }
    return words.join(' ');
  }

  function convertInt(n) {
    if (n === 0) return 'ZERO';
    let parts = [];
    let scaleIdx = 0;
    while (n > 0) {
      const chunk = n % 1000;
      if (chunk > 0) {
        const chunkStr = threeDigitsToEn(chunk);
        parts.unshift(scales[scaleIdx] ? chunkStr + ' ' + scales[scaleIdx] : chunkStr);
      }
      n = Math.floor(n / 1000);
      scaleIdx++;
    }
    return parts.join(' ');
  }

  const currNames = {
    USD: { major: 'US DOLLARS', minor: 'CENTS' },
    EUR: { major: 'EUROS', minor: 'CENTS' },
    JPY: { major: 'JAPANESE YEN', minor: 'SEN' },
    GBP: { major: 'POUNDS STERLING', minor: 'PENCE' },
    CNY: { major: 'CHINESE YUAN', minor: 'FEN' },
    SGD: { major: 'SINGAPORE DOLLARS', minor: 'CENTS' },
    AUD: { major: 'AUSTRALIAN DOLLARS', minor: 'CENTS' },
    KRW: { major: 'KOREAN WON', minor: 'JEON' },
    VND: { major: 'VIETNAM DONG', minor: 'XU' }
  };

  const curr = currNames[currencyCode] || { major: currencyCode || 'US DOLLARS', minor: 'CENTS' };
  let result = 'SAY TOTAL: ' + curr.major + ' ' + convertInt(intPart);
  if (decPart > 0) {
    result += ' AND ' + convertInt(decPart) + ' ' + curr.minor;
  }
  return result + ' ONLY.';
}

function numberToVietnameseWords(amount, currencyCode) {
  const num = Math.round(Number(amount));
  if (isNaN(num) || num <= 0) return '';

  const digits = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  const units = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'];

  function readThreeDigits(n, showZeroHundred) {
    const tram = Math.floor(n / 100);
    const chuc = Math.floor((n % 100) / 10);
    const donvi = n % 10;
    let res = '';

    if (tram > 0 || showZeroHundred) {
      res += digits[tram] + ' trăm ';
    }
    if (chuc > 1) {
      res += digits[chuc] + ' mươi ';
      if (donvi === 1) res += 'mốt';
      else if (donvi === 5) res += 'lăm';
      else if (donvi > 0) res += digits[donvi];
    } else if (chuc === 1) {
      res += 'mười ';
      if (donvi === 5) res += 'lăm';
      else if (donvi > 0) res += digits[donvi];
    } else if (donvi > 0) {
      if (tram > 0 || showZeroHundred) res += 'lẻ ';
      res += digits[donvi];
    }
    return res.trim();
  }

  let n = num;
  const groups = [];
  while (n > 0) {
    groups.push(n % 1000);
    n = Math.floor(n / 1000);
  }

  let parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    if (groups[i] > 0) {
      const showZero = i < groups.length - 1;
      const text = readThreeDigits(groups[i], showZero);
      parts.push(units[i] ? text + ' ' + units[i] : text);
    }
  }

  let joined = parts.join(' ').replace(/\s+/g, ' ').trim();
  joined = joined.charAt(0).toUpperCase() + joined.slice(1);
  const unitLabel = currencyCode && currencyCode !== 'VND' ? currencyCode : 'đồng';
  return joined + ' ' + unitLabel + ' chẵn.';
}
