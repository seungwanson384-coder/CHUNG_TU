function applyBrandLogoDataUrl(logoUrl) {
  if (!logoUrl || typeof logoUrl !== 'string') return;
  APP_STATE.logoDataUrl = logoUrl;
  document.querySelectorAll('.brand-logo-img, #loginBrandLogo, #headerBrandLogo').forEach(function (img) {
    if (img.getAttribute('src') !== logoUrl) {
      img.setAttribute('src', logoUrl);
    }
  });
  const favicon = document.getElementById('appFavicon');
  if (favicon && logoUrl.indexOf('data:image/') === 0) {
    favicon.setAttribute('href', logoUrl);
  }
}

function loadBrandLogoOnStart() {
  if (APP_STATE.logoDataUrl && APP_STATE.logoDataUrl.indexOf('data:image/') === 0) {
    applyBrandLogoDataUrl(APP_STATE.logoDataUrl);
    return;
  }
  if (window.google && google.script && google.script.run && typeof google.script.run.getBrandLogoBase64 === 'function') {
    google.script.run
      .withSuccessHandler(function (dataUri) {
        if (dataUri) applyBrandLogoDataUrl(dataUri);
      })
      .withFailureHandler(function () {})
      .getBrandLogoBase64();
  }
}

function showLoading(message) {
  const overlay = document.getElementById('loadingOverlay');
  const textEl = document.getElementById('loadingMessage');
  if (textEl) textEl.textContent = message || 'Loading...';
  if (overlay) overlay.classList.remove('hidden');
}

function hideLoading() {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.classList.add('hidden');
}

function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'info');
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(function () {
    if (toast.parentNode) {
      toast.parentNode.removeChild(toast);
    }
  }, 4200);
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function isAdminUser_(userObj) {
  const u = userObj || (typeof APP_STATE !== 'undefined' ? APP_STATE.user : null);
  if (!u) return false;
  const roleVal = String(u.vaiTro || u.role || '').trim().toUpperCase();
  return roleVal === 'ADMIN';
}

function isAdminTab_(tabKey) {
  return tabKey === 'ADMIN_PANEL' || tabKey === 'ADMIN_ACCOUNTS';
}

function isStepLocked_(tabKey) {
  if (!tabKey || tabKey === 'MASTER_PARTIES' || isAdminTab_(tabKey)) {
    return false;
  }
  if (APP_STATE.adminUnlockAllSteps) {
    return false;
  }
  const idx = DOC_STEP_ORDER.indexOf(tabKey);
  if (idx === -1) return false;
  return idx > (APP_STATE.unlockedStepIndex || 0);
}

  if (APP_STATE.adminUnlockAllSteps) return true;
  const blIdx = DOC_STEP_ORDER.indexOf('BILL_OF_LADING');
  if (blIdx === -1) return true;
  return (APP_STATE.unlockedStepIndex || 0) >= blIdx || APP_STATE.activeTab === 'BILL_OF_LADING';
}

function recomputeUnlockedStepIndex_() {
  let chainIdx = 0;
  for (let i = 0; i < DOC_STEP_ORDER.length - 1; i++) {
    if (isStepComplete_(DOC_STEP_ORDER[i])) {
      chainIdx = i + 1;
    } else {
      break;
    }
  }
  const activeIdx = DOC_STEP_ORDER.indexOf(APP_STATE.activeTab);
  let nextIdx = Math.max(APP_STATE.unlockedStepIndex || 0, chainIdx);
  if (activeIdx >= 0 && activeIdx <= nextIdx && activeIdx < DOC_STEP_ORDER.length - 1 && isStepComplete_(DOC_STEP_ORDER[activeIdx])) {
    nextIdx = Math.max(nextIdx, activeIdx + 1);
  }
  APP_STATE.unlockedStepIndex = Math.min(DOC_STEP_ORDER.length - 1, nextIdx);
}

function updateSidebarLockState_() {
  recomputeUnlockedStepIndex_();
  const prevBlUnlocked = APP_STATE._lastBlUnlockedState;
  const nowBlUnlocked = isBillOfLadingReached_();

  document.querySelectorAll('.sidebar-nav-btn[data-nav]').forEach(function (btn) {
    const navKey = btn.getAttribute('data-nav');
    const locked = isStepLocked_(navKey);
    btn.classList.toggle('locked', locked);
    btn.setAttribute('aria-disabled', locked ? 'true' : 'false');
    const iconSpan = btn.querySelector('.nav-lock-icon');
    if (iconSpan) {
      iconSpan.textContent = locked ? '\uD83D\uDD12' : '';
    }
  });

  const isAdmin = isAdminUser_();
  const adminGroup = document.getElementById('adminSidebarGroup');
  if (adminGroup) {
    adminGroup.classList.toggle('hidden', !isAdmin);
    adminGroup.style.display = isAdmin ? 'block' : 'none';
  }

  const adminUnlockBtn = document.getElementById('btnAdminUnlockAllSteps');
  if (adminUnlockBtn) {
    adminUnlockBtn.classList.toggle('hidden', !isAdmin);
    if (APP_STATE.adminUnlockAllSteps) {
      adminUnlockBtn.textContent = '\uD83D\uDD13 Đã mở';
      adminUnlockBtn.classList.add('unlocked-active');
    } else {
      adminUnlockBtn.textContent = '\uD83D\uDD12 Đang khóa';
      adminUnlockBtn.classList.remove('unlocked-active');
    }
  }

  const adminSampleBtn = document.getElementById('btnAdminFillSample');
  if (adminSampleBtn) {
    adminSampleBtn.classList.toggle('hidden', !isAdmin);
  }

  if (prevBlUnlocked !== nowBlUnlocked) {
    APP_STATE._lastBlUnlockedState = nowBlUnlocked;
    updateFieldAndTableLocksInDOM_();
  }
}

function toggleAdminUnlockAllSteps() {
  if (!isAdminUser_()) return;
  APP_STATE.adminUnlockAllSteps = !APP_STATE.adminUnlockAllSteps;

  updateFieldAndTableLocksInDOM_();

  );
}

function handleAdminFillSampleData() {
  if (!isAdminUser_()) return;
  const sample = buildFullSampleDataset_();

  if (APP_STATE.adminUnlockAllSteps) {
    APP_STATE.shared = Object.assign({}, APP_STATE.shared, sample.shared);
    APP_STATE.items = sample.items.map(function (row) { return Object.assign(createEmptyItem(), row); });
    APP_STATE.containers = sample.containers.map(function (row) { return Object.assign(createEmptyContainer(), row); });
    APP_STATE.unlockedStepIndex = DOC_STEP_ORDER.length - 1;
    APP_STATE.manualFlags = {
      IM_VAL: false,
      SCT_VAL: false,
      VAT_VAL: false,
      TOTAL_CONTAINERS_TEXT: false,
      SHIPMENT_DEADLINE: false
    };

    normalizeCheckboxFieldsInState();
    normalizeNumericFieldsInState_();
    recalculateAllTotals(false, true, { sourceKey: 'EX_RATE', targetDocKey: APP_STATE.activeTab });
    renderAllFormViews();
    refreshScheduleDropdownSuggestions_();
    refreshCurrencyDropdownSuggestions_();
    updateSidebarLockState_();
    updateFieldAndTableLocksInDOM_();
    validateContainerInputsInDOM();
    updateCurrencyBadgesInDOM_();
    updateAllContextBanners();

    showToast('Đã điền đầy đủ dữ liệu mẫu cho toàn bộ 21 mục! Sẵn sàng Review & Xuất hàng loạt.', 'success');
    return;
  }

  let targetTab = APP_STATE.activeTab || 'MASTER_PARTIES';
  if (isAdminTab_(targetTab)) {
    targetTab = 'MASTER_PARTIES';
    APP_STATE.activeTab = targetTab;
  }

  const cfg = (typeof DOC_FORM_CONFIGS !== 'undefined' && DOC_FORM_CONFIGS[targetTab]) ? DOC_FORM_CONFIGS[targetTab] : null;
  if (cfg && Array.isArray(cfg.sections)) {
    cfg.sections.forEach(function (sec) {
      (sec.fields || []).forEach(function (field) {
        const lockInfo = typeof getFieldLockInfo_ === 'function' ? getFieldLockInfo_(targetTab, field.key) : { locked: false };
        if (lockInfo && lockInfo.locked) return;
        if (field.readonly) return;
        if (Object.prototype.hasOwnProperty.call(sample.shared, field.key)) {
          APP_STATE.shared[field.key] = sample.shared[field.key];
        }
      });
    });
  }

  if (targetTab === 'To_khai_NK') {
    APP_STATE.shared.DEC_TYPE = 'A11 - Nhập kinh doanh tiêu dùng';
    APP_STATE.lastTaxTab = 'To_khai_NK';
  } else if (targetTab === 'To_khai_XK') {
    APP_STATE.shared.DEC_TYPE = 'B11 - Xuất kinh doanh';
    APP_STATE.lastTaxTab = 'To_khai_XK';
  }

  const tables = cfg && Array.isArray(cfg.tables) ? cfg.tables : [];
  const needsItems = tables.some(function (t) { return t.type === 'items' || t.type === 'tax'; });
  const needsContainers = tables.some(function (t) { return t.type === 'containers'; }) && !DOCS_CONT_TABLE_LOCKED[targetTab];

  if (needsItems) {
    const firstIt = APP_STATE.items && APP_STATE.items[0];
    const hasCoreItem = firstIt && hasFilledVal_(firstIt.PROD) && (hasFilledVal_(firstIt.QTY) || hasFilledVal_(firstIt.GW) || hasFilledVal_(firstIt.CBM));
    if (!APP_STATE.items || APP_STATE.items.length === 0 || !hasCoreItem) {
      APP_STATE.items = sample.items.map(function (row) { return Object.assign(createEmptyItem(), row); });
    } else {
      APP_STATE.items.forEach(function (row, idx) {
        const srcRow = sample.items[idx % sample.items.length];
        Object.keys(srcRow).forEach(function (colKey) {
          if (!hasFilledVal_(row[colKey]) && hasFilledVal_(srcRow[colKey])) {
            row[colKey] = srcRow[colKey];
          }
        });
      });
    }
  }

  if (needsContainers) {
    const sealLocked = Boolean(DOCS_CONT_REQUIRED_SEAL_LOCKED[targetTab]);
    const firstCont = APP_STATE.containers && APP_STATE.containers[0];
    const contMissing = !firstCont || !hasFilledVal_(firstCont.CONT);
    const sealMissing = !sealLocked && (!firstCont || !hasFilledVal_(firstCont.SEAL));
    const vgmMissing = targetTab === 'VGM' && (!firstCont || !hasFilledVal_(firstCont.VGM_WEI));
    if (!APP_STATE.containers || APP_STATE.containers.length === 0 || contMissing || sealMissing || vgmMissing) {
      APP_STATE.containers = sample.containers.map(function (row) {
        const copy = Object.assign(createEmptyContainer(), row);
        if (sealLocked && !(firstCont && hasFilledVal_(firstCont.SEAL))) {
          copy.SEAL = '';
        }
        return copy;
      });
    }
  }

  if (APP_STATE.manualFlags) {
    APP_STATE.manualFlags.TOTAL_CONTAINERS_TEXT = false;
    if (targetTab === 'To_khai_NK') {
      APP_STATE.manualFlags.IM_VAL = false;
    }
  }

  normalizeCheckboxFieldsInState();
  normalizeNumericFieldsInState_();
  recalculateAllTotals(false, true, {
    sourceKey: targetTab === 'To_khai_NK' ? 'EX_RATE' : 'TAB_SWITCH',
    targetDocKey: targetTab
  });
  APP_STATE.activeTab = targetTab;
  renderAllFormViews();
  refreshScheduleDropdownSuggestions_();
  refreshCurrencyDropdownSuggestions_();

  const curIdx = DOC_STEP_ORDER.indexOf(targetTab);
  recomputeUnlockedStepIndex_();
  if (curIdx >= 0 && curIdx < DOC_STEP_ORDER.length - 1) {
    APP_STATE.unlockedStepIndex = Math.max(APP_STATE.unlockedStepIndex || 0, curIdx + 1);
  }
  updateSidebarLockState_();
  updateFieldAndTableLocksInDOM_();
  validateContainerInputsInDOM();
  updateCurrencyBadgesInDOM_();
  updateAllContextBanners();

  const titleLabel = cfg && cfg.title ? cfg.title : targetTab;
  showToast('Đã điền dữ liệu mẫu cho "' + titleLabel + '" và mở khóa bước tiếp theo!', 'success');
}

function updateFieldAndTableLocksInDOM_() {
  const blUnlocked = isBillOfLadingReached_();
  ['PHYTOSANITARY_CERTIFICATE', 'FUMIGATION_CERTIFICATE'].forEach(function (docKey) {
    const wrap = document.querySelector('[data-field-wrap="' + docKey + '_BL_NO"]');
    if (!wrap) return;
    const inp = wrap.querySelector('[data-sync="BL_NO"]');
    const badge = wrap.querySelector('[data-lock-badge="true"]');
    if (inp) {
      if (blUnlocked) {
        inp.removeAttribute('readonly');
        inp.removeAttribute('disabled');
        inp.classList.remove('field-locked-input');
      } else {
        inp.setAttribute('readonly', 'readonly');
        inp.setAttribute('disabled', 'disabled');
        inp.classList.add('field-locked-input');
      }
    }
    if (badge) {
      badge.classList.toggle('hidden', blUnlocked);
    }
  });
}

function switchTab(tabKey) {
  if (isStepLocked_(tabKey)) {
    showToast('Vui lòng hoàn tất chứng từ phía trước để mở khóa', 'warning');
    return;
  }

  APP_STATE.activeTab = tabKey;

  if (tabKey === 'To_khai_XK' || tabKey === 'To_khai_NK') {
    APP_STATE.lastTaxTab = tabKey;
  }

  document.querySelectorAll('.sidebar-nav-btn[data-nav], #btnAdminSystem[data-nav]').forEach(function (btn) {
    const navKey = btn.getAttribute('data-nav');
    const isActive = navKey === tabKey || (isAdminTab_(tabKey) && isAdminTab_(navKey));
    btn.classList.toggle('active', isActive);
    if (isActive) {
      const parentGroup = btn.closest('.sidebar-group[data-group-id]');
      if (parentGroup) {
        setSidebarGroupExpanded(parentGroup.getAttribute('data-group-id'), true);
      }
    }
  });

  document.querySelectorAll('.doc-panel[data-tab-panel]').forEach(function (panel) {
    const panelKey = panel.getAttribute('data-tab-panel');
    const isActive = panelKey === tabKey || (isAdminTab_(tabKey) && isAdminTab_(panelKey));
    panel.classList.toggle('active', isActive);
  });

  const sidebar = document.getElementById('appSidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
  }

  recalculateAllTotals(true, false, { sourceKey: 'TAB_SWITCH', targetDocKey: tabKey });
  updateSidebarLockState_();
  updateFieldAndTableLocksInDOM_();
  validateContainerInputsInDOM();

  if (isAdminTab_(tabKey) && isAdminUser_()) {
    loadAdminAccountsTables();
  }
}

function handleLoginSubmit(event) {
  event.preventDefault();

  const username = document.getElementById('loginMaSV').value.trim();
  const password = document.getElementById('loginMatKhau').value.trim();
  const errorBox = document.getElementById('loginError');

  errorBox.classList.add('hidden');
  errorBox.textContent = '';

  if (!username || !password) {
    errorBox.textContent = 'Vui lòng nhập đầy đủ Tên đăng nhập và Mật khẩu.';
    errorBox.classList.remove('hidden');
    return;
  }

  showLoading('Loading...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        hideLoading();
        errorBox.textContent = (res && res.message) || 'Đăng nhập thất bại.';
        errorBox.classList.remove('hidden');
        return;
      }

      const normalizedRole = String(res.user.vaiTro || res.user.role || 'SV').trim().toUpperCase();
      APP_STATE.user = Object.assign({}, res.user, {
        vaiTro: normalizedRole,
        role: normalizedRole
      });
      APP_STATE.adminUnlockAllSteps = false;
      APP_STATE.exportResults = {};
      restoreDraftState(res.draftJson != null ? res.draftJson : res.draft);

      const isAdmin = isAdminUser_(APP_STATE.user);
      const badgeText = document.getElementById('userBadgeText');
      if (badgeText) {
        const displayName = String(res.user.tenSV || '').trim();
        const displayId = String(res.user.maSV || '').trim();
        const roleLabel = isAdmin ? ' [ADMIN]' : '';
        badgeText.textContent = (displayName && displayId
          ? displayName + ' (' + displayId + ')'
          : (displayName || displayId || 'Sinh viên')) + roleLabel;
      }

      const adminGroup = document.getElementById('adminSidebarGroup');
      if (adminGroup) {
        adminGroup.classList.toggle('hidden', !isAdmin);
        adminGroup.style.display = isAdmin ? 'block' : 'none';
      }

      loadInitialDropdowns();
    })
    .withFailureHandler(function (err) {
      hideLoading();
      errorBox.textContent = 'Lỗi kết nối máy chủ: ' + (err && err.message ? err.message : err);
      errorBox.classList.remove('hidden');
    })
    .loginUser(username, password);
}

      if (!res || !res.success) {

function handleExcelFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (typeof XLSX === 'undefined') {
    showToast('Thư viện đọc file Excel (SheetJS) chưa được tải.', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

      if (jsonRows.length < 2) {
        showToast('File Excel không có dữ liệu hợp lệ.', 'warning');
        return;
      }

      const headers = jsonRows[0].map(function (h) { return String(h || '').trim().toLowerCase(); });
      let maIdx = headers.indexOf('ma_sv');
      let tenIdx = headers.indexOf('ten_sv');
      let roleIdx = headers.indexOf('vai_tro');

      if (maIdx === -1) maIdx = headers.indexOf('masv') !== -1 ? headers.indexOf('masv') : 0;
      if (tenIdx === -1) tenIdx = headers.indexOf('tensv') !== -1 ? headers.indexOf('tensv') : 1;
      if (roleIdx === -1) roleIdx = headers.indexOf('vaitro') !== -1 ? headers.indexOf('vaitro') : 2;

      const accountsArray = [];
      for (let r = 1; r < jsonRows.length; r++) {
        const row = jsonRows[r];
        if (!row || row.length === 0) continue;
        const maSV = String(row[maIdx] != null ? row[maIdx] : '').trim();
        const tenSV = String(row[tenIdx] != null ? row[tenIdx] : '').trim();
        const vaiTro = String(roleIdx < row.length && row[roleIdx] != null ? row[roleIdx] : 'SV').trim();
        if (maSV && tenSV) {
          accountsArray.push({ maSV: maSV, tenSV: tenSV, vaiTro: vaiTro });
        }
      }

      if (accountsArray.length === 0) {
        showToast('Không tìm thấy dòng tài khoản hợp lệ trong file Excel.', 'warning');
        return;
      }

      showLoading('Loading...');
      google.script.run
        .withSuccessHandler(function (res) {
          hideLoading();
          if (!res || !res.success) {
            showToast((res && res.message) || 'Nạp hàng loạt thất bại.', 'error');
            return;
          }
          showToast('Đã nạp thành công ' + (res.addedCount || accountsArray.length) + ' tài khoản từ file Excel!', 'success');
          loadAdminAccountsTable();
          event.target.value = '';
        })
        .withFailureHandler(function (err) {
          hideLoading();
          showToast('Lỗi nạp file Excel: ' + (err && err.message ? err.message : err), 'error');
        })
        .adminBulkAddAccounts(APP_STATE.user.maSV, accountsArray);
    } catch (parseErr) {
      showToast('Lỗi đọc file Excel: ' + parseErr.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function getTodayYYMMDD_() {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');

function normalizeCheckboxSymbol(val) {
  if (val === true) return '\u2611';
  if (val === false || val == null) return '\u2610';
  const str = String(val).trim();
  if (!str || str === '\u2610') return '\u2610';
  const lower = str.toLowerCase();
  if (str === '\u2611' || lower === 'true' || lower === '1' || lower === 'x' || lower === 'yes' || lower === 'on') {
    return '\u2611';
  }
  return '\u2610';
}

function restoreDraftState(draftJson) {
  APP_STATE.shared = {};
  APP_STATE.items = [createEmptyItem()];
  APP_STATE.containers = [createEmptyContainer()];
  APP_STATE.unlockedStepIndex = 0;

  if (draftJson && typeof draftJson === 'string' && draftJson.trim() !== '') {
    try {
      const parsed = JSON.parse(draftJson);
      if (parsed && typeof parsed === 'object') {
        if (parsed.shared && typeof parsed.shared === 'object') {
          Object.keys(parsed.shared).forEach(function (k) {
            APP_STATE.shared[k] = parsed.shared[k] == null ? '' : String(parsed.shared[k]);
          });
        }
        if (Array.isArray(parsed.items)) {
          APP_STATE.items = parsed.items.length > 0
            ? parsed.items.map(function (row) {
                const merged = Object.assign(createEmptyItem(), row);
                if (merged.HS != null && String(merged.HS).trim() !== '') {
                  merged.HS = formatHsCode_(merged.HS);
                }
                return merged;
              })
            : [];
        }
        if (Array.isArray(parsed.containers)) {
          APP_STATE.containers = parsed.containers.length > 0
            ? parsed.containers.map(function (row) { return Object.assign(createEmptyContainer(), row); })
            : [];
        }
        if (typeof parsed.unlockedStepIndex === 'number' && !isNaN(parsed.unlockedStepIndex)) {
          APP_STATE.unlockedStepIndex = Math.max(0, Math.min(DOC_STEP_ORDER.length - 1, Math.floor(parsed.unlockedStepIndex)));
        }
      }
    } catch (e) {
      showToast('Dữ liệu nháp cũ không đúng định dạng, đã khởi tạo biểu mẫu mới.', 'warning');
    }
  }

  initDefaultDocumentNumbers(false);
  normalizeCheckboxFieldsInState();
  recomputeUnlockedStepIndex_();
}

function base64ToUint8Array_(base64Str) {
  const binary = atob(base64Str);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

function base64ToBlobUrl_(base64Str, mimeType) {
  const bytes = base64ToUint8Array_(base64Str);
  const blob = new Blob([bytes], { type: mimeType || 'application/pdf' });
  return URL.createObjectURL(blob);
}

function loadScriptOnce_(url) {
  return new Promise(function (resolve, reject) {
    const existing = document.querySelector('script[data-pdfjs-src="' + url + '"]');
    if (existing) {
      resolve();
      return;
    }
    const script = document.createElement('script');
    script.src = url;
    script.async = true;
    script.setAttribute('data-pdfjs-src', url);
    script.onload = function () { resolve(); };
    script.onerror = function () { reject(new Error('Failed to load ' + url)); };
    document.head.appendChild(script);
  });
}

function ensurePdfJsLoaded_() {
  if (window.pdfjsLib && typeof window.pdfjsLib.getDocument === 'function') {
    return Promise.resolve(window.pdfjsLib);
  }
  if (pdfJsLoadPromise_) {
    return pdfJsLoadPromise_;
  }

  const cdnPairs = [
    {
      worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
      lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'
    },
    {
      worker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
      lib: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'
    }
  ];

  function tryPair(idx) {
    if (idx >= cdnPairs.length) {
      return Promise.reject(new Error('Không thể tải thư viện hiển thị PDF (PDF.js).'));
    }
    const pair = cdnPairs[idx];
    return loadScriptOnce_(pair.worker)
      .catch(function () { return null; })
      .then(function () { return loadScriptOnce_(pair.lib); })
      .then(function () {
        if (window.pdfjsLib && typeof window.pdfjsLib.getDocument === 'function') {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = pair.worker;
          return window.pdfjsLib;
        }
        return tryPair(idx + 1);
      })
      .catch(function () {
        return tryPair(idx + 1);
      });
  }

  pdfJsLoadPromise_ = tryPair(0).catch(function (err) {
    pdfJsLoadPromise_ = null;
    throw err;
  });
  return pdfJsLoadPromise_;
}

function setPreviewBackgroundScrollLock_(locked) {

async function renderPdfBase64ToCanvases_(base64Str, containerEl) {
  const pdfjsLib = await ensurePdfJsLoaded_();
  const pdfBytes = base64ToUint8Array_(base64Str);
  const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
  const pdfDoc = await loadingTask.promise;

  containerEl.innerHTML = '';

  const viewportEl = document.getElementById('previewModalViewport') || containerEl.parentNode;
  const viewportWidth = viewportEl && viewportEl.clientWidth ? viewportEl.clientWidth : 980;
  const availableWidth = Math.max(320, viewportWidth - 120);
  const outputScale = Math.min(window.devicePixelRatio || 1, 2);
  const fragment = document.createDocumentFragment();

  for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
    const page = await pdfDoc.getPage(pageNum);
    const baseViewport = page.getViewport({ scale: 1 });
    const cssScale = Math.min(2.0, Math.max(0.75, availableWidth / baseViewport.width));
    const viewport = page.getViewport({ scale: cssScale });

    const sheet = document.createElement('div');
    sheet.className = 'preview-a4-sheet preview-page-card';

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = '100%';
    canvas.style.height = 'auto';

    sheet.appendChild(canvas);
    fragment.appendChild(sheet);

    const renderContext = {
      canvasContext: ctx,
      transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
      viewport: viewport
    };
    await page.render(renderContext).promise;
  }

  containerEl.appendChild(fragment);
  containerEl.classList.remove('hidden');
  return pdfDoc.numPages;
}

function extractShortCodeForExport_(rawVal, fieldKey) {
  const str = String(rawVal == null ? '' : rawVal).trim();
  if (!str) return '';

  let depth = 0;
  let cutIdx = -1;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charAt(i);
    if (ch === '(') {
      depth++;
    } else if (ch === ')' && depth > 0) {
      depth--;
    } else if (depth === 0) {
      if (ch === ':') {
        cutIdx = i;
        break;
      }
      if ((ch === '-' || ch === '\u2013' || ch === '\u2014') &&
          i > 0 && str.charAt(i - 1) === ' ' &&
          i + 1 < str.length && str.charAt(i + 1) === ' ') {
        cutIdx = i - 1;
        break;
      }
    }
  }

  let code = (cutIdx !== -1 ? str.slice(0, cutIdx) : str).trim();

  if (fieldKey === 'INS_TERM') {
    const m = code.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (m && m[1].trim() && m[2].trim().length > 3) {
      code = m[1].trim();
    }
    return code;
  }

  let prev;
  do {
    prev = code;
    code = code.replace(/\s*\([^)]*\)\s*$/, '').trim();
  } while (code !== prev && code.length > 0);

  return code;
}

function buildExportPayload(targetDocKey) {
  recalculateAllTotals(false, false, { targetDocKey: targetDocKey || '' });
  normalizeCheckboxFieldsInState();

  const sharedClone = {};
  Object.keys(APP_STATE.shared || {}).forEach(function (k) {
    sharedClone[k] = APP_STATE.shared[k];
  });

  ['INS_TERM', 'CO_FORM_NAME', 'CTYPE', 'UNIT', 'TOT_UNIT', 'CURR'].forEach(function (k) {
    if (sharedClone[k] != null && String(sharedClone[k]).trim() !== '') {
      sharedClone[k] = extractShortCodeForExport_(sharedClone[k], k);
    }
  });

  if (!sharedClone.CURR || String(sharedClone.CURR).trim() === '') {
    sharedClone.CURR = 'USD';
  }

  Object.keys(NUMERIC_SHARED_FIELD_MAP).forEach(function (numKey) {
    if (sharedClone[numKey] != null && String(sharedClone[numKey]).trim() !== '') {
      sharedClone[numKey] = normalizeFormattedNumberString_(sharedClone[numKey]);
    }
  });

  const itemsClone = (APP_STATE.items || []).map(function (row) {
    const copy = Object.assign({}, row);
    if (copy.HS != null && String(copy.HS).trim() !== '') {
      copy.HS = formatHsCode_(copy.HS);
    }
    ['PREF', 'UNIT', 'UNIT_PACK', 'CTYPE'].forEach(function (col) {
      if (copy[col] != null && String(copy[col]).trim() !== '') {
        copy[col] = extractShortCodeForExport_(copy[col], col);
      }
    });
    Object.keys(NUMERIC_TABLE_COL_MAP).forEach(function (col) {
      if (copy[col] != null && String(copy[col]).trim() !== '') {
        copy[col] = normalizeFormattedNumberString_(copy[col]);
      }
    });
    return copy;
  });

  const containersClone = (APP_STATE.containers || []).map(function (row) {
    const copy = Object.assign({}, row);
    ['CTYPE', 'CSIZE', 'UNIT_PACK'].forEach(function (col) {
      if (copy[col] != null && String(copy[col]).trim() !== '') {
        copy[col] = extractShortCodeForExport_(copy[col], col);
      }
    });
    Object.keys(NUMERIC_TABLE_COL_MAP).forEach(function (col) {
      if (copy[col] != null && String(copy[col]).trim() !== '') {
        copy[col] = normalizeFormattedNumberString_(copy[col]);
      }
    });
    return copy;
  });

  return {
    shared: sharedClone,
    items: itemsClone,
    containers: containersClone
  };
}

function getRowPot_(row) {
  return String((row && (row.pot || row.POT)) || '').trim();
}

function matchesServiceType_(row, serviceType, anyRowHasType) {
  const selected = String(serviceType || '').trim().toUpperCase();
  if (!selected) return true;
  const rowType = getRowServiceType_(row);
  if (!rowType) {
    return !anyRowHasType;
  }
  return rowType.indexOf(selected) !== -1;
}

function getFilteredCuocTauByServiceType_(serviceTypeOverride) {
  const cuocTau = APP_STATE.dropdowns.cuocTau || [];
  const selectedService = serviceTypeOverride !== undefined
    ? serviceTypeOverride
    : (APP_STATE.shared.SERVICE_TYPE || '');
  const anyRowHasType = cuocTau.some(function (r) { return getRowServiceType_(r) !== ''; });
  return cuocTau.filter(function (row) {
    return matchesServiceType_(row, selectedService, anyRowHasType);
  });
}

function collectUniqueValues_(rows, getter) {
  const list = [];
  const seen = {};
  (rows || []).forEach(function (row) {
    const val = String(getter(row) || '').trim();
    if (val && !seen[val]) {
      seen[val] = true;
      list.push(val);
    }
  });
  return list;
}

function getScheduleOptionsForSource_(fieldKey) {
  if (APP_STATE.scheduleOptions && Array.isArray(APP_STATE.scheduleOptions[fieldKey])) {
    return APP_STATE.scheduleOptions[fieldKey];
  }
  const serviceRows = getFilteredCuocTauByServiceType_();
  const currentPol = String(APP_STATE.shared.POL || '').trim();
  const currentPod = String(APP_STATE.shared.POD || '').trim();
  if (fieldKey === 'POL') return collectUniqueValues_(serviceRows, function (r) { return r.POL; });
  if (fieldKey === 'POD') {
    const podRows = currentPol ? serviceRows.filter(function (r) { return r.POL === currentPol; }) : serviceRows;
    return collectUniqueValues_(podRows.length > 0 ? podRows : serviceRows, function (r) { return r.POD; });
  }
  let carrierRows = serviceRows;
  if (currentPol || currentPod) {
    const routeRows = serviceRows.filter(function (r) {
      return (!currentPol || r.POL === currentPol) && (!currentPod || r.POD === currentPod);
    });
    if (routeRows.length > 0) carrierRows = routeRows;
  }
  if (fieldKey === 'CAR_NAME') return collectUniqueValues_(carrierRows, function (r) { return r.Ten_hang_tau; });
  if (fieldKey === 'POT') return collectUniqueValues_(carrierRows, function (r) { return getRowPot_(r); });
  if (fieldKey === 'VESSEL') return collectUniqueValues_(carrierRows, function (r) { return r.Ten_tau; });
  if (fieldKey === 'VOYAGE') return collectUniqueValues_(carrierRows, function (r) { return r.So_chuyen; });
  return [];
}

function refreshScheduleDropdownSuggestions_() {
  const serviceRows = getFilteredCuocTauByServiceType_();
  const currentPol = String(APP_STATE.shared.POL || '').trim();
  const currentPod = String(APP_STATE.shared.POD || '').trim();

  const polValues = collectUniqueValues_(serviceRows, function (r) { return r.POL; });

  const podRows = currentPol
    ? serviceRows.filter(function (r) { return r.POL === currentPol; })
    : serviceRows;
  const podValues = collectUniqueValues_(podRows.length > 0 ? podRows : serviceRows, function (r) { return r.POD; });

  let carrierRows = serviceRows;
  if (currentPol || currentPod) {
    const routeRows = serviceRows.filter(function (r) {
      return (!currentPol || r.POL === currentPol) && (!currentPod || r.POD === currentPod);
    });
    if (routeRows.length > 0) {
      carrierRows = routeRows;
    }
  }
  const carrierValues = collectUniqueValues_(carrierRows, function (r) { return r.Ten_hang_tau; });
  const potValues = collectUniqueValues_(carrierRows, function (r) { return getRowPot_(r); });
  const vesselValues = collectUniqueValues_(carrierRows, function (r) { return r.Ten_tau; });
  const voyageValues = collectUniqueValues_(carrierRows, function (r) { return r.So_chuyen; });

  APP_STATE.scheduleOptions = {
    POL: polValues,
    POD: podValues,
    CAR_NAME: carrierValues,
    POT: potValues,
    VESSEL: vesselValues,
    VOYAGE: voyageValues
  };
}

function getAvailableCurrencies20_() {
  const dm = (APP_STATE.dropdowns && APP_STATE.dropdowns.danhMucChung) || {};
  const fromSheet = Array.isArray(dm.CURR) ? dm.CURR.map(function (c) { return String(c || '').trim(); }).filter(Boolean) : [];
  const merged = [];
  const seen = {};
  fromSheet.concat(DEFAULT_CURRENCIES_20).forEach(function (c) {
    const upper = String(c || '').trim().toUpperCase();
    if (upper && !seen[upper]) {
      seen[upper] = true;
      merged.push(upper);
    }
  });
  return merged;
}

function detectCurrencyFromLocation_(rawLocation) {
  const str = String(rawLocation || '').trim();
  if (!str) return '';
  const upper = str.toUpperCase();
  const cleanLoc = upper.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  const rules = [
    { curr: 'KRW', tokens: ['KOREA', 'HAN QUOC', 'BUSAN', 'PUSAN', 'INCHEON', 'GWANGYANG', 'PYEONGTAEK', 'ULSAN', 'SEOUL', 'KRBUS', 'KRICN', 'KRKAN'] },
    { curr: 'JPY', tokens: ['JAPAN', 'NHAT BAN', 'NHAT', 'TOKYO', 'YOKOHAMA', 'OSAKA', 'KOBE', 'NAGOYA', 'HAKATA', 'MOJI', 'JPTYO', 'JPYOK', 'JPOSA', 'JPUKB'] },
    { curr: 'CNY', tokens: ['CHINA', 'TRUNG QUOC', 'SHANGHAI', 'NINGBO', 'SHENZHEN', 'QINGDAO', 'GUANGZHOU', 'XIAMEN', 'TIANJIN', 'DALIAN', 'SHEKOU', 'YANTIAN', 'CNSHA', 'CNNGB', 'CNSZX', 'CNTAO'] },
    { curr: 'EUR', tokens: ['GERMANY', 'DUC', 'FRANCE', 'PHAP', 'NETHERLANDS', 'HA LAN', 'BELGIUM', 'ITALY', 'SPAIN', 'PORTUGAL', 'GREECE', 'EUROPE', 'CHAU AU', 'EU', 'ROTTERDAM', 'HAMBURG', 'ANTWERP', 'BREMEN', 'BREMERHAVEN', 'LE HAVRE', 'GENOA', 'VALENCIA', 'BARCELONA', 'NLRTM', 'DEHAM', 'BEANR'] },
    { curr: 'VND', tokens: ['VIETNAM', 'VIET NAM', 'HAI PHONG', 'CAT LAI', 'CAI MEP', 'DA NANG', 'QUY NHON', 'HO CHI MINH', 'SAIGON', 'SAI GON', 'VNHPH', 'VNSGN', 'VNCMT', 'VNDAD'] },
    { curr: 'GBP', tokens: ['UNITED KINGDOM', 'ENGLAND', 'BRITAIN', 'VUONG QUOC ANH', 'ANH', 'LONDON', 'FELIXSTOWE', 'SOUTHAMPTON', 'LIVERPOOL', 'GBFXT', 'GBLON', 'GBSOU'] },
    { curr: 'SGD', tokens: ['SINGAPORE', 'SGSIN'] },
    { curr: 'AUD', tokens: ['AUSTRALIA', 'UC', 'SYDNEY', 'MELBOURNE', 'BRISBANE', 'FREMANTLE', 'ADELAIDE', 'AUSYD', 'AUMEL', 'AUBNE'] },
    { curr: 'AED', tokens: ['UAE', 'DUBAI', 'JEBEL ALI', 'ABU DHABI', 'SHARJAH', 'AEJEA', 'AEDXB'] },
    { curr: 'THB', tokens: ['THAILAND', 'THAI LAN', 'BANGKOK', 'LAEM CHABANG', 'LAT KRABANG', 'THBKK', 'THLCH'] },
    { curr: 'TWD', tokens: ['TAIWAN', 'DAI LOAN', 'KAOHSIUNG', 'KEELUNG', 'TAICHUNG', 'TAIPEI', 'TWKHH', 'TWKEL'] },
    { curr: 'INR', tokens: ['INDIA', 'AN DO', 'NHAVA SHEVA', 'MUNDRA', 'CHENNAI', 'KOLKATA', 'MUMBAI', 'INNSA', 'INMUN', 'INMAA'] },
    { curr: 'MYR', tokens: ['MALAYSIA', 'PORT KLANG', 'TANJUNG PELEPAS', 'PENANG', 'PASIR GUDANG', 'MYPKG', 'MYTPP'] },
    { curr: 'IDR', tokens: ['INDONESIA', 'JAKARTA', 'TANJUNG PRIOK', 'SURABAYA', 'BELAWAN', 'SEMARANG', 'IDJKT', 'IDSUB'] },
    { curr: 'PHP', tokens: ['PHILIPPINES', 'MANILA', 'CEBU', 'DAVAO', 'SUBIC', 'PHMNL', 'PHCEB'] },
    { curr: 'CAD', tokens: ['CANADA', 'VANCOUVER', 'MONTREAL', 'TORONTO', 'PRINCE RUPERT', 'CAVAN', 'CAMTR'] },
    { curr: 'BRL', tokens: ['BRAZIL', 'SANTOS', 'PARANAGUA', 'RIO DE JANEIRO', 'BRSSZ'] },
    { curr: 'SAR', tokens: ['SAUDI ARABIA', 'A RAP XE UT', 'JEDDAH', 'DAMMAM', 'RIYADH', 'SAJED', 'SADMM'] },
    { curr: 'BDT', tokens: ['BANGLADESH', 'CHITTAGONG', 'CHATTOGRAM', 'DHAKA', 'MONGLA', 'BDCGP'] },
    { curr: 'USD', tokens: ['USA', 'UNITED STATES', 'AMERICA', 'HOA KY', 'MY', 'LOS ANGELES', 'LONG BEACH', 'NEW YORK', 'SAVANNAH', 'HOUSTON', 'SEATTLE', 'OAKLAND', 'USLAX', 'USLGB', 'USNYC'] }
  ];

  for (let i = 0; i < rules.length; i++) {
    const r = rules[i];
    for (let j = 0; j < r.tokens.length; j++) {
      const tok = r.tokens[j];
      if (tok.length <= 2) {
        const padded = ' ' + cleanLoc.replace(/[^A-Z0-9]/g, ' ') + ' ';
        if (padded.indexOf(' ' + tok + ' ') !== -1) {
          return r.curr;
        }
      } else if (cleanLoc.indexOf(tok) !== -1) {
        return r.curr;
      }
    }
  }
  return '';
}

function getSmartCurrencyOptions_() {
  const allCurrencies = getAvailableCurrencies20_();
  const s = APP_STATE.shared || {};
  const candidateLoc = [s.POD, s.DEST_CTRY, s.EXP_CTRY].filter(Boolean).join(' ');
  const detectedLocal = detectCurrencyFromLocation_(candidateLoc);

  const prioritized = [];
  const used = {};

  function pushByCode(targetCode) {
    if (!targetCode) return;
    const match = allCurrencies.find(function (c) {
      return extractShortCodeForExport_(c, 'CURR').toUpperCase() === targetCode;
    });
    const val = match || targetCode;
    const upperKey = extractShortCodeForExport_(val, 'CURR').toUpperCase();
    if (!used[upperKey]) {
      used[upperKey] = true;
      prioritized.push(val);
    }
  }

  if (detectedLocal && detectedLocal !== 'USD') {
    pushByCode(detectedLocal);
  }
  pushByCode('USD');

  allCurrencies.forEach(function (c) {
    const upperKey = extractShortCodeForExport_(c, 'CURR').toUpperCase();
    if (!used[upperKey]) {
      used[upperKey] = true;
      prioritized.push(c);
    }
  });

  return prioritized;
}

function ensureCustomComboMenuEl_() {
  let menu = document.getElementById('customComboMenu');
  if (!menu) {
    menu = document.createElement('div');
    menu.id = 'customComboMenu';
    menu.className = 'combo-dropdown-menu hidden';
    menu.setAttribute('role', 'listbox');
    document.body.appendChild(menu);
  }
  return menu;
}

function positionCustomComboMenu_(inputEl, menu) {
  if (!inputEl || !menu) return;
  const rect = inputEl.getBoundingClientRect();
  const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 800;
  const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 1200;
  const minWidth = Math.max(rect.width, 180);
  const maxWidth = Math.min(420, viewportWidth - 16);
  const width = Math.min(maxWidth, minWidth);

  let left = rect.left;
  if (left + width > viewportWidth - 8) {
    left = Math.max(8, viewportWidth - width - 8);
  }

  const spaceBelow = viewportHeight - rect.bottom - 8;
  const spaceAbove = rect.top - 8;
  const menuHeight = Math.min(260, menu.scrollHeight || 220);

  let top = rect.bottom + 4;
  if (spaceBelow < 160 && spaceAbove > spaceBelow) {
    top = Math.max(8, rect.top - Math.min(260, menuHeight) - 4);
  }

  menu.style.width = Math.round(width) + 'px';
  menu.style.left = Math.round(left) + 'px';
  menu.style.top = Math.round(top) + 'px';
}

function closeCustomComboDropdown_() {
  const menu = document.getElementById('customComboMenu');
  if (menu) {
    menu.classList.add('hidden');
    menu.innerHTML = '';
  }
  if (typeof activeComboInput !== 'undefined') {
    activeComboInput = null;
  }
  if (typeof comboActiveIndex !== 'undefined') {
    comboActiveIndex = -1;
  }
}

function selectCustomComboOption_(value) {
  if (typeof activeComboInput === 'undefined' || !activeComboInput) return;
  const inp = activeComboInput;
  inp.value = value;
  closeCustomComboDropdown_();

  if (inp.hasAttribute('data-sync')) {
    handleWorkspaceFieldChange(inp);
  } else if (inp.hasAttribute('data-table-type')) {
    handleTableCellChange(inp);
  }
}

function updateCustomComboActiveItem_(menu, newIdx) {
  const items = menu ? menu.querySelectorAll('.combo-dropdown-item') : [];
  if (!items || items.length === 0) {
    comboActiveIndex = -1;
    return;
  }
  const bounded = ((newIdx % items.length) + items.length) % items.length;
  comboActiveIndex = bounded;
  items.forEach(function (el, idx) {
    el.classList.toggle('active', idx === bounded);
  });
  if (items[bounded] && typeof items[bounded].scrollIntoView === 'function') {
    items[bounded].scrollIntoView({ block: 'nearest' });
  }
}

function renderCustomComboMenu_(inputEl, filterQuery) {
  if (!inputEl) return;
  const source = inputEl.getAttribute('data-combo') || '';
  if (!source) return;

  const allOptions = typeof getComboboxOptionsForSource === 'function'
    ? getComboboxOptionsForSource(source)
    : [];

  const q = String(filterQuery == null ? '' : filterQuery).trim().toLowerCase();
  const isCurrField = source === 'CURR';
  const filtered = q
    ? allOptions.filter(function (opt) { return String(opt || '').toLowerCase().indexOf(q) !== -1; })
    : allOptions;

  // For CURR, never collapse to empty/single if query was empty or matched current value
  const finalOptions = (isCurrField && !q) ? allOptions : filtered;

  const menu = ensureCustomComboMenuEl_();
  const currentVal = String(inputEl.value || '').trim();
  comboActiveIndex = -1;

  if (!finalOptions || finalOptions.length === 0) {
    menu.innerHTML = '<div class="combo-dropdown-empty">Không có gợi ý khớp — bạn vẫn có thể nhập tự do.</div>';
  } else {
    menu.innerHTML = finalOptions.map(function (opt, idx) {
      const optStr = String(opt == null ? '' : opt);
      const isSelected = currentVal && optStr.toUpperCase() === currentVal.toUpperCase();
      if (isSelected && comboActiveIndex === -1) {
        comboActiveIndex = idx;
      }
      return (
        '<button type="button" class="combo-dropdown-item' + (isSelected ? ' active' : '') + '" role="option" data-combo-val="' + escapeHtml(optStr) + '">' +
          '<span>' + escapeHtml(optStr) + '</span>' +
          (isSelected ? '<span style="font-size:11px; opacity:0.9;">&#10003;</span>' : '') +
        '</button>'
      );
    }).join('');
  }

  menu.classList.remove('hidden');
  positionCustomComboMenu_(inputEl, menu);
}

function openCustomComboDropdown_(inputEl, opts) {
  if (!inputEl || inputEl.disabled || inputEl.readOnly) return;
  const options = opts || {};
  activeComboInput = inputEl;
  const query = options.filterByValue ? String(inputEl.value || '') : '';
  renderCustomComboMenu_(inputEl, query);
}

function bindCustomComboGlobalListeners_() {
  if (typeof comboListenersAttached !== 'undefined' && comboListenersAttached) return;
  if (typeof comboListenersAttached !== 'undefined') {
    comboListenersAttached = true;
  }

  document.addEventListener('focusin', function (e) {
    const inp = e.target && e.target.closest ? e.target.closest('input[data-combo]') : null;
    if (inp) {
      openCustomComboDropdown_(inp, { filterByValue: false });
    }
  });

  document.addEventListener('click', function (e) {
    const inp = e.target && e.target.closest ? e.target.closest('input[data-combo]') : null;
    if (inp) {
      openCustomComboDropdown_(inp, { filterByValue: false });
    }
  });

  document.addEventListener('input', function (e) {
    const inp = e.target && e.target.closest ? e.target.closest('input[data-combo]') : null;
    if (inp) {
      openCustomComboDropdown_(inp, { filterByValue: true });
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      const pModal = document.getElementById('previewModal');
      if (pModal && !pModal.classList.contains('hidden')) {
        closeDocPreviewModal();
        return;
      }
      closeCustomComboDropdown_();
      return;
    }

    if (typeof activeComboInput === 'undefined' || !activeComboInput) return;
    const menu = document.getElementById('customComboMenu');
    if (!menu || menu.classList.contains('hidden')) return;

    const items = menu.querySelectorAll('.combo-dropdown-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      updateCustomComboActiveItem_(menu, comboActiveIndex + 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      updateCustomComboActiveItem_(menu, comboActiveIndex - 1);
    } else if (e.key === 'Enter') {
      if (comboActiveIndex >= 0 && items[comboActiveIndex]) {
        e.preventDefault();
        const chosen = items[comboActiveIndex].getAttribute('data-combo-val') || '';
        selectCustomComboOption_(chosen);
      }
    } else if (e.key === 'Tab') {
      closeCustomComboDropdown_();
    }
  });

  document.addEventListener('mousedown', function (e) {
    const menu = document.getElementById('customComboMenu');
    const itemBtn = e.target && e.target.closest ? e.target.closest('#customComboMenu .combo-dropdown-item') : null;
    if (itemBtn) {
      e.preventDefault();
      const chosen = itemBtn.getAttribute('data-combo-val') || '';
      selectCustomComboOption_(chosen);
      return;
    }

    if (menu && !menu.classList.contains('hidden')) {
      const clickedCombo = e.target && e.target.closest ? e.target.closest('input[data-combo]') : null;
      if (!menu.contains(e.target) && clickedCombo !== activeComboInput) {
        closeCustomComboDropdown_();
      }
    }
  });

  window.addEventListener('scroll', function (e) {
    const menu = document.getElementById('customComboMenu');
    if (!menu || menu.classList.contains('hidden')) return;
    if (e.target === menu || (e.target && menu.contains && menu.contains(e.target))) return;
    if (typeof activeComboInput !== 'undefined' && activeComboInput) {
      positionCustomComboMenu_(activeComboInput, menu);
    }
  }, true);

  window.addEventListener('resize', function () {
    const menu = document.getElementById('customComboMenu');
    if (!menu || menu.classList.contains('hidden')) return;
    if (typeof activeComboInput !== 'undefined' && activeComboInput) {
      positionCustomComboMenu_(activeComboInput, menu);
    }
  });
}

function applyCuocTauRow_(match) {
  if (!match) return;
  if (match.Quoc_Gia) {
    setSharedFieldAndSync('DEST_CTRY', match.Quoc_Gia);
    setSharedFieldAndSync('EXP_CTRY', match.Quoc_Gia);
  }
  const potVal = getRowPot_(match);
  if (potVal) {
    setSharedFieldAndSync('POT', potVal);
  }
  if (match.Ten_hang_tau) setSharedFieldAndSync('CAR_NAME', match.Ten_hang_tau);
  if (match.Ten_tau) setSharedFieldAndSync('VESSEL', match.Ten_tau);
  if (match.So_chuyen) setSharedFieldAndSync('VOYAGE', match.So_chuyen);
  updateVesVoyDerived();
  refreshCurrencyDropdownSuggestions_();
}

function handleServiceTypeChanged(serviceTypeValue) {
  APP_STATE.shared.SERVICE_TYPE = serviceTypeValue == null ? '' : String(serviceTypeValue);
  refreshScheduleDropdownSuggestions_();

  const currentPol = String(APP_STATE.shared.POL || '').trim();
  const currentPod = String(APP_STATE.shared.POD || '').trim();
  const currentCar = String(APP_STATE.shared.CAR_NAME || '').trim();
  if (currentPod) {
    const serviceRows = getFilteredCuocTauByServiceType_(serviceTypeValue);
    const match = serviceRows.find(function (r) {
      return (!currentPol || r.POL === currentPol) &&
        r.POD === currentPod &&
        (!currentCar || r.Ten_hang_tau === currentCar);
    }) || serviceRows.find(function (r) {
      return (!currentPol || r.POL === currentPol) && r.POD === currentPod;
    });
    if (match) {
      applyCuocTauRow_(match);
    }
  }
}

function handlePolChanged(polValue) {
  refreshScheduleDropdownSuggestions_();
  const currentPod = String(APP_STATE.shared.POD || '').trim();
  if (currentPod) {
    handlePodChanged(currentPod);
  }
}

function handlePodChanged(podValue) {
  refreshScheduleDropdownSuggestions_();
  refreshCurrencyDropdownSuggestions_();
  if (!podValue) return;

  const serviceRows = getFilteredCuocTauByServiceType_();
  const allRows = APP_STATE.dropdowns.cuocTau || [];
  const currentPol = String(APP_STATE.shared.POL || '').trim();
  const currentCar = String(APP_STATE.shared.CAR_NAME || '').trim();

  let match = serviceRows.find(function (row) {
    return (!currentPol || row.POL === currentPol) &&
      row.POD === podValue &&
      (!currentCar || row.Ten_hang_tau === currentCar);
  });

  if (!match) {
    match = serviceRows.find(function (row) {
      return (!currentPol || row.POL === currentPol) && row.POD === podValue;
    });
  }

  if (!match) {
    match = serviceRows.find(function (row) { return row.POD === podValue; });
  }

  if (!match) {
    match = allRows.find(function (row) {
      return (!currentPol || row.POL === currentPol) && row.POD === podValue;
    }) || allRows.find(function (row) { return row.POD === podValue; });
  }

  if (match) {
    applyCuocTauRow_(match);
  }
}

function handleCarNameChanged(carValue) {
  if (!carValue) return;
  const serviceRows = getFilteredCuocTauByServiceType_();
  const allRows = APP_STATE.dropdowns.cuocTau || [];
  const currentPol = String(APP_STATE.shared.POL || '').trim();
  const currentPod = String(APP_STATE.shared.POD || '').trim();

  let match = serviceRows.find(function (row) {
    return row.Ten_hang_tau === carValue &&
      (!currentPol || row.POL === currentPol) &&
      (!currentPod || row.POD === currentPod);
  });

  if (!match && !currentPol && !currentPod) {
    const carMatches = serviceRows.filter(function (row) { return row.Ten_hang_tau === carValue; });
    if (carMatches.length === 1) {
      match = carMatches[0];
    }
  }

  if (!match) {
    match = allRows.find(function (row) {
      return row.Ten_hang_tau === carValue &&
        (!currentPol || row.POL === currentPol) &&
        (!currentPod || row.POD === currentPod);
    });
  }

  if (match) {
    applyCuocTauRow_(match);
  }
}

function updateVesVoyDerived() {
  const vessel = String(APP_STATE.shared.VESSEL || '').trim();
  const voyage = String(APP_STATE.shared.VOYAGE || '').trim();
  const vesVoy = vessel && voyage ? (vessel + ' / ' + voyage) : (vessel || voyage || '');

function getFilteredLoaiHinhXnk(direction) {
  const all = APP_STATE.dropdowns.loaiHinhXNK || [];
  const normDir = direction.toLowerCase();

  return all.filter(function (row) {

    if (isExport) {
      return p.indexOf('xuất') !== -1 || p.indexOf('xuat') !== -1 || p === 'xk';
    }
    return p.indexOf('nhập') !== -1 || p.indexOf('nhap') !== -1 || p === 'nk';
  });
}

function handleTableCellChange(target) {
  const tableType = target.getAttribute('data-table-type');
  const rowIdx = parseInt(target.getAttribute('data-row-idx'), 10);
  const colKey = target.getAttribute('data-col-key');
  if (!tableType || isNaN(rowIdx) || !colKey) return;

  const targetArray = tableType === 'containers' ? APP_STATE.containers : APP_STATE.items;
  if (!targetArray[rowIdx]) return;

  let rawVal = target.value;
  if (colKey === 'CONT' || colKey === 'SEAL') {
    rawVal = rawVal.toUpperCase();
    if (target.value !== rawVal) target.value = rawVal;
  } else if (colKey === 'HS') {
    rawVal = formatLiveHsCodeInput_(rawVal, target);
  } else if (target.getAttribute('data-num') === 'true' || NUMERIC_TABLE_COL_MAP[colKey]) {
    rawVal = formatLiveNumericInput_(rawVal, target);
  }

  targetArray[rowIdx][colKey] = rawVal;

  if (tableType === 'items') {
    const item = targetArray[rowIdx];
    if (colKey === 'QTY' || colKey === 'PRICE') {
      const qty = parseNum(item.QTY);
      const price = parseNum(item.PRICE);
      item.AMT = (item.QTY !== '' || item.PRICE !== '') ? formatNumMin2Decimals_(qty * price, 2) : '';
      syncTableCellToDOM('items', rowIdx, 'AMT', item.AMT, null);
      if (APP_STATE.manualFlags) {
        APP_STATE.manualFlags.IM_VAL = false;
      }
      const exRate = parseNum(APP_STATE.shared.EX_RATE);
      if (exRate > 0) {
        item.EX_VAL = item.AMT !== '' ? formatNumMin2Decimals_(parseNum(item.AMT) * exRate, 2) : '';
        syncTableCellToDOM('items', rowIdx, 'EX_VAL', item.EX_VAL, null);
      }
    } else if (colKey === 'EX_VAL' || colKey === 'EX_TAX_RATE' || colKey === 'FEE_VAL' || colKey === 'FEE_RATE') {
      APP_STATE.lastTaxTab = 'To_khai_XK';
    }
  } else if (tableType === 'containers') {
    if (APP_STATE.manualFlags) {
      APP_STATE.manualFlags.TOTAL_CONTAINERS_TEXT = false;
    }
  }

  syncTableCellToDOM(tableType, rowIdx, colKey, rawVal, target);
  recalculateAllTotals(true, tableType === 'containers', { sourceKey: colKey, rowIdx: rowIdx });

  if (tableType === 'containers') {
    validateContainerInputsInDOM();
  }
  updateSidebarLockState_();
}

function syncTableCellToDOM(tableType, rowIdx, colKey, value, sourceElement) {
  const selector = '[data-table-type="' + tableType + '"][data-row-idx="' + rowIdx + '"][data-col-key="' + colKey + '"]';
  document.querySelectorAll(selector).forEach(function (el) {
    if (el === sourceElement) return;
    el.value = value;
  });
}

function isRedChannelInspection_() {
  const raw = String((APP_STATE.shared && APP_STATE.shared.INSPECTION_CODE) || '').trim().toUpperCase();
  if (!raw) return false;
  if (raw.indexOf('3') !== -1 || raw.indexOf('ĐỎ') !== -1) return true;
  const ascii = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return ascii.indexOf('LUONG DO') !== -1 || ascii === 'DO';
}

function getNormalizedContSealEntries_() {
  const fromSheet = (APP_STATE.dropdowns && Array.isArray(APP_STATE.dropdowns.contSealList) && APP_STATE.dropdowns.contSealList.length > 0)
    ? APP_STATE.dropdowns.contSealList
    : null;

  let rawList = [];
  if (fromSheet) {
    rawList = fromSheet;
  } else {
    const dm = (APP_STATE.dropdowns && APP_STATE.dropdowns.danhMucChung) || {};
    const owners = Array.isArray(dm.MA_CHU_SO_HUU_CONT) ? dm.MA_CHU_SO_HUU_CONT : [];
    const seals = Array.isArray(dm.MA_SEAL) ? dm.MA_SEAL : [];
    if (owners.length > 0 || seals.length > 0) {
      const maxLen = Math.max(owners.length, seals.length);
      for (let i = 0; i < maxLen; i++) {
        rawList.push({ owner: owners[i] || '', seal: seals[i] || '' });
      }
    } else {
      rawList = DEFAULT_CONT_SEAL_PAIRS;
    }
  }

  return rawList.map(function (entry) {
    const rawOwner = String(entry && entry.owner ? entry.owner : '').trim();
    const rawSeal = String(entry && entry.seal ? entry.seal : '').trim();
    const combinedUpper = (rawOwner + ' ' + rawSeal).toUpperCase();
    const isCustoms =
      combinedUpper.indexOf('HẢI QUAN') !== -1 ||
      combinedUpper.indexOf('HAI QUAN') !== -1 ||
      combinedUpper.indexOf('CUSTOMS') !== -1 ||
      combinedUpper.indexOf('NIÊM PHONG') !== -1 ||
      combinedUpper.indexOf('LUỒNG ĐỎ') !== -1;

    let label = rawOwner;
    let ownerCodesPart = rawOwner;
    const colonIdx = rawOwner.indexOf(':');
    if (colonIdx !== -1) {
      label = rawOwner.slice(0, colonIdx).trim();
      ownerCodesPart = rawOwner.slice(colonIdx + 1).trim();
    } else if (isCustoms && !label) {
      label = rawSeal;
    }

    const ownerPrefixes = [];
    if (!isCustoms) {
      const tokens = ownerCodesPart.split(/[,;/\s]+/).map(function (t) { return t.trim().toUpperCase(); }).filter(Boolean);
      tokens.forEach(function (t) {
        if (/^[A-Z]{3,4}[UJZR]?$/.test(t) || /^[A-Z]{4}$/.test(t)) {
          if (ownerPrefixes.indexOf(t) === -1) ownerPrefixes.push(t);
        }
      });
    } else {
      const tokens = rawOwner.split(/[:;,/\s]+/).map(function (t) { return t.trim().toUpperCase(); }).filter(Boolean);
      tokens.forEach(function (t) {
        if (/^[A-Z]{4}$/.test(t) && ownerPrefixes.indexOf(t) === -1) {
          ownerPrefixes.push(t);
        }
      });
    }

    let sealDisplay = rawSeal;
    let sealCodesPart = rawSeal;
    const sealColon = rawSeal.indexOf(':');
    if (sealColon !== -1) {
      if (!label) label = rawSeal.slice(0, sealColon).trim();
      sealCodesPart = rawSeal.slice(sealColon + 1).trim();
    }

    const sealPrefixes = [];
    sealCodesPart.split(/[,;/\s]+/).map(function (t) { return t.trim().toUpperCase(); }).filter(Boolean).forEach(function (t) {
      const cleaned = t.replace(/[^A-Z0-9]/g, '');
      if (cleaned.length >= 2 && cleaned.length <= 12 && sealPrefixes.indexOf(cleaned) === -1) {
        sealPrefixes.push(cleaned);
      }
    });

    return {
      rawOwner: rawOwner,
      rawSeal: sealDisplay,
      label: label || rawSeal || rawOwner,
      ownerPrefixes: ownerPrefixes,
      sealPrefixes: sealPrefixes,
      isCustoms: isCustoms
    };
  });
}

function renderContSealLookupRows_() {
  const tbody = document.getElementById('contSealLookupTableBody');
  if (!tbody) return;

  const query = String((document.getElementById('contSealSearchInput') || {}).value || '').trim().toLowerCase();
  const toggleEl = document.getElementById('contSealRedChannelToggle');
  const showCustoms = isRedChannelInspection_() || Boolean(toggleEl && toggleEl.checked);
  const sealLockedForDoc = APP_STATE.lookupTargetDocKey === 'RELEASE_ORDER' || APP_STATE.lookupTargetDocKey === 'SALES_CONTRACT';

  const entries = getNormalizedContSealEntries_().filter(function (item) {
    if (item.isCustoms && !showCustoms) return false;
    if (!query) return true;
    const hay = (item.label + ' ' + item.rawOwner + ' ' + item.rawSeal).toLowerCase();
    return hay.indexOf(query) !== -1;
  });

  if (entries.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-table-note">Không tìm thấy mã phù hợp. Hãy thử từ khóa khác hoặc bật tùy chọn Luồng đỏ để xem mã Seal Hải quan.</td></tr>';
    return;

  tbody.innerHTML = entries.map(function (item, idx) {

        }).join('') + '</div>'
      : '<span style="color:#64748B; font-size:12px;">' + escapeHtml(item.rawOwner || '—') + '</span>';

    const sealHtml = item.sealPrefixes.length > 0
      ? '<div class="lookup-pill-wrap">' + item.sealPrefixes.map(function (s) {
          return '<button type="button" class="lookup-prefix-btn"' + (sealLockedForDoc ? ' disabled title="Số Seal mở khóa tại Packing List"' : (' title="Điền tiền tố Seal ' + escapeHtml(s) + '"')) + ' onclick="applyContSealPrefixSelection_(\'\', \'' + escapeHtml(s) + '\')">' + escapeHtml(s) + '</button>';
        }).join('') + '</div>'
      : '<span style="color:#64748B; font-size:12px;">' + escapeHtml(item.rawSeal || '—') + '</span>';

    const badgeHtml = item.isCustoms ? '<span class="lookup-red-badge">Luồng đỏ / Hải quan</span>' : '';

    return (
      '<tr class="' + (item.isCustoms ? 'lookup-customs-row' : '') + '">' +
        '<td class="table-row-num">' + (idx + 1) + '</td>' +
        '<td><strong>' + escapeHtml(item.label) + '</strong>' + badgeHtml + '</td>' +
        '<td>' + ownerHtml + '</td>' +
        '<td>' + sealHtml + '</td>' +

function applyContSealPrefixSelection_(ownerPrefix, sealPrefix) {
  const rowSelect = document.getElementById('contSealTargetRowSelect');
  const rowIdx = rowSelect ? parseInt(rowSelect.value, 10) : (APP_STATE.lookupTargetRowIdx || 0);
  if (isNaN(rowIdx) || !APP_STATE.containers[rowIdx]) return;

  const targetRow = APP_STATE.containers[rowIdx];
  const sealLocked = APP_STATE.lookupTargetDocKey === 'RELEASE_ORDER' || APP_STATE.lookupTargetDocKey === 'SALES_CONTRACT';
  const appliedParts = [];
  let focusColKey = '';

  if (ownerPrefix) {
    const cleanPrefix = String(ownerPrefix).trim().toUpperCase();
    const existingCont = String(targetRow.CONT || '').trim().toUpperCase();
    const suffixDigits = existingCont.length === 11 && /^[0-9]{7}$/.test(existingCont.slice(4)) ? existingCont.slice(4) : '';
    targetRow.CONT = suffixDigits ? (cleanPrefix.slice(0, 4) + suffixDigits) : cleanPrefix;
    syncTableCellToDOM('containers', rowIdx, 'CONT', targetRow.CONT, null);
    appliedParts.push('Cont: ' + targetRow.CONT);
    focusColKey = 'CONT';
  }

  if (sealPrefix && !sealLocked) {
    const cleanSeal = String(sealPrefix).trim().toUpperCase();
    targetRow.SEAL = cleanSeal;
    syncTableCellToDOM('containers', rowIdx, 'SEAL', targetRow.SEAL, null);
    appliedParts.push('Seal: ' + targetRow.SEAL);
    if (!focusColKey) focusColKey = 'SEAL';
  }

  if (APP_STATE.manualFlags) {
    APP_STATE.manualFlags.TOTAL_CONTAINERS_TEXT = false;
  }
  recalculateAllTotals(true, true, { sourceKey: 'CONTAINER_LOOKUP', rowIdx: rowIdx });
  validateContainerInputsInDOM();
  updateSidebarLockState_();

  if (appliedParts.length > 0) {
    showToast('Đã điền tiền tố (' + appliedParts.join(', ') + ') vào dòng ' + (rowIdx + 1) + '. Hãy nhập đủ số Container / Seal.', 'success');
  }
  closeContSealLookupModal();

  if (focusColKey) {
    const activeDoc = APP_STATE.activeTab || APP_STATE.lookupTargetDocKey || '';
    const targetInput = document.querySelector(
      '[data-tab-panel="' + activeDoc + '"] [data-table-type="containers"][data-row-idx="' + rowIdx + '"][data-col-key="' + focusColKey + '"]'
    );
    if (targetInput && !targetInput.disabled) {
      targetInput.focus();
    }
  }
}

function computeIso6346CheckDigit_(prefix10) {
  if (!prefix10 || prefix10.length !== 10) return -1;
  let sum = 0;
  for (let i = 0; i < 10; i++) {
    const ch = prefix10.charAt(i);
    let val;
    if (ch >= '0' && ch <= '9') {
      val = parseInt(ch, 10);
    } else if (Object.prototype.hasOwnProperty.call(ISO_6346_CHAR_VALUES, ch)) {
      val = ISO_6346_CHAR_VALUES[ch];
    } else {
      return -1;
    }
    sum += val * Math.pow(2, i);
  }
  return (sum % 11) % 10;
}

function isValidIso6346ContainerNumber_(contStr) {
  const clean = String(contStr || '').trim().toUpperCase();
  if (!ISO_6346_REGEX.test(clean)) return false;
  const expected = computeIso6346CheckDigit_(clean.slice(0, 10));
  const actual = parseInt(clean.charAt(10), 10);
  return expected !== -1 && expected === actual;
}

function validateContainerAndSealRows(docKeyOverride) {
  const targetDoc = docKeyOverride !== undefined ? String(docKeyOverride || '') : String(APP_STATE.activeTab || '');
  const containers = Array.isArray(APP_STATE.containers) ? APP_STATE.containers : [];

  if (DOCS_CONT_TABLE_LOCKED[targetDoc]) {
    return { hasErrors: false, rowErrors: [] };
  }

  const requireCont = Boolean(DOCS_CONT_REQUIRED_SEAL_LOCKED[targetDoc] || DOCS_BOTH_CONT_SEAL_REQUIRED[targetDoc]);
  const requireSeal = Boolean(DOCS_BOTH_CONT_SEAL_REQUIRED[targetDoc]);
  const lockSeal = Boolean(DOCS_CONT_REQUIRED_SEAL_LOCKED[targetDoc]);

  const rowErrors = [];
  const contCounts = {};
  const sealCounts = {};
  let hasErrors = false;
  let hasAnyNonEmptyCont = false;

  containers.forEach(function (row) {
    const cont = String(row && row.CONT != null ? row.CONT : '').trim().toUpperCase();
    const seal = String(row && row.SEAL != null ? row.SEAL : '').trim().toUpperCase();
    if (cont) {
      contCounts[cont] = (contCounts[cont] || 0) + 1;
      hasAnyNonEmptyCont = true;
    }
    if (seal) {
      sealCounts[seal] = (sealCounts[seal] || 0) + 1;
    }
  });

  if (requireCont && containers.length === 0) {
    return { hasErrors: true, rowErrors: [] };
  }

  containers.forEach(function (row, idx) {
    const cont = String(row && row.CONT != null ? row.CONT : '').trim().toUpperCase();
    const seal = String(row && row.SEAL != null ? row.SEAL : '').trim().toUpperCase();
    const hasOtherContData = Boolean(
      row && (row.CTYPE || row.CSIZE || row.PACK || row.GW || row.VGM_WEI || row.CBM)
    );
    const err = { CONT: '', SEAL: '' };

    const mustHaveContOnThisRow = requireCont && (idx === 0 || hasOtherContData || cont !== '' || seal !== '' || !hasAnyNonEmptyCont);
    const mustHaveSealOnThisRow = requireSeal && !lockSeal && (idx === 0 || cont !== '' || seal !== '' || hasOtherContData);

    if (cont !== '') {
      if (!isValidIso6346ContainerNumber_(cont)) {
        err.CONT = 'Sai số container (ISO 6346)';
      } else if (contCounts[cont] > 1) {
        err.CONT = 'Trùng số container';
      }
    } else if (mustHaveContOnThisRow || (!lockSeal && seal !== '')) {
      err.CONT = 'Bắt buộc nhập số container hợp lệ';
    }

    if (!lockSeal) {
      if (seal !== '') {
        if (!SEAL_NO_REGEX.test(seal)) {
          err.SEAL = 'Số seal phải gồm 6–12 ký tự (A-Z, 0-9)';
        } else if (sealCounts[seal] > 1) {
          err.SEAL = 'Trùng số seal';
        }
      } else if (mustHaveSealOnThisRow || (requireSeal && cont !== '')) {
        err.SEAL = 'Bắt buộc nhập số seal (6–12 ký tự)';
      }
    }

    if (err.CONT || err.SEAL) {
      hasErrors = true;
    }
    rowErrors[idx] = err;
  });

  return {
    hasErrors: hasErrors,
    rowErrors: rowErrors
  };
}

function validateContainerInputsInDOM() {
  const activeDoc = APP_STATE.activeTab || 'MASTER_PARTIES';
  const activeValidation = validateContainerAndSealRows(activeDoc);
  const perDocCache = {};
  perDocCache[activeDoc] = activeValidation;

  document.querySelectorAll('[data-table-type="containers"]').forEach(function (inp) {
    const colKey = inp.getAttribute('data-col-key');
    if (colKey !== 'CONT' && colKey !== 'SEAL') return;
    const docKey = inp.getAttribute('data-doc-key') || activeDoc;
    if (!perDocCache[docKey]) {
      perDocCache[docKey] = validateContainerAndSealRows(docKey);
    }
    const v = perDocCache[docKey];
    const rowErrors = v.rowErrors || [];
    const idx = parseInt(inp.getAttribute('data-row-idx'), 10);
    const isLocked = inp.disabled || inp.classList.contains('table-input-locked');
    const errMsg = (!isLocked && !isNaN(idx) && rowErrors[idx]) ? (rowErrors[idx][colKey] || '') : '';
    inp.classList.toggle('input-invalid', Boolean(errMsg));

    const cell = inp.parentNode;
    if (cell) {
      let msgEl = cell.querySelector('.cell-error-msg[data-col-key="' + colKey + '"]');
      if (!msgEl) {
        msgEl = document.createElement('div');
        msgEl.className = 'cell-error-msg hidden';
        msgEl.setAttribute('data-err-type', 'containers');
        msgEl.setAttribute('data-row-idx', String(idx));
        msgEl.setAttribute('data-col-key', colKey);
        cell.appendChild(msgEl);
      }
      msgEl.textContent = errMsg;
      msgEl.classList.toggle('hidden', !errMsg);
    }
  });

  const activeLock = activeValidation.hasErrors;
  document.querySelectorAll('button[onclick="handleSaveDraft()"]').forEach(function (btn) {
    btn.disabled = activeLock;
    btn.title = activeLock ? 'Vui lòng nhập đúng Số Container / Số Seal trước khi Lưu nháp' : '';
  });

  document.querySelectorAll('[data-tab-panel]').forEach(function (panel) {
    const panelDocKey = panel.getAttribute('data-tab-panel');
    if (!panelDocKey || panelDocKey === 'MASTER_PARTIES' || isAdminTab_(panelDocKey)) return;
    if (!perDocCache[panelDocKey]) {
      perDocCache[panelDocKey] = validateContainerAndSealRows(panelDocKey);
    }
    const panelLock = perDocCache[panelDocKey].hasErrors;
    panel.querySelectorAll('button[data-action-preview="true"], button[data-action-export="true"]').forEach(function (btn) {
      btn.disabled = panelLock;
      btn.title = panelLock ? 'Vui lòng nhập đúng Số Container / Số Seal cho chứng từ này' : '';
    });
  });

  return activeValidation;
}

function formatLiveNumericInput_(rawVal, inputEl) {
  const original = String(rawVal == null ? '' : rawVal);
  if (!original.trim()) return '';

  const selStart = inputEl && typeof inputEl.selectionStart === 'number' ? inputEl.selectionStart : original.length;
  let significantBeforeCursor = 0;
  let dotSeenBefore = false;
  for (let i = 0; i < selStart && i < original.length; i++) {
    const ch = original.charAt(i);
    if (ch >= '0' && ch <= '9') {
      significantBeforeCursor++;
    } else if (ch === '.' && !dotSeenBefore) {
      significantBeforeCursor++;
      dotSeenBefore = true;
    }
  }

  let cleaned = '';
  let dotSeen = false;
  for (let i = 0; i < original.length; i++) {
    const ch = original.charAt(i);
    if (ch >= '0' && ch <= '9') {
      cleaned += ch;
    } else if (ch === '.' && !dotSeen) {
      cleaned += '.';
      dotSeen = true;
    }
  }

  if (!cleaned) {
    if (inputEl && inputEl.value !== '') inputEl.value = '';
    return '';
  }

  const parts = cleaned.split('.');
  let intPart = parts[0] || '';
  if (intPart.length > 1) {
    intPart = intPart.replace(/^0+(?=\d)/, '');
  }
  if (intPart === '' && dotSeen) {
    intPart = '0';
  }
  const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const formatted = parts.length > 1 ? (intFormatted + '.' + parts[1]) : intFormatted;

  if (inputEl && inputEl.value !== formatted) {
    inputEl.value = formatted;
    if (typeof inputEl.setSelectionRange === 'function') {
      let newPos = 0;
      let count = 0;
      while (newPos < formatted.length && count < significantBeforeCursor) {
        const ch = formatted.charAt(newPos);
        if ((ch >= '0' && ch <= '9') || ch === '.') {
          count++;
        }
        newPos++;
      }
      try {
        inputEl.setSelectionRange(newPos, newPos);
      } catch (e) {}
    }
  }

  return formatted;
}

function formatHsCode_(rawVal) {
  const str = String(rawVal == null ? '' : rawVal).trim();
  if (!str) return '';
  const digits = str.replace(/\D/g, '').slice(0, 10);
  if (!digits) return str;
  if (digits.length <= 4) return digits;
  if (digits.length <= 6) return digits.slice(0, 4) + '.' + digits.slice(4);
  return digits.slice(0, 4) + '.' + digits.slice(4, 6) + '.' + digits.slice(6);
}

function formatLiveHsCodeInput_(rawVal, inputEl) {
  const original = String(rawVal == null ? '' : rawVal);
  if (!original.trim()) {
    if (inputEl && inputEl.value !== '') inputEl.value = '';
    return '';
  }

  const selStart = inputEl && typeof inputEl.selectionStart === 'number' ? inputEl.selectionStart : original.length;
  let digitsBeforeCursor = 0;
  for (let i = 0; i < selStart && i < original.length; i++) {
    const ch = original.charAt(i);
    if (ch >= '0' && ch <= '9') {
      digitsBeforeCursor++;
    }
  }

  const digits = original.replace(/\D/g, '').slice(0, 10);
  const formatted = digits ? formatHsCode_(digits) : '';

  if (inputEl && inputEl.value !== formatted) {
    inputEl.value = formatted;
    if (typeof inputEl.setSelectionRange === 'function') {
      let newPos = 0;
      let count = 0;
      while (newPos < formatted.length && count < digitsBeforeCursor) {
        const ch = formatted.charAt(newPos);
        if (ch >= '0' && ch <= '9') {
          count++;
        }
        newPos++;
      }
      try {
        inputEl.setSelectionRange(newPos, newPos);
      } catch (e) {}
    }
  }

  return formatted;
}

function normalizeFormattedNumberString_(rawVal) {
  const str = String(rawVal == null ? '' : rawVal).trim();
  if (!str) return '';
  const cleaned = str.replace(/[,\s]/g, '');
  if (!/^-?\d+(\.\d+)?$/.test(cleaned)) return str;
  const parts = cleaned.split('.');
  const intFormatted = parts[0].replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1,');
  return parts.length > 1 ? (intFormatted + '.' + parts[1]) : intFormatted;
}

function normalizeNumericFieldsInState_() {
  Object.keys(NUMERIC_SHARED_FIELD_MAP).forEach(function (k) {
    if (APP_STATE.shared[k] != null && String(APP_STATE.shared[k]).trim() !== '') {
      APP_STATE.shared[k] = normalizeFormattedNumberString_(APP_STATE.shared[k]);
    }
  });
  (APP_STATE.items || []).forEach(function (row) {
    if (row.HS != null && String(row.HS).trim() !== '') {
      row.HS = formatHsCode_(row.HS);
    }
    Object.keys(NUMERIC_TABLE_COL_MAP).forEach(function (col) {
      if (row[col] != null && String(row[col]).trim() !== '') {
        row[col] = normalizeFormattedNumberString_(row[col]);

    });
  });
  (APP_STATE.containers || []).forEach(function (row) {
    Object.keys(NUMERIC_TABLE_COL_MAP).forEach(function (col) {

  });
}

function parseNum(val) {
  if (val == null || val === '') return 0;
  const cleaned = String(val).replace(/[%,\s]/g, '').trim();
  const num = Number(cleaned);
  return isNaN(num) ? 0 : num;
}

function formatNum(num, maxDecimals) {
  if (num == null || isNaN(num)) return '';
  const factor = Math.pow(10, maxDecimals || 2);
  const rounded = Math.round((num + Number.EPSILON) * factor) / factor;
  if (rounded === 0) return '0';
  const parts = String(rounded).split('.');
  const intFormatted = parts[0].replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1,');
  if (parts.length > 1) {
    return intFormatted + '.' + parts[1];
  }
  return intFormatted;
}

function formatNumMin2Decimals_(num, maxDecimals) {
  if (num == null || isNaN(num)) return '';
  const factor = Math.pow(10, maxDecimals || 3);
  const rounded = Math.round((num + Number.EPSILON) * factor) / factor;
  const parts = String(rounded).split('.');
  const intFormatted = parts[0].replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1,');
  const dec = parts.length > 1 ? parts[1] : '';
  const paddedDec = dec.length >= 2 ? dec : (dec + '00').slice(0, 2);
  return intFormatted + '.' + paddedDec;
}

const EN_ONES_ = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE',
  'TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];
const EN_TENS_ = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];
const EN_SCALES_ = ['', 'THOUSAND', 'MILLION', 'BILLION', 'TRILLION'];

function numberToEnglishIntWords_(num) {
  let n = Math.floor(Math.abs(Number(num) || 0));
  if (n === 0) return 'ZERO';

  const parts = [];
  let scaleIdx = 0;

  while (n > 0) {
    const chunk = n % 1000;
    if (chunk > 0) {
      const chunkWords = [];
      const hundreds = Math.floor(chunk / 100);
      const rem = chunk % 100;
      if (hundreds > 0) {
        chunkWords.push(EN_ONES_[hundreds] + ' HUNDRED');
      }
      if (rem > 0) {
        if (rem < 20) {
          chunkWords.push(EN_ONES_[rem]);
        } else {
          const tens = Math.floor(rem / 10);
          const ones = rem % 10;
          chunkWords.push(ones > 0 ? (EN_TENS_[tens] + '-' + EN_ONES_[ones]) : EN_TENS_[tens]);
        }
      }
      if (EN_SCALES_[scaleIdx]) {
        chunkWords.push(EN_SCALES_[scaleIdx]);
      }
      parts.unshift(chunkWords.join(' '));
    }
    n = Math.floor(n / 1000);
    scaleIdx++;
  }

  return parts.join(' ');
}

    SAR: { plural: 'SAUDI RIYALS', singular: 'SAUDI RIYAL', subPlural: 'HALALAS', subSingular: 'HALALA', hasCents: true },
    THB: { plural: 'THAI BAHT', singular: 'THAI BAHT', subPlural: 'SATANG', subSingular: 'SATANG', hasCents: true }

  if (!meta.hasCents) {
    const intOnly = Math.round(num);
    const label = intOnly === 1 ? meta.singular : meta.plural;
    return label + ' ' + numberToEnglishIntWords_(intOnly) + ' ONLY';
  }

  const totalCents = Math.round(num * 100);
  const intPart = Math.floor(totalCents / 100);
  const fracPart = totalCents % 100;

  const intWords = numberToEnglishIntWords_(intPart);

  if (fracPart > 0) {
    const subLabel = fracPart === 1 ? meta.subSingular : meta.subPlural;
    const fracWords = numberToEnglishIntWords_(fracPart);
    return mainLabel + ' ' + intWords + ' AND ' + fracWords + ' ' + subLabel + ' ONLY';
  }

  return mainLabel + ' ' + intWords + ' ONLY';
}

const VI_DIGITS_ = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];

function readVietnameseTriplet_(num, fullHundred) {
  const hundreds = Math.floor(num / 100);
  const tens = Math.floor((num % 100) / 10);
  const ones = num % 10;
  const parts = [];

  if (hundreds > 0 || fullHundred) {
    parts.push(VI_DIGITS_[hundreds] + ' trăm');
    if (tens === 0 && ones > 0) {
      parts.push('lẻ');
    }
  }

  if (tens > 1) {
    parts.push(VI_DIGITS_[tens] + ' mươi');
    if (ones === 1) {
      parts.push('mốt');
    } else if (ones === 4) {
      parts.push('tư');
    } else if (ones === 5) {
      parts.push('lăm');
    } else if (ones > 0) {
      parts.push(VI_DIGITS_[ones]);
    }
  } else if (tens === 1) {
    parts.push('mười');
    if (ones === 5) {
      parts.push('lăm');
    } else if (ones > 0) {
      parts.push(VI_DIGITS_[ones]);
    }
  } else if (ones > 0) {
    parts.push(VI_DIGITS_[ones]);
  }

  return parts.join(' ');
}

function numberToVietnameseWords(amount, unitSuffix) {
  const num = Math.round(Number(amount) || 0);
  if (isNaN(num) || num <= 0) return '';

  const scales = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'];
  const groups = [];
  let temp = num;
  while (temp > 0) {
    groups.push(temp % 1000);
    temp = Math.floor(temp / 1000);
  }

  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    const grp = groups[i];
    if (grp === 0) continue;
    const isMostSignificant = i === groups.length - 1;
    const text = readVietnameseTriplet_(grp, !isMostSignificant);
    if (text) {
      parts.push(scales[i] ? (text + ' ' + scales[i]) : text);
    }
  }

  const joined = parts.join(' ').replace(/\s+/g, ' ').trim();
  if (!joined) return '';
  const capitalized = joined.charAt(0).toUpperCase() + joined.slice(1);
  return unitSuffix ? (capitalized + ' ' + unitSuffix) : capitalized;
}
