function applyBrandLogoDataUrl(logoUrl) {
  if (!logoUrl || typeof logoUrl !== 'string') return;
  APP_STATE.logoDataUrl = logoUrl;
  document.querySelectorAll('.brand-logo-img, #loginBrandLogo, #headerBrandLogo').forEach(function (img) {
    if (img.getAttribute('src') !== logoUrl) {
      img.setAttribute('src', logoUrl);
    }
  });
  const favicon = document.getElementById('appFavicon');
  if (favicon && logoUrl.indexOf('data:image/') === 0) {
    favicon.setAttribute('href', logoUrl);
  }
}

function loadBrandLogoOnStart() {
  if (APP_STATE.logoDataUrl && APP_STATE.logoDataUrl.indexOf('data:image/') === 0) {
    applyBrandLogoDataUrl(APP_STATE.logoDataUrl);
    return;
  }
  if (window.google && google.script && google.script.run && typeof google.script.run.getBrandLogoBase64 === 'function') {
    google.script.run
      .withSuccessHandler(function (dataUri) {
        if (dataUri) applyBrandLogoDataUrl(dataUri);
      })
      .withFailureHandler(function () {})
      .getBrandLogoBase64();
  }
}

function showLoading(message) {
  const overlay = document.getElementById('loadingOverlay');
  const textEl = document.getElementById('loadingMessage');
  if (textEl) textEl.textContent = message || 'Loading...';
  if (overlay) overlay.classList.remove('hidden');
}

function hideLoading() {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.classList.add('hidden');
}

function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'info');
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(function () {
    if (toast.parentNode) {
      toast.parentNode.removeChild(toast);
    }
  }, 4200);
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function setSidebarGroupExpanded(groupId, expanded) {
  if (!groupId) return;
  const groupEl = document.querySelector('.sidebar-group[data-group-id="' + groupId + '"]');
  if (!groupEl) return;

  groupEl.classList.toggle('collapsed', !expanded);
  const toggleBtn = groupEl.querySelector('.sidebar-group-toggle');
  if (toggleBtn) {
    toggleBtn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    const chevron = toggleBtn.querySelector('.sidebar-chevron');
    if (chevron) {
      chevron.textContent = expanded ? '\u25BC' : '\u25B6';
    }
  }
}

function toggleSidebarGroup(groupId) {
  const groupEl = document.querySelector('.sidebar-group[data-group-id="' + groupId + '"]');
  if (!groupEl) return;
  const isCollapsed = groupEl.classList.contains('collapsed');

function switchTab(tabKey) {
  APP_STATE.activeTab = tabKey;

  if (tabKey === 'To_khai_XK' || tabKey === 'To_khai_NK') {
    APP_STATE.lastTaxTab = tabKey;
  }

  document.querySelectorAll('.sidebar-nav-btn[data-nav]').forEach(function (btn) {
    const isActive = btn.getAttribute('data-nav') === tabKey;
    btn.classList.toggle('active', isActive);
    if (isActive) {
      const parentGroup = btn.closest('.sidebar-group[data-group-id]');
      if (parentGroup) {
        setSidebarGroupExpanded(parentGroup.getAttribute('data-group-id'), true);
      }
    }
  });

  document.querySelectorAll('.doc-panel[data-tab-panel]').forEach(function (panel) {
    panel.classList.toggle('active', panel.getAttribute('data-tab-panel') === tabKey);
  });

  const sidebar = document.getElementById('appSidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
  }

  recalculateAllTotals(true, false, { sourceKey: 'TAB_SWITCH' });

  if (tabKey === 'ADMIN_ACCOUNTS' && APP_STATE.user && APP_STATE.user.role === 'ADMIN') {
    loadAdminAccountsTables();

}

function handleLoginSubmit(event) {
  event.preventDefault();

  const username = document.getElementById('loginMaSV').value.trim();
  const password = document.getElementById('loginMatKhau').value.trim();
  const errorBox = document.getElementById('loginError');

  errorBox.classList.add('hidden');
  errorBox.textContent = '';

  if (!username || !password) {
    errorBox.textContent = 'Vui lòng nhập đầy đủ Tên đăng nhập và Mật khẩu.';
    errorBox.classList.remove('hidden');
    return;
  }

  showLoading('Loading...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        hideLoading();
        errorBox.textContent = (res && res.message) || 'Đăng nhập thất bại.';
        errorBox.classList.remove('hidden');
        return;
      }

      APP_STATE.user = res.user;
      APP_STATE.exportResults = {};
      restoreDraftState(res.draftJson != null ? res.draftJson : res.draft);

      const badgeText = document.getElementById('userBadgeText');
      if (badgeText) {
        const displayName = String(res.user.tenSV || '').trim();
        const displayId = String(res.user.maSV || '').trim();
        const roleLabel = res.user.role === 'ADMIN' ? ' [ADMIN]' : '';
        badgeText.textContent = (displayName && displayId
          ? displayName + ' (' + displayId + ')'
          : (displayName || displayId || 'Sinh viên')) + roleLabel;
      }

      const adminGroup = document.getElementById('adminSidebarGroup');
      if (adminGroup) {
        if (res.user.role === 'ADMIN') {
          adminGroup.classList.remove('hidden');
        } else {
          adminGroup.classList.add('hidden');
        }
      }

      loadInitialDropdowns();
    })
    .withFailureHandler(function (err) {
      hideLoading();
      errorBox.textContent = 'Lỗi kết nối máy chủ: ' + (err && err.message ? err.message : err);
      errorBox.classList.remove('hidden');
    })
    .loginUser(username, password);
}

                  '<td class="table-row-num">' + (idx + 1) + '</td>' +
                  '<td><strong>' + escapeHtml(acc.maSV) + '</strong></td>' +
                  '<td>' + escapeHtml(acc.tenSV) + '</td>' +

                '</tr>'
              );
            }).join('');
      }

      if (legacyTbody) {
        legacyTbody.innerHTML = accounts.length === 0
          ? '<tr><td colspan="5" class="empty-table-note">Chưa có tài khoản nào trong hệ thống.</td></tr>'
          : accounts.map(function (acc, idx) {
              return (

function handleExcelFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (typeof XLSX === 'undefined') {
    showToast('Thư viện đọc file Excel (SheetJS) chưa được tải.', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

      if (jsonRows.length < 2) {
        showToast('File Excel không có dữ liệu hợp lệ.', 'warning');
        return;
      }

      const headers = jsonRows[0].map(function (h) { return String(h || '').trim().toLowerCase(); });
      let maIdx = headers.indexOf('ma_sv');
      let tenIdx = headers.indexOf('ten_sv');
      let roleIdx = headers.indexOf('vai_tro');

      if (maIdx === -1) maIdx = headers.indexOf('masv') !== -1 ? headers.indexOf('masv') : 0;
      if (tenIdx === -1) tenIdx = headers.indexOf('tensv') !== -1 ? headers.indexOf('tensv') : 1;
      if (roleIdx === -1) roleIdx = headers.indexOf('vaitro') !== -1 ? headers.indexOf('vaitro') : 2;

      const accountsArray = [];
      for (let r = 1; r < jsonRows.length; r++) {
        const row = jsonRows[r];
        if (!row || row.length === 0) continue;
        const maSV = String(row[maIdx] != null ? row[maIdx] : '').trim();
        const tenSV = String(row[tenIdx] != null ? row[tenIdx] : '').trim();
        const vaiTro = String(roleIdx < row.length && row[roleIdx] != null ? row[roleIdx] : 'SV').trim();
        if (maSV && tenSV) {
          accountsArray.push({ maSV: maSV, tenSV: tenSV, vaiTro: vaiTro });
        }
      }

      if (accountsArray.length === 0) {
        showToast('Không tìm thấy dòng tài khoản hợp lệ trong file Excel.', 'warning');
        return;
      }

      showLoading('Loading...');
      google.script.run
        .withSuccessHandler(function (res) {
          hideLoading();
          if (!res || !res.success) {
            showToast((res && res.message) || 'Nạp hàng loạt thất bại.', 'error');
            return;
          }
          showToast('Đã nạp thành công ' + (res.addedCount || accountsArray.length) + ' tài khoản từ file Excel!', 'success');
          loadAdminAccountsTable();
          event.target.value = '';
        })
        .withFailureHandler(function (err) {
          hideLoading();
          showToast('Lỗi nạp file Excel: ' + (err && err.message ? err.message : err), 'error');
        })
        .adminBulkAddAccounts(APP_STATE.user.maSV, accountsArray);
    } catch (parseErr) {
      showToast('Lỗi đọc file Excel: ' + parseErr.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function getTodayYYMMDD_() {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return yy + mm + dd;
}

  const defaults = {

    CTR_NO: 'SC-' + yymmdd + '-01',
    INV_NO: 'INV-' + yymmdd + '-01',

    VET_CERT_NO: 'VET-' + yymmdd + '-01',

    QUAL_CERT_NO: 'QUAL-' + yymmdd + '-01',
    FUM_CERT_NO: 'FUM-' + yymmdd + '-01',
    CO_REF_NO: 'CO-' + yymmdd + '-01',
    BK_NO: 'BK-' + yymmdd + '-01',
    RO_NO: 'RO-' + yymmdd + '-01',
    BL_NO: 'BL-' + yymmdd + '-01',
    DOCUMENT_NO: 'DOC-' + yymmdd + '-01',
    DO_NO: 'DO-' + yymmdd + '-01',
    DEC_NO: 'DEC-' + yymmdd + '-01',
    LC_NO: 'LC-' + yymmdd + '-01'

      APP_STATE.shared[k] = defaults[k];

}

function normalizeCheckboxSymbol(val) {
  if (val === true) return '\u2611';
  if (val === false || val == null) return '\u2610';
  const str = String(val).trim();
  if (!str || str === '\u2610') return '\u2610';
  const lower = str.toLowerCase();
  if (str === '\u2611' || lower === 'true' || lower === '1' || lower === 'x' || lower === 'yes' || lower === 'on') {
    return '\u2611';
  }
  return '\u2610';
}

let currentPreviewBlobUrl = null;
let pdfJsLoadPromise_ = null;

function revokePreviewBlobUrl_() {
  if (currentPreviewBlobUrl) {
    try {
      URL.revokeObjectURL(currentPreviewBlobUrl);
    } catch (e) {}
    currentPreviewBlobUrl = null;
  }
}

function base64ToUint8Array_(base64Str) {
  const binary = atob(base64Str);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

function base64ToBlobUrl_(base64Str, mimeType) {
  const bytes = base64ToUint8Array_(base64Str);
  const blob = new Blob([bytes], { type: mimeType || 'application/pdf' });
  return URL.createObjectURL(blob);
}

function loadScriptOnce_(url) {
  return new Promise(function (resolve, reject) {
    const existing = document.querySelector('script[data-pdfjs-src="' + url + '"]');
    if (existing) {
      resolve();
      return;
    }
    const script = document.createElement('script');
    script.src = url;
    script.async = true;
    script.setAttribute('data-pdfjs-src', url);
    script.onload = function () { resolve(); };
    script.onerror = function () { reject(new Error('Failed to load ' + url)); };
    document.head.appendChild(script);
  });
}

function ensurePdfJsLoaded_() {
  if (window.pdfjsLib && typeof window.pdfjsLib.getDocument === 'function') {
    return Promise.resolve(window.pdfjsLib);
  }
  if (pdfJsLoadPromise_) {
    return pdfJsLoadPromise_;
  }

  const cdnPairs = [
    {
      worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
      lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'
    },
    {
      worker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
      lib: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'
    }
  ];

  function tryPair(idx) {
    if (idx >= cdnPairs.length) {
      return Promise.reject(new Error('Không thể tải thư viện hiển thị PDF (PDF.js).'));
    }
    const pair = cdnPairs[idx];
    return loadScriptOnce_(pair.worker)
      .catch(function () { return null; })
      .then(function () { return loadScriptOnce_(pair.lib); })
      .then(function () {
        if (window.pdfjsLib && typeof window.pdfjsLib.getDocument === 'function') {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = pair.worker;
          return window.pdfjsLib;
        }
        return tryPair(idx + 1);
      })
      .catch(function () {
        return tryPair(idx + 1);
      });
  }

  pdfJsLoadPromise_ = tryPair(0).catch(function (err) {
    pdfJsLoadPromise_ = null;
    throw err;
  });
  return pdfJsLoadPromise_;
}

async function renderPdfBase64ToCanvases_(base64Str, containerEl) {
  const pdfjsLib = await ensurePdfJsLoaded_();
  const pdfBytes = base64ToUint8Array_(base64Str);
  const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
  const pdfDoc = await loadingTask.promise;

  containerEl.innerHTML = '';

  const parentWidth = containerEl.parentNode && containerEl.parentNode.clientWidth ? containerEl.parentNode.clientWidth : 900;
  const availableWidth = Math.max(360, parentWidth - 64);
  const outputScale = Math.min(window.devicePixelRatio || 1, 2);
  const fragment = document.createDocumentFragment();

  for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
    const page = await pdfDoc.getPage(pageNum);
    const baseViewport = page.getViewport({ scale: 1 });
    const cssScale = Math.min(1.65, Math.max(0.85, availableWidth / baseViewport.width));
    const viewport = page.getViewport({ scale: cssScale });

    const card = document.createElement('div');
    card.className = 'preview-page-card';

    const label = document.createElement('div');
    label.className = 'preview-page-label';
    label.textContent = 'Trang ' + pageNum + ' / ' + pdfDoc.numPages;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = Math.floor(viewport.width) + 'px';
    canvas.style.height = Math.floor(viewport.height) + 'px';

    card.appendChild(label);
    card.appendChild(canvas);
    fragment.appendChild(card);

    const renderContext = {
      canvasContext: ctx,
      transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
      viewport: viewport
    };
    await page.render(renderContext).promise;
  }

  containerEl.appendChild(fragment);
  containerEl.classList.remove('hidden');
  return pdfDoc.numPages;
}

function extractShortCodeForExport_(rawVal, fieldKey) {
  const str = String(rawVal == null ? '' : rawVal).trim();
  if (!str) return '';

  let depth = 0;
  let cutIdx = -1;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charAt(i);
    if (ch === '(') {
      depth++;
    } else if (ch === ')' && depth > 0) {
      depth--;
    } else if (depth === 0) {
      if (ch === ':') {
        cutIdx = i;
        break;
      }
      if ((ch === '-' || ch === '\u2013' || ch === '\u2014') &&
          i > 0 && str.charAt(i - 1) === ' ' &&
          i + 1 < str.length && str.charAt(i + 1) === ' ') {
        cutIdx = i - 1;
        break;
      }
    }
  }

  let code = (cutIdx !== -1 ? str.slice(0, cutIdx) : str).trim();

  if (fieldKey === 'INS_TERM') {
    const m = code.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (m && m[1].trim() && m[2].trim().length > 3) {
      code = m[1].trim();
    }
    return code;
  }

  let prev;
  do {
    prev = code;
    code = code.replace(/\s*\([^)]*\)\s*$/, '').trim();
  } while (code !== prev && code.length > 0);

  return code;
}

function buildExportPayload(targetDocKey) {
  recalculateAllTotals(false, false, { targetDocKey: targetDocKey || '' });
  normalizeCheckboxFieldsInState();

  const sharedClone = {};
  Object.keys(APP_STATE.shared || {}).forEach(function (k) {
    sharedClone[k] = APP_STATE.shared[k];
  });

  ['INS_TERM', 'CO_FORM_NAME', 'CTYPE', 'UNIT', 'TOT_UNIT'].forEach(function (k) {
    if (sharedClone[k] != null && String(sharedClone[k]).trim() !== '') {
      sharedClone[k] = extractShortCodeForExport_(sharedClone[k], k);
    }
  });

  const itemsClone = (APP_STATE.items || []).map(function (row) {
    const copy = Object.assign({}, row);
    ['PREF', 'UNIT', 'UNIT_PACK', 'CTYPE'].forEach(function (col) {
      if (copy[col] != null && String(copy[col]).trim() !== '') {
        copy[col] = extractShortCodeForExport_(copy[col], col);
      }
    });
    return copy;
  });

  const containersClone = (APP_STATE.containers || []).map(function (row) {
    const copy = Object.assign({}, row);
    ['CTYPE', 'CSIZE', 'UNIT_PACK'].forEach(function (col) {
      if (copy[col] != null && String(copy[col]).trim() !== '') {
        copy[col] = extractShortCodeForExport_(copy[col], col);
      }
    });
    return copy;
  });

  return {
    shared: sharedClone,
    items: itemsClone,
    containers: containersClone
  };
}

function matchesServiceType_(row, serviceType, anyRowHasType) {

function collectUniqueValues_(rows, getter) {
  const list = [];
  const seen = {};
  (rows || []).forEach(function (row) {
    const val = String(getter(row) || '').trim();
    if (val && !seen[val]) {
      seen[val] = true;
      list.push(val);
    }
  });
  return list;
}

function ensureDatalistForField_(fieldKey, values) {
  let datalistId = 'dl_' + fieldKey;
  const inputs = document.querySelectorAll('input[data-sync="' + fieldKey + '"]');
  inputs.forEach(function (inp) {
    const existingList = inp.getAttribute('list');
    if (existingList) {
      datalistId = existingList;
    } else {
      inp.setAttribute('list', datalistId);
    }
  });

  let dl = document.getElementById(datalistId);
  if (!dl && inputs.length > 0) {
    dl = document.createElement('datalist');
    dl.id = datalistId;
    document.body.appendChild(dl);
  }
  if (dl) {
    dl.innerHTML = (values || [])
      .map(function (v) { return '<option value="' + escapeHtml(v) + '"></option>'; })
      .join('');
  }
}

function refreshScheduleDropdownSuggestions_() {
  const serviceRows = getFilteredCuocTauByServiceType_();
  const currentPol = String(APP_STATE.shared.POL || '').trim();
  const currentPod = String(APP_STATE.shared.POD || '').trim();

  const polValues = collectUniqueValues_(serviceRows, function (r) { return r.POL; });
  ensureDatalistForField_('POL', polValues);

  const podRows = currentPol
    ? serviceRows.filter(function (r) { return r.POL === currentPol; })
    : serviceRows;
  const podValues = collectUniqueValues_(podRows.length > 0 ? podRows : serviceRows, function (r) { return r.POD; });
  ensureDatalistForField_('POD', podValues);

  let carrierRows = serviceRows;
  if (currentPol || currentPod) {
    const routeRows = serviceRows.filter(function (r) {
      return (!currentPol || r.POL === currentPol) && (!currentPod || r.POD === currentPod);
    });
    if (routeRows.length > 0) {
      carrierRows = routeRows;
    }
  }
  const carrierValues = collectUniqueValues_(carrierRows, function (r) { return r.Ten_hang_tau; });
  ensureDatalistForField_('CAR_NAME', carrierValues);

  const potValues = collectUniqueValues_(carrierRows, function (r) { return getRowPot_(r); });
  ensureDatalistForField_('POT', potValues);

  const vesselValues = collectUniqueValues_(carrierRows, function (r) { return r.Ten_tau; });
  ensureDatalistForField_('VESSEL', vesselValues);

  const voyageValues = collectUniqueValues_(carrierRows, function (r) { return r.So_chuyen; });
  ensureDatalistForField_('VOYAGE', voyageValues);
}

function handlePodChanged(podValue) {

  const currentPol = String(APP_STATE.shared.POL || '').trim();

    return (!currentPol || row.POL === currentPol) &&
      row.POD === podValue &&
      (!currentCar || row.Ten_hang_tau === currentCar);

    match = serviceRows.find(function (row) { return row.POD === podValue; });

      return (!currentPol || row.POL === currentPol) && row.POD === podValue;

function parseNum(val) {
  if (val == null || val === '') return 0;
  const cleaned = String(val).replace(/[%,\s]/g, '').trim();
  const num = Number(cleaned);
  return isNaN(num) ? 0 : num;
}

function formatNum(num, maxDecimals) {
  if (num == null || isNaN(num)) return '';
  const factor = Math.pow(10, maxDecimals || 2);
  const rounded = Math.round((num + Number.EPSILON) * factor) / factor;
  if (rounded === 0) return '0';
  return String(rounded);
}

/* ==========================================================================
   NUMBER-TO-WORDS HELPERS (ENGLISH COMMERCIAL, VIETNAMESE & CONTAINERS)
   ========================================================================== */

const EN_ONES_ = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE',
  'TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];
const EN_TENS_ = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];
const EN_SCALES_ = ['', 'THOUSAND', 'MILLION', 'BILLION', 'TRILLION'];

function numberToEnglishIntWords_(num) {
  let n = Math.floor(Math.abs(Number(num) || 0));
  if (n === 0) return 'ZERO';

  const parts = [];
  let scaleIdx = 0;

  while (n > 0) {
    const chunk = n % 1000;
    if (chunk > 0) {
      const chunkWords = [];
      const hundreds = Math.floor(chunk / 100);
      const rem = chunk % 100;
      if (hundreds > 0) {
        chunkWords.push(EN_ONES_[hundreds] + ' HUNDRED');
      }
      if (rem > 0) {
        if (rem < 20) {
          chunkWords.push(EN_ONES_[rem]);
        } else {
          const tens = Math.floor(rem / 10);
          const ones = rem % 10;
          chunkWords.push(ones > 0 ? (EN_TENS_[tens] + '-' + EN_ONES_[ones]) : EN_TENS_[tens]);
        }
      }
      if (EN_SCALES_[scaleIdx]) {
        chunkWords.push(EN_SCALES_[scaleIdx]);
      }
      parts.unshift(chunkWords.join(' '));
    }
    n = Math.floor(n / 1000);
    scaleIdx++;
  }

  return parts.join(' ');
}

function numberToEnglishCurrencyWords(amount, currencyCode) {
  const num = Number(amount);
  if (isNaN(num) || num <= 0) return '';

  const code = String(currencyCode || 'USD').trim().toUpperCase() || 'USD';
  if (code === 'VND') {
    return numberToVietnameseWords(num, 'đồng');
  }

  const currencyMap = {
    USD: { plural: 'US DOLLARS', singular: 'US DOLLAR', subPlural: 'CENTS', subSingular: 'CENT', hasCents: true },
    EUR: { plural: 'EUROS', singular: 'EURO', subPlural: 'CENTS', subSingular: 'CENT', hasCents: true },
    GBP: { plural: 'BRITISH POUNDS', singular: 'BRITISH POUND', subPlural: 'PENCE', subSingular: 'PENNY', hasCents: true },
    JPY: { plural: 'JAPANESE YEN', singular: 'JAPANESE YEN', subPlural: '', subSingular: '', hasCents: false },
    KRW: { plural: 'SOUTH KOREAN WON', singular: 'SOUTH KOREAN WON', subPlural: '', subSingular: '', hasCents: false },
    CNY: { plural: 'CHINESE YUAN', singular: 'CHINESE YUAN', subPlural: 'FEN', subSingular: 'FEN', hasCents: true },
    RMB: { plural: 'CHINESE YUAN', singular: 'CHINESE YUAN', subPlural: 'FEN', subSingular: 'FEN', hasCents: true },
    AUD: { plural: 'AUSTRALIAN DOLLARS', singular: 'AUSTRALIAN DOLLAR', subPlural: 'CENTS', subSingular: 'CENT', hasCents: true },
    SGD: { plural: 'SINGAPORE DOLLARS', singular: 'SINGAPORE DOLLAR', subPlural: 'CENTS', subSingular: 'CENT', hasCents: true },
    THB: { plural: 'THAI BAHT', singular: 'THAI BAHT', subPlural: 'SATANG', subSingular: 'SATANG', hasCents: true }
  };

  const meta = currencyMap[code] || {
    plural: code,
    singular: code,
    subPlural: 'CENTS',
    subSingular: 'CENT',
    hasCents: true
  };

  if (!meta.hasCents) {
    const intOnly = Math.round(num);
    const label = intOnly === 1 ? meta.singular : meta.plural;
    return 'SAY: ' + label + ' ' + numberToEnglishIntWords_(intOnly) + ' ONLY';
  }

  const totalCents = Math.round(num * 100);
  const intPart = Math.floor(totalCents / 100);
  const fracPart = totalCents % 100;
  const mainLabel = intPart === 1 ? meta.singular : meta.plural;
  const intWords = numberToEnglishIntWords_(intPart);

  if (fracPart > 0) {
    const subLabel = fracPart === 1 ? meta.subSingular : meta.subPlural;
    const fracWords = numberToEnglishIntWords_(fracPart);
    return 'SAY: ' + mainLabel + ' ' + intWords + ' AND ' + fracWords + ' ' + subLabel + ' ONLY';
  }

  return 'SAY: ' + mainLabel + ' ' + intWords + ' ONLY';
}

const VI_DIGITS_ = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];

function readVietnameseTriplet_(num, fullHundred) {
  const hundreds = Math.floor(num / 100);
  const tens = Math.floor((num % 100) / 10);
  const ones = num % 10;
  const parts = [];

  if (hundreds > 0 || fullHundred) {
    parts.push(VI_DIGITS_[hundreds] + ' trăm');
    if (tens === 0 && ones > 0) {
      parts.push('lẻ');
    }
  }

  if (tens > 1) {
    parts.push(VI_DIGITS_[tens] + ' mươi');
    if (ones === 1) {
      parts.push('mốt');
    } else if (ones === 4) {
      parts.push('tư');
    } else if (ones === 5) {
      parts.push('lăm');
    } else if (ones > 0) {
      parts.push(VI_DIGITS_[ones]);
    }
  } else if (tens === 1) {
    parts.push('mười');
    if (ones === 5) {
      parts.push('lăm');
    } else if (ones > 0) {
      parts.push(VI_DIGITS_[ones]);
    }
  } else if (ones > 0) {
    parts.push(VI_DIGITS_[ones]);
  }

  return parts.join(' ');
}

function numberToVietnameseWords(amount, unitSuffix) {
  const num = Math.round(Number(amount) || 0);
  if (isNaN(num) || num <= 0) return '';

  const scales = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'];
  const groups = [];
  let temp = num;
  while (temp > 0) {
    groups.push(temp % 1000);
    temp = Math.floor(temp / 1000);
  }

  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    const grp = groups[i];
    if (grp === 0) continue;
    const isMostSignificant = i === groups.length - 1;
    const text = readVietnameseTriplet_(grp, !isMostSignificant);
    if (text) {
      parts.push(scales[i] ? (text + ' ' + scales[i]) : text);
    }
  }

  const joined = parts.join(' ').replace(/\s+/g, ' ').trim();
  if (!joined) return '';
  const capitalized = joined.charAt(0).toUpperCase() + joined.slice(1);
  return unitSuffix ? (capitalized + ' ' + unitSuffix) : capitalized;
}

function generateTotalContainersText(containers) {
  const list = Array.isArray(containers) ? containers : [];
  const activeRows = list.filter(function (c) {
    if (!c || typeof c !== 'object') return false;
    return [c.CONT, c.SEAL, c.CTYPE, c.CSIZE, c.PACK, c.GW, c.VGM_WEI, c.CBM].some(function (v) {
      return v != null && String(v).trim() !== '';
    });
  });

  if (activeRows.length === 0) return '';

  const countsByType = {};
  const orderedTypes = [];

  activeRows.forEach(function (c) {
    const rawType = extractShortCodeForExport_(c.CTYPE || c.CSIZE || '', 'CTYPE').toUpperCase();
    const key = rawType || '__GENERIC__';
    if (!countsByType[key]) {
      countsByType[key] = 0;
      orderedTypes.push(key);
    }
    countsByType[key]++;
  });

  if (orderedTypes.length === 1) {
    const typeKey = orderedTypes[0];
    const count = countsByType[typeKey];
    const word = numberToEnglishIntWords_(count);
    const padded = count < 10 ? ('0' + count) : String(count);
    const contNoun = count === 1 ? 'CONTAINER' : 'CONTAINERS';
    if (typeKey === '__GENERIC__') {
      return 'SAY: ' + word + ' (' + padded + ') ' + contNoun + ' ONLY';
    }
    return 'SAY: ' + word + ' (' + padded + ') X ' + typeKey + ' ' + contNoun + ' ONLY';
  }

  const segments = orderedTypes.map(function (typeKey) {
    const count = countsByType[typeKey];
    const word = numberToEnglishIntWords_(count);
    const padded = count < 10 ? ('0' + count) : String(count);
    return typeKey === '__GENERIC__'
      ? (word + ' (' + padded + ')')
      : (word + ' (' + padded + ') X ' + typeKey);
  });

  return 'SAY: ' + segments.join(' AND ') + ' CONTAINERS ONLY';
}

function recalculateAllTotals(syncDom, updateContainerCount, options) {
  const opts = options || {};
  const sourceKey = opts.sourceKey || '';
  const targetDocKey = opts.targetDocKey || APP_STATE.activeTab || '';
  const items = APP_STATE.items || [];
  const containers = APP_STATE.containers || [];
  const manualFlags = APP_STATE.manualFlags || {};
  const exRate = parseNum(APP_STATE.shared.EX_RATE);
  const curr = String(APP_STATE.shared.CURR || '').trim();

  let totQty = 0;
  let totAmt = 0;
  let totItemPack = 0;
  let totNw = 0;
  let totItemGw = 0;
  let totItemCbm = 0;
  let firstUnit = '';

  let totExTax = 0;
  let totFee = 0;

  items.forEach(function (it, idx) {
    if (!firstUnit && it.UNIT) firstUnit = String(it.UNIT).trim();

    const qty = parseNum(it.QTY);
    const price = parseNum(it.PRICE);
    if ((it.QTY !== '' || it.PRICE !== '') && it.AMT === '') {
      it.AMT = formatNum(qty * price, 2);
    }
    const amt = parseNum(it.AMT);

    totQty += qty;
    totAmt += amt;
    totItemPack += parseNum(it.PACK);
    totNw += parseNum(it.NW);
    totItemGw += parseNum(it.GW);
    totItemCbm += parseNum(it.CBM);

    // Export Customs Declaration row calculations
    if (sourceKey === 'EX_RATE' || sourceKey === 'ITEM_MUTATION' || (it.EX_VAL === '' && exRate > 0 && amt > 0)) {
      if (exRate > 0 && (amt > 0 || it.AMT !== '')) {
        it.EX_VAL = formatNum(amt * exRate, 2);
      } else if (sourceKey === 'EX_RATE' && exRate === 0) {
        it.EX_VAL = '';
      }
      if (syncDom) {
        syncTableCellToDOM('items', idx, 'EX_VAL', it.EX_VAL, null);
      }
    }

    const exVal = parseNum(it.EX_VAL);
    const exTaxRate = parseNum(it.EX_TAX_RATE);
    const exAmt = exVal * (exTaxRate / 100);
    const hasExInput = it.EX_VAL !== '' || it.EX_TAX_RATE !== '';
    it.EX_AMT = hasExInput ? formatNum(exAmt, 2) : '';

    const feeVal = parseNum(it.FEE_VAL);
    const feeRate = parseNum(it.FEE_RATE);
    const feeAmt = feeVal * (feeRate / 100);
    const hasFeeInput = it.FEE_VAL !== '' || it.FEE_RATE !== '';
    it.FEE_AMT = hasFeeInput ? formatNum(feeAmt, 2) : '';

    if (syncDom) {
      syncTableCellToDOM('items', idx, 'EX_AMT', it.EX_AMT, null);
      syncTableCellToDOM('items', idx, 'FEE_AMT', it.FEE_AMT, null);
    }

    totExTax += exAmt;
    totFee += feeAmt;
  });

  let totContPack = 0;
  let totContGw = 0;
  let totContCbm = 0;
  let totVgm = 0;

  containers.forEach(function (c) {
    totContPack += parseNum(c.PACK);
    const gw = parseNum(c.GW);
    const vgm = parseNum(c.VGM_WEI);
    totContGw += gw;
    totContCbm += parseNum(c.CBM);
    totVgm += vgm > 0 ? vgm : gw;
  });

  const totPack = totItemPack > 0 ? totItemPack : totContPack;
  const totGw = totItemGw > 0 ? totItemGw : totContGw;
  const totCbm = totItemCbm > 0 ? totItemCbm : totContCbm;

  // Commercial Invoice VAT & Grand Total
  const vatGstRate = parseNum(APP_STATE.shared.VAT_GST);
  const vatTotalNum = totAmt * (vatGstRate / 100);
  const grandTotalNum = totAmt + vatTotalNum;

  // Export Customs Declaration totals
  const xkTotTax = totExTax + totFee;

  // Import Customs Declaration cascading calculations
  let imValNum = parseNum(APP_STATE.shared.IM_VAL);
  const shouldAutoImVal =
    !manualFlags.IM_VAL &&
    (sourceKey === 'EX_RATE' || sourceKey === 'QTY' || sourceKey === 'PRICE' || sourceKey === 'ITEM_MUTATION' ||
      (APP_STATE.shared.IM_VAL == null || String(APP_STATE.shared.IM_VAL).trim() === ''));

  if (shouldAutoImVal && totAmt > 0 && exRate > 0) {
    imValNum = totAmt * exRate;
  } else if (shouldAutoImVal && (totAmt === 0 || exRate === 0) && (sourceKey === 'EX_RATE' || sourceKey === 'ITEM_MUTATION')) {
    imValNum = 0;
  }

  const imRateNum = parseNum(APP_STATE.shared.IM_RATE);
  const imAmtNum = imValNum * (imRateNum / 100);

  const sctRateNum = parseNum(APP_STATE.shared.SCT_RATE);
  let sctValNum = parseNum(APP_STATE.shared.SCT_VAL);
  if (!manualFlags.SCT_VAL) {
    sctValNum = sctRateNum > 0 ? (imValNum + imAmtNum) : 0;
  }
  const sctAmtNum = sctValNum * (sctRateNum / 100);

  const eptValNum = parseNum(APP_STATE.shared.EPT_VAL);
  const eptRateNum = parseNum(APP_STATE.shared.EPT_RATE);
  const eptAmtNum = eptValNum * eptRateNum;

  const vatRateNkNum = parseNum(APP_STATE.shared.VAT_RATE);
  let vatValNkNum = parseNum(APP_STATE.shared.VAT_VAL);
  if (!manualFlags.VAT_VAL) {
    vatValNkNum = vatRateNkNum > 0 ? (imValNum + imAmtNum + sctAmtNum + eptAmtNum) : 0;
  }
  const vatAmtNkNum = vatValNkNum * (vatRateNkNum / 100);

  const nkTotTax = imAmtNum + sctAmtNum + eptAmtNum + vatAmtNkNum;

  // Determine active/relevant TOT_TAX (To_khai_XK vs To_khai_NK)
  const useNkTax =
    targetDocKey === 'To_khai_NK' ||
    (targetDocKey !== 'To_khai_XK' &&
      (APP_STATE.lastTaxTab === 'To_khai_NK' || (nkTotTax > 0 && xkTotTax === 0)));

  const activeTotTax = useNkTax ? nkTotTax : xkTotTax;
  const hasAnyTaxActivity = useNkTax
    ? (imValNum > 0 || imRateNum > 0 || sctRateNum > 0 || eptRateNum > 0 || vatRateNkNum > 0)
    : (totExTax > 0 || totFee > 0 || items.some(function (it) { return it.EX_VAL !== '' || it.EX_TAX_RATE !== '' || it.FEE_VAL !== '' || it.FEE_RATE !== ''; }));

  // Word conversions
  const wordsTargetAmount =
    (targetDocKey === 'QUOTATION' || targetDocKey === 'SALES_CONTRACT')
      ? totAmt
      : grandTotalNum;

  const updates = {
    TOT_QTY: totQty > 0 ? formatNum(totQty, 3) : (items.length ? '0' : ''),
    TOT_AMT: totAmt > 0 ? formatNum(totAmt, 2) : (items.length ? '0' : ''),
    VAT_TOTAL: (APP_STATE.shared.VAT_GST !== undefined && String(APP_STATE.shared.VAT_GST).trim() !== '')
      ? formatNum(vatTotalNum, 2)
      : (totAmt > 0 ? '0' : ''),
    GRAND_TOTAL: grandTotalNum > 0 ? formatNum(grandTotalNum, 2) : (items.length ? '0' : ''),
    TOT_AMT_WORDS: wordsTargetAmount > 0 ? numberToEnglishCurrencyWords(wordsTargetAmount, curr) : '',
    TOT_PACK: totPack > 0 ? formatNum(totPack, 2) : '',
    TOT_NW: totNw > 0 ? formatNum(totNw, 3) : '',
    TOT_GW: totGw > 0 ? formatNum(totGw, 3) : '',
    TOT_CBM: totCbm > 0 ? formatNum(totCbm, 3) : '',
    TOT_VGM: totVgm > 0 ? formatNum(totVgm, 3) : '',
    TOT_EX_TAX: formatNum(totExTax, 2),
    TOT_FEE: formatNum(totFee, 2),
    IM_AMT: (imValNum > 0 || imRateNum > 0) ? formatNum(imAmtNum, 2) : '',
    SCT_AMT: (sctValNum > 0 || sctRateNum > 0) ? formatNum(sctAmtNum, 2) : '',
    EPT_AMT: (eptValNum > 0 || eptRateNum > 0) ? formatNum(eptAmtNum, 2) : '',
    VAT_AMT: (vatValNkNum > 0 || vatRateNkNum > 0) ? formatNum(vatAmtNkNum, 2) : '',
    TOT_TAX: hasAnyTaxActivity ? formatNum(activeTotTax, 2) : '',
    TOT_TAX_WORDS: activeTotTax > 0 ? numberToVietnameseWords(activeTotTax, 'đồng') : ''
  };

  if (shouldAutoImVal) {
    updates.IM_VAL = imValNum > 0 ? formatNum(imValNum, 2) : '';
  }
  if (!manualFlags.SCT_VAL) {
    updates.SCT_VAL = sctRateNum > 0 ? formatNum(sctValNum, 2) : '';
  }
  if (!manualFlags.VAT_VAL) {
    updates.VAT_VAL = vatRateNkNum > 0 ? formatNum(vatValNkNum, 2) : '';
  }

  if (updateContainerCount || !manualFlags.TOTAL_CONTAINERS_TEXT || !APP_STATE.shared.TOTAL_CONTAINERS_TEXT) {
    updates.TOTAL_CONTAINERS_TEXT = generateTotalContainersText(containers);
  }

  if (!APP_STATE.shared.TOT_UNIT && firstUnit) {
    updates.TOT_UNIT = extractShortCodeForExport_(firstUnit, 'UNIT');
  }

  Object.keys(updates).forEach(function (k) {
    if (syncDom) {
      setSharedFieldAndSync(k, updates[k]);
    } else {
      APP_STATE.shared[k] = updates[k];
    }
  });
}
</script>
