function generateTotalContainersText(containers) {
  const list = Array.isArray(containers) ? containers : [];
  const activeRows = list.filter(function (c) {
    if (!c || typeof c !== 'object') return false;
    return [c.CONT, c.SEAL, c.CTYPE, c.CSIZE, c.PACK, c.GW, c.VGM_WEI, c.CBM].some(function (v) {
      return v != null && String(v).trim() !== '';
    });
  });

  if (activeRows.length === 0) return '';

  const countsByType = {};
  const orderedTypes = [];

  activeRows.forEach(function (c) {
    const rawType = extractShortCodeForExport_(c.CTYPE || c.CSIZE || '', 'CTYPE').toUpperCase();
    const key = rawType || '__GENERIC__';
    if (!countsByType[key]) {
      countsByType[key] = 0;
      orderedTypes.push(key);
    }
    countsByType[key]++;
  });

  if (orderedTypes.length === 1) {
    const typeKey = orderedTypes[0];
    const count = countsByType[typeKey];
    const word = numberToEnglishIntWords_(count);
    const padded = count < 10 ? ('0' + count) : String(count);
    const contNoun = count === 1 ? 'CONTAINER' : 'CONTAINERS';
    if (typeKey === '__GENERIC__') {
      return word + ' (' + padded + ') ' + contNoun + ' ONLY';
    }
    return word + ' (' + padded + ') X ' + typeKey + ' ' + contNoun + ' ONLY';
  }

  const segments = orderedTypes.map(function (typeKey) {
    const count = countsByType[typeKey];
    const word = numberToEnglishIntWords_(count);
    const padded = count < 10 ? ('0' + count) : String(count);
    return typeKey === '__GENERIC__'
      ? (word + ' (' + padded + ')')
      : (word + ' (' + padded + ') X ' + typeKey);
  });

  return segments.join(' AND ') + ' CONTAINERS ONLY';
}

function recalculateAllTotals(syncDom, updateContainerCount, options) {
  const opts = options || {};
  const sourceKey = opts.sourceKey || '';
  const targetDocKey = opts.targetDocKey || APP_STATE.activeTab || '';
  const items = APP_STATE.items || [];
  const containers = APP_STATE.containers || [];
  const manualFlags = APP_STATE.manualFlags || {};
  const exRate = parseNum(APP_STATE.shared.EX_RATE);
  const curr = getActiveCurrencyCode_();

  let totQty = 0;
  let totAmt = 0;
  let totItemPack = 0;
  let totNw = 0;
  let totItemGw = 0;
  let totItemCbm = 0;
  let firstUnit = '';

  let totExTax = 0;
  let totFee = 0;

  items.forEach(function (it, idx) {
    if (!firstUnit && it.UNIT) firstUnit = String(it.UNIT).trim();

    const qty = parseNum(it.QTY);
    const price = parseNum(it.PRICE);
    if ((it.QTY !== '' || it.PRICE !== '') && it.AMT === '') {
      it.AMT = formatNumMin2Decimals_(qty * price, 2);
    }
    const amt = parseNum(it.AMT);

    totQty += qty;
    totAmt += amt;
    totItemPack += parseNum(it.PACK);
    totNw += parseNum(it.NW);
    totItemGw += parseNum(it.GW);
    totItemCbm += parseNum(it.CBM);

    // Export Customs Declaration row calculations
    if (sourceKey === 'EX_RATE' || sourceKey === 'ITEM_MUTATION' || (it.EX_VAL === '' && exRate > 0 && amt > 0)) {
      if (exRate > 0 && (amt > 0 || it.AMT !== '')) {
        it.EX_VAL = formatNumMin2Decimals_(amt * exRate, 2);
      } else if (sourceKey === 'EX_RATE' && exRate === 0) {
        it.EX_VAL = '';
      }
      if (syncDom) {
        syncTableCellToDOM('items', idx, 'EX_VAL', it.EX_VAL, null);
      }
    }

    const exVal = parseNum(it.EX_VAL);
    const exTaxRate = parseNum(it.EX_TAX_RATE);
    const exAmt = exVal * (exTaxRate / 100);
    const hasExInput = it.EX_VAL !== '' || it.EX_TAX_RATE !== '';
    it.EX_AMT = hasExInput ? formatNumMin2Decimals_(exAmt, 2) : '';

    const feeVal = parseNum(it.FEE_VAL);
    const feeRate = parseNum(it.FEE_RATE);
    const feeAmt = feeVal * (feeRate / 100);
    const hasFeeInput = it.FEE_VAL !== '' || it.FEE_RATE !== '';
    it.FEE_AMT = hasFeeInput ? formatNumMin2Decimals_(feeAmt, 2) : '';

    if (syncDom) {
      syncTableCellToDOM('items', idx, 'EX_AMT', it.EX_AMT, null);
      syncTableCellToDOM('items', idx, 'FEE_AMT', it.FEE_AMT, null);
    }

    totExTax += exAmt;
    totFee += feeAmt;
  });

  let totContPack = 0;
  let totContGw = 0;
  let totContCbm = 0;
  let totVgm = 0;

  containers.forEach(function (c) {
    totContPack += parseNum(c.PACK);
    const gw = parseNum(c.GW);
    const vgm = parseNum(c.VGM_WEI);
    totContGw += gw;
    totContCbm += parseNum(c.CBM);
    totVgm += vgm > 0 ? vgm : gw;
  });

  const totPack = totItemPack > 0 ? totItemPack : totContPack;
  const totGw = totItemGw > 0 ? totItemGw : totContGw;
  const totCbm = totItemCbm > 0 ? totItemCbm : totContCbm;

  // Commercial Invoice VAT & Grand Total + Letter of Credit Grand Total
  const vatGstRate = parseNum(APP_STATE.shared.VAT_GST);
  const vatTotalNum = totAmt * (vatGstRate / 100);
  const ciGrandTotalNum = totAmt + vatTotalNum;
  const freightAmtNum = parseNum(APP_STATE.shared.FREIGHT_AMT);
  const insAmtNum = parseNum(APP_STATE.shared.INS_AMT);
  const lcGrandTotalNum = totAmt + freightAmtNum + insAmtNum;
  const grandTotalNum = targetDocKey === 'LETTER_OF_CREDIT' ? lcGrandTotalNum : ciGrandTotalNum;

  // Export Customs Declaration totals
  const xkTotTax = totExTax + totFee;

  // Import Customs Declaration cascading calculations
  let imValNum = parseNum(APP_STATE.shared.IM_VAL);
  const shouldAutoImVal =
    !manualFlags.IM_VAL &&
    (sourceKey === 'EX_RATE' || sourceKey === 'QTY' || sourceKey === 'PRICE' || sourceKey === 'ITEM_MUTATION' ||
      (APP_STATE.shared.IM_VAL == null || String(APP_STATE.shared.IM_VAL).trim() === ''));

  if (shouldAutoImVal && totAmt > 0 && exRate > 0) {
    imValNum = totAmt * exRate;
  } else if (shouldAutoImVal && (totAmt === 0 || exRate === 0) && (sourceKey === 'EX_RATE' || sourceKey === 'ITEM_MUTATION')) {
    imValNum = 0;
  }

  const imRateNum = parseNum(APP_STATE.shared.IM_RATE);
  const imAmtNum = imValNum * (imRateNum / 100);

  const sctRateNum = parseNum(APP_STATE.shared.SCT_RATE);
  let sctValNum = parseNum(APP_STATE.shared.SCT_VAL);
  if (!manualFlags.SCT_VAL) {
    sctValNum = sctRateNum > 0 ? (imValNum + imAmtNum) : 0;
  }
  const sctAmtNum = sctValNum * (sctRateNum / 100);

  const eptValNum = parseNum(APP_STATE.shared.EPT_VAL);
  const eptRateNum = parseNum(APP_STATE.shared.EPT_RATE);
  const eptAmtNum = eptValNum * eptRateNum;

  const vatRateNkNum = parseNum(APP_STATE.shared.VAT_RATE);
  let vatValNkNum = parseNum(APP_STATE.shared.VAT_VAL);
  if (!manualFlags.VAT_VAL) {
    vatValNkNum = vatRateNkNum > 0 ? (imValNum + imAmtNum + sctAmtNum + eptAmtNum) : 0;
  }
  const vatAmtNkNum = vatValNkNum * (vatRateNkNum / 100);

  const nkTotTax = imAmtNum + sctAmtNum + eptAmtNum + vatAmtNkNum;

  // Determine active/relevant TOT_TAX (To_khai_XK vs To_khai_NK)
  const useNkTax =
    targetDocKey === 'To_khai_NK' ||
    (targetDocKey !== 'To_khai_XK' &&
      (APP_STATE.lastTaxTab === 'To_khai_NK' || (nkTotTax > 0 && xkTotTax === 0)));

  const activeTotTax = useNkTax ? nkTotTax : xkTotTax;
  const hasAnyTaxActivity = useNkTax
    ? (imValNum > 0 || imRateNum > 0 || sctRateNum > 0 || eptRateNum > 0 || vatRateNkNum > 0)
    : (totExTax > 0 || totFee > 0 || items.some(function (it) { return it.EX_VAL !== '' || it.EX_TAX_RATE !== '' || it.FEE_VAL !== '' || it.FEE_RATE !== ''; }));

  // Word conversions
  const wordsVi = totAmt > 0 ? numberToVietnameseCurrencyWords(totAmt, curr) : '';
  const wordsSc = totAmt > 0 ? numberToEnglishCurrencyWords(totAmt, curr) : '';
  const wordsCi = grandTotalNum > 0 ? numberToEnglishCurrencyWords(grandTotalNum, curr) : '';

  let activeAmtWords = wordsCi;
  if (targetDocKey === 'QUOTATION') {
    activeAmtWords = wordsVi;
  } else if (targetDocKey === 'SALES_CONTRACT') {
    activeAmtWords = wordsSc;
  }

  const updates = {
    TOT_QTY: totQty > 0 ? formatNum(totQty, 3) : (items.length ? '0' : ''),
    TOT_AMT: totAmt > 0 ? formatNumMin2Decimals_(totAmt, 2) : (items.length ? '0.00' : ''),
    VAT_TOTAL: (APP_STATE.shared.VAT_GST !== undefined && String(APP_STATE.shared.VAT_GST).trim() !== '')
      ? formatNumMin2Decimals_(vatTotalNum, 2)
      : (totAmt > 0 ? '0.00' : ''),
    GRAND_TOTAL: grandTotalNum > 0 ? formatNumMin2Decimals_(grandTotalNum, 2) : (items.length ? '0.00' : ''),
    TOT_AMT_WORDS: activeAmtWords,
    TOT_AMT_WORDS_VI: wordsVi,
    TOT_AMT_WORDS_SC: wordsSc,
    TOT_AMT_WORDS_CI: wordsCi,
    TOT_PACK: totPack > 0 ? formatNum(totPack, 2) : '',
    TOT_NW: totNw > 0 ? formatNumMin2Decimals_(totNw, 3) : '',
    TOT_GW: totGw > 0 ? formatNumMin2Decimals_(totGw, 3) : '',
    TOT_CBM: totCbm > 0 ? formatNumMin2Decimals_(totCbm, 3) : '',
    TOT_VGM: totVgm > 0 ? formatNumMin2Decimals_(totVgm, 3) : '',
    TOT_EX_TAX: formatNumMin2Decimals_(totExTax, 2),
    TOT_FEE: formatNumMin2Decimals_(totFee, 2),
    IM_AMT: (imValNum > 0 || imRateNum > 0) ? formatNumMin2Decimals_(imAmtNum, 2) : '',
    SCT_AMT: (sctValNum > 0 || sctRateNum > 0) ? formatNumMin2Decimals_(sctAmtNum, 2) : '',
    EPT_AMT: (eptValNum > 0 || eptRateNum > 0) ? formatNumMin2Decimals_(eptAmtNum, 2) : '',
    VAT_AMT: (vatValNkNum > 0 || vatRateNkNum > 0) ? formatNumMin2Decimals_(vatAmtNkNum, 2) : '',
    TOT_TAX: hasAnyTaxActivity ? formatNumMin2Decimals_(activeTotTax, 2) : '',
    TOT_TAX_WORDS: activeTotTax > 0 ? numberToVietnameseWords(activeTotTax, 'đồng') : ''
  };

  if (shouldAutoImVal) {
    updates.IM_VAL = imValNum > 0 ? formatNumMin2Decimals_(imValNum, 2) : '';
  }
  if (!manualFlags.SCT_VAL) {
    updates.SCT_VAL = sctRateNum > 0 ? formatNumMin2Decimals_(sctValNum, 2) : '';
  }
  if (!manualFlags.VAT_VAL) {
    updates.VAT_VAL = vatRateNkNum > 0 ? formatNumMin2Decimals_(vatValNkNum, 2) : '';
  }

  if (updateContainerCount || !manualFlags.TOTAL_CONTAINERS_TEXT || !APP_STATE.shared.TOTAL_CONTAINERS_TEXT) {
    updates.TOTAL_CONTAINERS_TEXT = generateTotalContainersText(containers);
  }

  if (!APP_STATE.shared.TOT_UNIT && firstUnit) {
    updates.TOT_UNIT = extractShortCodeForExport_(firstUnit, 'UNIT');
  }

  Object.keys(updates).forEach(function (k) {
    if (syncDom) {
      setSharedFieldAndSync(k, updates[k]);
    } else {
      APP_STATE.shared[k] = updates[k];
    }
  });

  if (syncDom) {
    updateCurrencyBadgesInDOM_();
  }
}
</script>
